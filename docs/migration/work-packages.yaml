  - id: wp-p2-01
    phase: 2
    title: "Réconcilier le registre de migration et la documentation"
    size: S
    effort_pweeks: 0.5
    depends_on: [wp-p1-00-decomposition]
    precondition: "Comparer les statuts du manifeste, des fichiers state et de STATE.md à l'état de fusion réel des PR Phase 1 ; relever les faits obsolètes dans ETAT_DU_PROJET.md. Idempotent : ne modifier que les écarts avérés et ne jamais réécrire log.jsonl."
    steps:
      - "Réconcilier work-packages.yaml, STATE.md, state/*.json et log.jsonl avec les PR certigo-content #1 à #4 fusionnées."
      - "Mettre à jour l'issue de suivi #197 avec les mêmes statuts et preuves."
      - "Désigner certigo-content comme source éditoriale active dans README.md, ARCHITECTURE.md et ETAT_DU_PROJET.md."
      - "Ajouter le validateur du registre et sa gate CI dédiée."
      - "Inscrire wp-p2-01..09 avec leurs préconditions, étapes, DoD et rollback."
    dod: "Les lots Phase 1 dont la DoD complète est satisfaite sont à done dans work-packages.yaml, state/*.json et STATE.md ; les lots incomplets restent ouverts même si une PR associée a été fusionnée ; chaque transition de réconciliation est ajoutée à log.jsonl ; ETAT_DU_PROJET.md reflète l'état courant ; YAML, tous les JSON et chaque ligne JSONL parsent ; aucun code applicatif, IaC, dépendance ou test n'est modifié ; branche poussée et PR prête pour revue."
    rollback: "Revert du commit documentaire de réconciliation ; aucun code, aucune infrastructure et aucune donnée applicative ne sont touchés."
    status: done
    notes: "Premier lot Phase 2 ; PR #251 fusionnée dans origin/main au commit 90933206abf02557d34aea6dfd5ae41f7cd0b774. wp-p2-02..09 ont été enregistrés initialement à todo ; leurs transitions ultérieures sont réconciliées séparément."

  - id: wp-p2-02
    phase: 2
    title: "Rendre l'outillage de contenu reproductible"
    size: M
    effort_pweeks: 1
    depends_on: [wp-p1-00-decomposition]
    precondition: "Si un lockfile suivi existe, que tous les workflows utilisent npm ci et que les tests couvrent les invariants du lot, considérer le lot comme terminé."
    steps:
      - "Ajouter package.json et package-lock.json, épingler Node 20 et les versions d'AJV, ajv-formats et glob."
      - "Ajouter les scripts validate, manifest:check, manifest:generate, package et test."
      - "Remplacer les npm install --no-save des workflows par npm ci."
      - "Tester BOM, JSON invalide, doublons, orphelins, fuite publique, déterminisme et vecteur golden."
      - "Ajouter un scan OSV/npm, un SBOM de l'outillage et documenter l'exécution locale."
    dod: "npm ci, npm test, npm run validate et npm run manifest:check sont verts ; le même commit résout le même graphe de dépendances ; la CI ne contient plus d'installation Node non verrouillée ; le README documente contribution, validation et modèle public/privé."
    rollback: "Revert de la PR ; les scripts .mjs actuels restent inchangés fonctionnellement."
    status: done
    notes: "Source : gchambaud_microsoft/certigo-content#6. PR #7 fusionnée (194f88e2de867c5f4aaf3238a32530fdb0f4751e) après validation des trois checks requis. Lot indépendant de wp-p2-01."

  - id: wp-p2-03
    phase: 2
    title: "Séparer réellement les artefacts de contenu public et privé"
    size: M
    effort_pweeks: 1
    depends_on: [wp-p2-02]
    precondition: "Si les deux artefacts sont déjà produits séparément, reproductibles et couverts par une gate anti-fuite sur la sortie finale, le lot est terminé."
    steps:
      - "Ajouter tools/package_content.mjs et générer dist/public, dist/private et dist/reports dans une zone propre."
      - "Produire des manifestes et hashes distincts pour les deux canaux."
      - "Inspecter récursivement l'artefact public et interdire les chemins answerKey et les clés correct/rationale."
      - "Vérifier la déclaration et le hash de chaque fichier, puis publier deux artefacts nommés avec leur manifestId."
      - "Interdire au workflow mobile l'artefact privé et documenter rétention, immutabilité et publication."
    dod: "Une commande produit deux paquets séparés ; deux exécutions sur le même commit sont byte-identical ; une fuite injectée dans dist/public fait échouer la CI ; l'artefact public ne contient aucun corrigé ; le paquet privé n'est accessible à aucun job mobile."
    rollback: "Désactiver le nouveau workflow et revenir au manifeste indicatif actuel ; aucune release n'est activée automatiquement."
    status: done
    notes: "Source : gchambaud_microsoft/certigo-content#5. PR #8 fusionnée (470acdbf100e7f7faf9911015662bee6118b8bf5) après validation des six checks requis."

  - id: wp-p2-04
    phase: 2
    title: "Importer les releases de contenu dans le backend avec rollback par manifestId"
    size: M
    effort_pweeks: 1
    depends_on: [wp-p2-03]
    precondition: "Si le backend importe déjà une release vérifiée, idempotente et restaurable par manifeste, le lot est terminé."
    steps:
      - "Définir et versionner le contrat d'import public/privé, puis vérifier tous les SHA-256 avant écriture."
      - "Rendre l'import idempotent par manifestId et séparer les accès aux questions publiques et corrigés."
      - "Enregistrer les versions active et précédente, ajouter promotion staging vers prod et rollback N-1."
      - "Exposer uniquement le manifeste public actif et tester qu'aucun endpoint ne sérialise answerKey, correct ou rationale."
      - "Instrumenter import, promotion, rejet et rollback dans Application Insights."
    dod: "Import répété sans doublon ; hash invalide rejeté avant mutation ; rollback N-1 testé en staging ; tests HTTP anti-fuite verts ; le backend expose le manifestId public actif."
    rollback: "Réactiver le manifeste précédent ; conserver les artefacts immuables et ne supprimer aucune version pendant le lot."
    status: done
    notes: "Source : gchambaud_microsoft/Certigo#244. PR #363 ouverte (session ec84447b-5c18-4c12-be65-9cdf8f0f8b27) : code content-release porté depuis la PR draft #304 (superseded, alignée sur certigo-content ADR-0005) vers une branche neuve basée sur main, en excluant son diff de gouvernance/CI sans rapport. PRs #257, #259, #304 fermées au profit de #363. Backend (831 tests)/IaC (bicep + 36 tests)/mobile (84 Dart + 435 Flutter + 11 golden) validés verts. Reste en in_review : la DoD exige un rollback N-1 prouvé en staging (hors périmètre de la PR). Clôture du 2026-09-25 : DoD complète. Import répété sans doublon (rejeux 200, staging et dev) ; hash invalide rejeté avant mutation (test A_single_altered_byte_in_a_package_file_is_rejected_before_any_store_mutation) ; rollback N-1 testé en staging le 2026-09-25 (tools/content_release_drill.py, 17 contrôles, R1 servie après rollback, second rollback 409, staging laissé sur R2 sha256:95c69c30…) avec l'identité opérateur Content.Release.Admin réelle, retirée ensuite ; tests HTTP anti-fuite verts ; le backend expose le manifestId public actif (ETag et X-Content-Manifest-Id). Preuve : docs/migration/evidence/2026-09-25-content-release-drill.json. Prérequis corrigés en chemin : #511 (lifecycle.transition) et #512 (audience CIAM v2)."

