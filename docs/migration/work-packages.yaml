  - id: wp-p2-07
    phase: 2
    title: "Supprimer le SPOF des runners self-hosted"
    size: M
    effort_pweeks: 1
    depends_on: [wp-p1-00-decomposition]
    precondition: "Précondition locale au registre : inventorier la capacité et simuler la perte d'un runner ; si les gates basculent et qu'un runner est reconstruisible depuis une définition versionnée, le lot est terminé."
    steps:
      - "Inventorier runners, labels, versions SDK et workflows critiques, puis ajouter une sonde quotidienne des dépendances externes, du disque et des SDK."
      - "Provisionner au moins deux runners Linux interchangeables avec image ou bootstrap complet et idempotent."
      - "Séparer la capacité PR non fiable de la capacité de déploiement production."
      - "Vérifier les binaires par checksum/provenance et documenter panne, rotation, reconstruction et révocation."
      - "Exécuter et consigner un exercice arrêt, basculement et reconstruction depuis zéro."
    dod: "La perte d'un runner ne bloque pas les gates critiques ; un runner est reconstruisible depuis la définition versionnée ; l'exercice de reprise est consigné avec durée et preuves ; permissions, fork guards et environnements restent actifs."
    rollback: "Conserver l'ancien runner pendant la validation ; revenir aux labels précédents sans changement applicatif."
    status: done
    notes: "Source : gchambaud_microsoft/Certigo#249 (close le 2026-08-07). PR #250 et PR #253 fusionnées (2026-08-06) : IaC versionnée, sonde quotidienne et drill de reconstruction (run 31090379901) exécutés et verts sur les anciennes VM. Sur l'architecture VMSS actuelle, la DoD est prouvée le 2026-09-25 : perte d'un runner PR sans blocage des gates (drill du 2026-09-23, 68 jobs absorbés par les 3 autres runners, retour en 7 min 32 s) ; reprise nocturne dynamique de #513 réussie en automatique les 24 et 25/09 ; reconstruction depuis la définition versionnée (drill du 2026-09-25 : pilot.bicep et bootstrap.sh de main dans un groupe dédié avec une pile réseau neuve, runner enregistré par register-pilot.ps1 -RebuildDrill de #540 avec un label qu'aucun workflow ne cible, 0 job réel, puis runner et groupe supprimés) ; permissions, fork guards et environnements inchangés. Les sept instances PR retirées ont été supprimées le 2026-09-25. Bornes : le pool PR en service n'a pas été remplacé et exécute toujours un bootstrap jamais revu (#528) ; l'enregistrement reste manuel par conception. Preuves dans state/wp-p2-07.json et docs/CI_RUNNER_RESILIENCE.md. Ce lot est indépendant de la chaîne de contenu."

