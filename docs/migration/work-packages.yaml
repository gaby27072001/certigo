  - id: wp-p2-09
    phase: 2
    title: "Organiser les migrations de dépendances majeures"
    size: M
    effort_pweeks: 1
    depends_on: [wp-p1-00-decomposition]
    precondition: "Précondition locale au registre : inventorier les mises à jour majeures et leurs PR ; si chaque domaine possède un lot isolé, des versions alignées, des tests staging/appareil et un rollback indépendant, le lot est terminé."
    steps:
