      - "Découper SDK/toolchain, auth/secure storage, navigation, notifications et UI/icônes ; réutiliser l'issue #155 pour icônes/polices."
      - "Remplacer les PR Dependabot groupées par des PR ciblées et isoler Microsoft.Azure.Functions.Worker.Sdk 2.x."
      - "Valider Functions par metadata, func start, publish, staging, health, routes, middleware et App Insights."
      - "Valider mobile sur Android/iOS réel, OIDC, secure storage, notifications et build store, avec rollback par major."
    dod: "Une PR ne mélange pas plusieurs migrations majeures sans lien ; Flutter est identique dans les environnements supportés ; tests CI, staging et appareils réels verts ; PR Dependabot obsolètes fusionnées, remplacées ou fermées avec justification."
    rollback: "Pins et lockfiles antérieurs conservés par lot ; rollback indépendant pour chaque groupe fonctionnel."
    status: in_progress
    notes: "Source : gchambaud_microsoft/Certigo#248 (ouverte) + #155 (ouverte, migration font_awesome_flutter/google_fonts). PR #252 fusionnée 2026-08-06 : sous-lot explicitement scopé (vendoring icônes/polices Prism) livré ; le corps de la PR déclare lui-même « belongs to #248/#155 » et liste les lots restants (validation réelle Android/iOS, disposition des PR Dependabot obsolètes) — #248/#155 restent donc ouvertes à raison, `in_progress` est le statut correct (vérifié `gh pr view 252` + `gh issue view 155` le 2026-09-03)."

