# =============================================================================
# codemagic.yaml - Certigo iOS CI/CD (Codemagic)
# =============================================================================
# iOS builds run on Codemagic macOS instances (GitHub-hosted macOS runners are
# blocked by the EMU policy on GitHub Enterprise). Android release stays on
# GitHub Actions (.github/workflows/release-android.yml).
#
# ONE-TIME DASHBOARD SETUP (full runbook in docs/RELEASE_MOBILE.md):
#   1. Connect this GitHub repo to a Codemagic app.
#   2. Teams > Integrations > App Store Connect: add an integration named
#      exactly "AppStoreConnect" (App Store Connect API key: Key ID, Issuer ID,
#      .p8). Automatic signing uses this integration - no fastlane match, no
#      .p12, no GitHub secrets for iOS.
#   3. App > Environment variables: create the group "certigo_mobile_config"
#      (NON-secret dart-define values baked into the public binary):
#        PROD_API_BASE_URL = https://<prod-func-app>.azurewebsites.net/api
#        ENTRA_CLIENT_ID    = 4d1f1075-7bc5-4764-947b-701435a85f8c
#        ENTRA_AUTHORITY    = https://certigoapp.ciamlogin.com/af721be8-5901-422a-b299-b9c57847b968/v2.0
#        ENTRA_API_SCOPE    = api://12910b8e-6c75-4d51-91d8-4d5fb8a6e915/user_impersonation
#      Missing values keep social buttons hidden and/or break email login. Same
#      values as Android (Key Vault mobile-* / GitHub vars.MOBILE_*).
#
# WORKFLOWS:
#   ios-release         : tag v* -> signed IPA + upload to TestFlight (prod config)
#   ios-release-dry     : push main -> signed IPA, NO upload (dev config, validation)
#   ios-refresh-signing : manual only -> refresh signing profiles via ASC API
#
# Build status is reported to GitHub automatically by the Codemagic GitHub App
# (no publishing.github block - that is unsupported and fails validation).
# =============================================================================

# Reusable building blocks. Each shared script is a SINGLE step map so it can be
# referenced as one list item (`- *anchor`); this keeps the two build workflows
# in sync without drift. (A list anchor cannot be spliced into `scripts:`.)
definitions:
  signing: &ios_signing
    distribution_type: app_store
    bundle_identifier: com.certigo.mobileapp

  cache: &cache
    cache_paths:
      # Dart/Flutter package cache - the biggest, safest speed win.
      - $HOME/.pub-cache
      # CocoaPods spec + downloaded pods cache (content-keyed, safe to reuse).
      - $HOME/Library/Caches/CocoaPods

  artifacts: &artifacts
    - apps/mobile/build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
    - apps/mobile/build/ios/logs/*.log

  steps:
    - &step_pub_get
      name: Flutter pub get
      script: flutter pub get
      working_directory: apps/mobile
    - &step_analyze
      name: Static analysis (blocking gate)
      script: flutter analyze
      working_directory: apps/mobile
    - &step_test
      name: Unit tests (blocking gate)
      script: flutter test
      working_directory: apps/mobile
    - &step_use_profiles
      name: Apply provisioning profiles + generate ExportOptions.plist
      # `use-profiles` fetches the App Store profile Codemagic provisioned for the
      # bundle id (via the AppStoreConnect integration + ios_signing
      # distribution_type: app_store), applies it to Runner.xcodeproj, AND writes
      # $HOME/export_options.plist containing the REAL profile name/UUID, the
      # signing certificate, teamID FFQPC7NC68 (derived from the fetched profile)
      # and method app-store. The build step exports with THAT generated plist, so
      # no profile name is hardcoded anywhere - it always matches whatever
      # Codemagic fetches for the fresh App Store Connect key. Default output path
      # ($HOME/export_options.plist) is documented at:
      # https://github.com/codemagic-ci-cd/cli-tools/blob/master/docs/xcode-project/use-profiles.md
      script: xcode-project use-profiles
    - &step_resolve_version
      name: Resolve version from git tag or pubspec.yaml
      script: |
        set -euo pipefail
        # Base version from pubspec.yaml (e.g. 1.2.3+1 -> 1.2.3).
        PUBSPEC_VERSION="$(grep -E '^version:' apps/mobile/pubspec.yaml | head -1 | awk '{print $2}')"
        PUBSPEC_NAME="${PUBSPEC_VERSION%%+*}"
        if [ -n "${CM_TAG:-}" ]; then
          # Tag present. v1.2.3+45 -> name 1.2.3 / number 45 ; v1.2.3 -> name 1.2.3.
          TAG_WITHOUT_V="${CM_TAG#v}"
          if echo "$TAG_WITHOUT_V" | grep -q '+'; then
            BUILD_NAME="${TAG_WITHOUT_V%%+*}"
            BUILD_NUMBER="${TAG_WITHOUT_V##*+}"
          else
            BUILD_NAME="$TAG_WITHOUT_V"
            BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-1}"
          fi
        else
          BUILD_NAME="$PUBSPEC_NAME"
          BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-1}"
        fi
        echo "Resolved version: $BUILD_NAME (+$BUILD_NUMBER)"
        echo "BUILD_NAME=$BUILD_NAME"     >> "$CM_ENV"
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"

workflows:

  # ===========================================================================
  # ios-release : signed IPA + TestFlight upload. Trigger: git tag v*.
  # Production config (CERTIGO_ENV=prod, PROD_API_BASE_URL from the var group).
  # ===========================================================================
  ios-release:
    name: iOS - Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: AppStoreConnect
    environment:
      flutter: 3.27.4          # Aligned with .github/workflows/ci-mobile.yml (test<->release parity).
      xcode: latest
      cocoapods: default
      groups:
        - certigo_mobile_config   # PROD_API_BASE_URL, ENTRA_CLIENT_ID/AUTHORITY/API_SCOPE
      ios_signing: *ios_signing
      vars:
        BUNDLE_ID: com.certigo.mobileapp
        FLUTTER_APP_PATH: apps/mobile
        CERTIGO_ENV: prod
    cache: *cache
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
      cancel_previous_builds: false
    scripts:
      - *step_pub_get
      - *step_analyze
      - *step_test
      - *step_use_profiles
      - *step_resolve_version
      - name: Build signed IPA (production)
        script: |
          set -euo pipefail
          flutter build ipa --release \
            --dart-define=CERTIGO_ENV="$CERTIGO_ENV" \
            --dart-define=API_BASE_URL="$PROD_API_BASE_URL" \
            --dart-define=ENTRA_CLIENT_ID="$ENTRA_CLIENT_ID" \
            --dart-define=ENTRA_AUTHORITY="$ENTRA_AUTHORITY" \
            --dart-define=ENTRA_API_SCOPE="$ENTRA_API_SCOPE" \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"
        working_directory: apps/mobile
    artifacts: *artifacts
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
      email:
        recipients:
          - gabriel.chambaud@gmail.com
        notify:
          success: true
          failure: true

  # ===========================================================================
  # ios-release-dry : signed IPA, NO upload. Trigger: push to main.
  # Dev config (CERTIGO_ENV=dev, inline dev API). Validates signing + build.
  # ===========================================================================
  ios-release-dry:
    name: iOS - Dry run (no upload)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: AppStoreConnect
    environment:
      flutter: 3.27.4
      xcode: latest
      cocoapods: default
      groups:
        - certigo_mobile_config   # ENTRA_* reused; API_BASE_URL is dev-inline below.
      ios_signing: *ios_signing
      vars:
        BUNDLE_ID: com.certigo.mobileapp
        FLUTTER_APP_PATH: apps/mobile
        CERTIGO_ENV: dev
        API_BASE_URL: "https://func-certigo-dev-bk3j5ja6vw23s.azurewebsites.net/api"
    cache: *cache
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - *step_pub_get
      - *step_analyze
      - *step_test
      - *step_use_profiles
      - *step_resolve_version
      - name: Build signed IPA (dev, no upload)
        script: |
          set -euo pipefail
          flutter build ipa --release \
            --dart-define=CERTIGO_ENV="$CERTIGO_ENV" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ENTRA_CLIENT_ID="$ENTRA_CLIENT_ID" \
            --dart-define=ENTRA_AUTHORITY="$ENTRA_AUTHORITY" \
            --dart-define=ENTRA_API_SCOPE="$ENTRA_API_SCOPE" \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"
        working_directory: apps/mobile
    artifacts: *artifacts

  # ===========================================================================
  # ios-refresh-signing : manual-only maintenance. Refreshes signing profiles
  # via the App Store Connect API (new device, cert/profile expiry, bundle id
  # change). Cheap, manual, not part of the build flow.
  # ===========================================================================
  ios-refresh-signing:
    name: iOS - Refresh signing profiles
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: AppStoreConnect
    environment:
      xcode: latest
      ios_signing: *ios_signing
    scripts:
      - name: Refresh provisioning profiles via App Store Connect API
        script: |
          set -euo pipefail
          echo "Refreshing iOS signing profiles for com.certigo.mobileapp ..."
          xcode-project use-profiles --force
          echo "Provisioning profiles refreshed."
    artifacts:
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - gabriel.chambaud@gmail.com
        notify:
          success: true
          failure: true
