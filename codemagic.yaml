# =============================================================================
# codemagic.yaml - Certigo iOS CI/CD (Codemagic)
# =============================================================================
# iOS builds run on Codemagic macOS instances (GitHub-hosted macOS runners are
# blocked by the EMU policy on GitHub Enterprise). Android release stays on
# GitHub Actions (.github/workflows/release-android.yml).
#
# ONE-TIME DASHBOARD SETUP (full runbook in docs/RELEASE_MOBILE.md):
#   1. Connect this GitHub repo to a Codemagic app.
#   2. Teams > Integrations > App Store Connect: add an integration named
#      exactly "AppStoreConnect" (App Store Connect API key: Key ID, Issuer ID,
#      .p8). The pipeline CREATES the distribution certificate + App Store
#      provisioning profile on the first build via this key
#      (app-store-connect fetch-signing-files --create) - no fastlane match, no
#      manual profile upload, no GitHub secrets for iOS.
#   3. App > Environment variables: create the group "certigo_mobile_config".
#      NON-secret dart-define values baked into the public binary:
#        PROD_API_BASE_URL = https://<prod-func-app>.azurewebsites.net/api
#        ENTRA_CLIENT_ID    = 4d1f1075-7bc5-4764-947b-701435a85f8c
#        ENTRA_AUTHORITY    = https://af721be8-5901-422a-b299-b9c57847b968.ciamlogin.com/af721be8-5901-422a-b299-b9c57847b968/v2.0
#        ENTRA_API_SCOPE    = api://12910b8e-6c75-4d51-91d8-4d5fb8a6e915/user_impersonation
#        SENTRY_DSN         = https://<public-key>@<ingest-host>/<project-id>
#        SENTRY_ORG         = <organization-slug>
#        SENTRY_PROJECT     = <project-slug>
#        ACCOUNT_DELETION_ENABLED = false until the destructive Cosmos gate passes
#        PUBLIC_WEB_ORIGIN, PUBLIC_DOMAIN_VERIFIED and
#        APPLE_CIAM_DOMAIN_RECONFIGURED = fail-closed public-domain contract
#      Missing values keep social buttons hidden and/or break email login. Same
#      values as Android (Key Vault mobile-* / GitHub vars.MOBILE_*).
#      Plus two SECURE variables (masked, never committed):
#        CERTIFICATE_PRIVATE_KEY = unencrypted RSA 2048 private key in PEM form
#          (openssl genrsa 2048). No passphrase. Required by fetch-signing-files
#          --create; without it the build fails "Cannot save Signing Certificates
#          without certificate private key".
#        SENTRY_AUTH_TOKEN = least-privilege Sentry organization token used only
#          by Codemagic to upload dSYMs. It is never passed as a dart-define.
#
# WORKFLOWS:
#   ios-release         : tag v* -> signed IPA + upload to TestFlight (prod config)
#   ios-release-dry     : push main -> signed IPA, NO upload (dev config, validation)
#   ios-crash-smoke     : manual -> destructive internal TestFlight crash test
#   ios-refresh-signing : manual only -> refresh signing profiles via ASC API
#
# Build status is reported to GitHub automatically by the Codemagic GitHub App
# (no publishing.github block - that is unsupported and fails validation).
# =============================================================================

# Reusable building blocks. Each shared script is a SINGLE step map so it can be
# referenced as one list item (`- *anchor`); this keeps the two build workflows
# in sync without drift. (A list anchor cannot be spliced into `scripts:`.)
definitions:
  cache: &cache
    cache_paths:
      # Dart/Flutter package cache - the biggest, safest speed win.
      - $HOME/.pub-cache
      # CocoaPods spec + downloaded pods cache (content-keyed, safe to reuse).
      - $HOME/Library/Caches/CocoaPods

  artifacts: &artifacts
    - apps/mobile/build/ios/ipa/*.ipa
    - apps/mobile/build/ios/symbols/*.zip
    - /tmp/xcodebuild_logs/*.log
    - apps/mobile/build/ios/logs/*.log

  steps:
    - &step_public_domain_gate
      name: Verify public-domain contract
      script: |
        set -euo pipefail
        TARGET_ENV=prod node .github/scripts/public-domain-contract.mjs account-deletion-url
    - &step_pub_get
      name: Flutter pub get
      script: flutter pub get --enforce-lockfile
      working_directory: apps/mobile
    - &step_analyze
      name: Static analysis (blocking gate)
      script: flutter analyze
      working_directory: apps/mobile
    - &step_test
      name: Unit tests (blocking gate)
      script: flutter test
      working_directory: apps/mobile
    - &step_setup_signing
      name: Set up code signing (create App Store cert + profile, then apply)
      script: |
        set -euo pipefail
        # Fresh App Store Connect setup: the App ID has no provisioning profile and
        # no distribution certificate yet, so `xcode-project use-profiles` alone
        # (which only APPLIES existing profiles) failed with
        #   "No matching profiles found ... distribution type app_store".
        # `app-store-connect fetch-signing-files --create` creates BOTH the
        # distribution certificate and the App Store provisioning profile via the
        # App Store Connect API when they don't exist, and reuses them on later runs
        # (--create only creates what is missing -> idempotent, safe to re-run).
        # Creating a NEW distribution certificate needs a private key. On a
        # from-scratch Apple account Codemagic does NOT auto-provide one (the build
        # failed with "Cannot save Signing Certificates without certificate private
        # key"), so we pass it explicitly with --certificate-key @env:CERTIFICATE_PRIVATE_KEY
        # (an unencrypted RSA 2048 PEM stored as a SECURE variable in the
        # certigo_mobile_config group). No passphrase -> no --certificate-key-password.
        # The key is referenced by env name only, never hardcoded. The private key
        # stays required on every run: later runs rebuild the signing .p12 from the
        # fetched certificate + this key. The AppStoreConnect integration injects the
        # API key (APP_STORE_CONNECT_ISSUER_ID / _KEY_IDENTIFIER / _PRIVATE_KEY).
        # --type IOS_APP_STORE = App Store/TestFlight; --platform IOS is the default,
        # kept explicit. keychain initialize + add-certificates make the cert usable
        # for signing; use-profiles then applies the profile and writes
        # $HOME/export_options.plist (used by the build step).
        # Docs: https://github.com/codemagic-ci-cd/cli-tools/blob/master/docs/app-store-connect/fetch-signing-files.md
        keychain initialize
        app-store-connect fetch-signing-files "$BUNDLE_ID" \
          --type IOS_APP_STORE \
          --platform IOS \
          --create \
          --certificate-key @env:CERTIFICATE_PRIVATE_KEY
        keychain add-certificates
        xcode-project use-profiles
    - &step_resolve_version
      name: Resolve version from git tag or pubspec.yaml
      script: |
        set -euo pipefail
        # Base version from pubspec.yaml (e.g. 1.2.3+1 -> 1.2.3).
        PUBSPEC_VERSION="$(grep -E '^version:' apps/mobile/pubspec.yaml | head -1 | awk '{print $2}')"
        PUBSPEC_NAME="${PUBSPEC_VERSION%%+*}"
        if [ -n "${CM_TAG:-}" ]; then
          # Tag present. v1.2.3+45 -> name 1.2.3 / number 45 ; v1.2.3 -> name 1.2.3.
          TAG_WITHOUT_V="${CM_TAG#v}"
          if echo "$TAG_WITHOUT_V" | grep -q '+'; then
            BUILD_NAME="${TAG_WITHOUT_V%%+*}"
            BUILD_NUMBER="${TAG_WITHOUT_V##*+}"
          else
            BUILD_NAME="$TAG_WITHOUT_V"
            BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-1}"
          fi
        else
          BUILD_NAME="$PUBSPEC_NAME"
          BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-1}"
        fi
        echo "Resolved version: $BUILD_NAME (+$BUILD_NUMBER)"
        echo "BUILD_NAME=$BUILD_NAME"     >> "$CM_ENV"
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"
    - &step_sentry_config_gate
      name: Verify required crash reporting configuration
      script: |
        set -euo pipefail
        if [ "${CRASH_REPORTING_REQUIRED:-}" != "true" ]; then
          echo "Crash reporting must be required for every signed iOS build." >&2
          exit 1
        fi

        missing=0
        for name in SENTRY_DSN SENTRY_ORG SENTRY_PROJECT; do
          if [ -z "$(printenv "$name" 2>/dev/null || true)" ]; then
            echo "Missing required Codemagic variable: $name" >&2
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          exit 1
        fi

        if [[ ! "$SENTRY_DSN" =~ ^https://[^:@/?#]+@[^/?#]+/.+ ]] ||
           [[ "$SENTRY_DSN" == *"?"* ]] ||
           [[ "$SENTRY_DSN" == *"#"* ]]; then
          echo "SENTRY_DSN must be an HTTPS DSN containing only its public key and project id." >&2
          exit 1
        fi
        if [[ ! "$SENTRY_ORG" =~ ^[A-Za-z0-9_-]+$ ]] ||
           [[ ! "$SENTRY_PROJECT" =~ ^[A-Za-z0-9_-]+$ ]]; then
          echo "SENTRY_ORG and SENTRY_PROJECT must be valid Sentry slugs." >&2
          exit 1
        fi

        SENTRY_RELEASE="${BUNDLE_ID}@${BUILD_NAME}+${BUILD_NUMBER}"
        SENTRY_DIST="$BUILD_NUMBER"
        export SENTRY_RELEASE SENTRY_DIST
        echo "SENTRY_RELEASE=$SENTRY_RELEASE" >> "$CM_ENV"
        echo "SENTRY_DIST=$SENTRY_DIST"       >> "$CM_ENV"
        echo "Crash reporting configuration accepted for release $SENTRY_RELEASE."
    - &step_upload_sentry_symbols
      name: Upload and archive iOS dSYMs (blocking)
      script: |
        set -euo pipefail
        if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
          echo "Missing required secure Codemagic variable: SENTRY_AUTH_TOKEN" >&2
          exit 1
        fi
        DSYM_ROOT="build/ios/archive/Runner.xcarchive/dSYMs"
        if [ ! -d "$DSYM_ROOT" ]; then
          echo "Expected dSYM directory is missing: $DSYM_ROOT" >&2
          exit 1
        fi
        DSYM_COUNT="$(find "$DSYM_ROOT" -type d -name '*.dSYM' -prune -print | wc -l | tr -d ' ')"
        if [ "$DSYM_COUNT" -eq 0 ]; then
          echo "No .dSYM bundle was produced; refusing to publish an unsymbolicated build." >&2
          exit 1
        fi

        # The plugin discovers Flutter/iOS debug files and downloads a checksum-
        # verified sentry-cli. Its current release can log some CLI failures
        # without propagating a non-zero exit, so the direct upload below is the
        # authoritative fail-closed gate.
        dart run sentry_dart_plugin
        SENTRY_CLI=".dart_tool/pub/bin/sentry_dart_plugin/sentry-cli"
        if [ ! -x "$SENTRY_CLI" ]; then
          echo "sentry-cli was not installed at the expected verified path." >&2
          exit 1
        fi
        "$SENTRY_CLI" debug-files upload \
          --org "$SENTRY_ORG" \
          --project "$SENTRY_PROJECT" \
          --wait \
          "$DSYM_ROOT"

        mkdir -p build/ios/symbols
        ditto -c -k --sequesterRsrc --keepParent \
          "$DSYM_ROOT" \
          "build/ios/symbols/Certigo-${BUILD_NAME}-${BUILD_NUMBER}-dSYMs.zip"
        echo "Uploaded and archived $DSYM_COUNT dSYM bundle(s)."
      working_directory: apps/mobile

workflows:

  # ===========================================================================
  # ios-release : signed IPA + TestFlight upload. Trigger: git tag v*.
  # Production config (CERTIGO_ENV=prod, PROD_API_BASE_URL from the var group).
  # ===========================================================================
  ios-release:
    name: iOS - Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: AppStoreConnect
    environment:
      flutter: 3.44.4          # Aligned with .github/workflows/ci-mobile.yml (test<->release parity).
      xcode: latest
      cocoapods: default
      groups:
        - certigo_mobile_config   # PROD_API_BASE_URL, ENTRA_CLIENT_ID/AUTHORITY/API_SCOPE
      vars:
        BUNDLE_ID: com.certigo.mobileapp
        FLUTTER_APP_PATH: apps/mobile
        CERTIGO_ENV: prod
        CRASH_REPORTING_ENABLED: "true"
        CRASH_REPORTING_REQUIRED: "true"
        CRASH_SMOKE_TEST_ENABLED: "false"
    cache: *cache
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
      cancel_previous_builds: false
    scripts:
      - *step_public_domain_gate
      - *step_pub_get
      - *step_analyze
      - *step_test
      - *step_setup_signing
      - *step_resolve_version
      - *step_sentry_config_gate
      - name: Build signed IPA (production)
        script: |
          set -euo pipefail
          ACCOUNT_DELETION_ENABLED="${ACCOUNT_DELETION_ENABLED:-false}"
          case "$ACCOUNT_DELETION_ENABLED" in true|false) ;; *) exit 1 ;; esac
          flutter build ipa --release \
            --dart-define=CERTIGO_ENV="$CERTIGO_ENV" \
            --dart-define=API_BASE_URL="$PROD_API_BASE_URL" \
            --dart-define=ENTRA_CLIENT_ID="$ENTRA_CLIENT_ID" \
            --dart-define=ENTRA_AUTHORITY="$ENTRA_AUTHORITY" \
            --dart-define=ENTRA_API_SCOPE="$ENTRA_API_SCOPE" \
            --dart-define=ACCOUNT_DELETION_ENABLED="$ACCOUNT_DELETION_ENABLED" \
            --dart-define=CRASH_REPORTING_ENABLED="$CRASH_REPORTING_ENABLED" \
            --dart-define=CRASH_REPORTING_REQUIRED="$CRASH_REPORTING_REQUIRED" \
            --dart-define=CRASH_SMOKE_TEST_ENABLED="$CRASH_SMOKE_TEST_ENABLED" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=SENTRY_RELEASE="$SENTRY_RELEASE" \
            --dart-define=SENTRY_DIST="$SENTRY_DIST" \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"
        working_directory: apps/mobile
      - *step_upload_sentry_symbols
    artifacts: *artifacts
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
      email:
        recipients:
          - gabriel.chambaud@gmail.com
        notify:
          success: true
          failure: true

  # ===========================================================================
  # ios-release-dry : signed IPA, NO upload. Trigger: push to main.
  # Dev config (CERTIGO_ENV=dev, inline dev API). Validates signing + build.
  # ===========================================================================
  ios-release-dry:
    name: iOS - Dry run (no upload)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: AppStoreConnect
    environment:
      flutter: 3.44.4
      xcode: latest
      cocoapods: default
      groups:
        - certigo_mobile_config   # ENTRA_* reused; API_BASE_URL is dev-inline below.
      vars:
        BUNDLE_ID: com.certigo.mobileapp
        FLUTTER_APP_PATH: apps/mobile
        CERTIGO_ENV: dev
        API_BASE_URL: "https://func-certigo-dev-bk3j5ja6vw23s.azurewebsites.net/api"
        CRASH_REPORTING_ENABLED: "true"
        CRASH_REPORTING_REQUIRED: "true"
        CRASH_SMOKE_TEST_ENABLED: "false"
        # Runtime content sync (offline cache + integrity layer) is exercised on the
        # dev artifact only. Production stays on the compile-time default (false).
        RUNTIME_CONTENT_MOBILE: "true"
    cache: *cache
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - *step_pub_get
      - *step_analyze
      - *step_test
      - *step_setup_signing
      - *step_resolve_version
      - *step_sentry_config_gate
      - name: Build signed IPA (dev, no upload)
        script: |
          set -euo pipefail
          ACCOUNT_DELETION_ENABLED="${ACCOUNT_DELETION_ENABLED:-false}"
          case "$ACCOUNT_DELETION_ENABLED" in true|false) ;; *) exit 1 ;; esac
          RUNTIME_CONTENT_MOBILE="${RUNTIME_CONTENT_MOBILE:-false}"
          case "$RUNTIME_CONTENT_MOBILE" in true|false) ;; *) exit 1 ;; esac
          flutter build ipa --release \
            --dart-define=CERTIGO_ENV="$CERTIGO_ENV" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ENTRA_CLIENT_ID="$ENTRA_CLIENT_ID" \
            --dart-define=ENTRA_AUTHORITY="$ENTRA_AUTHORITY" \
            --dart-define=ENTRA_API_SCOPE="$ENTRA_API_SCOPE" \
            --dart-define=ACCOUNT_DELETION_ENABLED="$ACCOUNT_DELETION_ENABLED" \
            --dart-define=CRASH_REPORTING_ENABLED="$CRASH_REPORTING_ENABLED" \
            --dart-define=CRASH_REPORTING_REQUIRED="$CRASH_REPORTING_REQUIRED" \
            --dart-define=CRASH_SMOKE_TEST_ENABLED="$CRASH_SMOKE_TEST_ENABLED" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=SENTRY_RELEASE="$SENTRY_RELEASE" \
            --dart-define=SENTRY_DIST="$SENTRY_DIST" \
            --dart-define=RUNTIME_CONTENT_MOBILE="$RUNTIME_CONTENT_MOBILE" \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"
        working_directory: apps/mobile
      - *step_upload_sentry_symbols
    artifacts: *artifacts

  # ===========================================================================
  # ios-crash-smoke : manual-only destructive TestFlight build. It exposes
  # explicit buttons for one Dart error and one native iOS fatal crash.
  # ===========================================================================
  ios-crash-smoke:
    name: iOS - Internal crash reporting smoke
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: AppStoreConnect
    environment:
      flutter: 3.44.4
      xcode: latest
      cocoapods: default
      groups:
        - certigo_mobile_config
      vars:
        BUNDLE_ID: com.certigo.mobileapp
        FLUTTER_APP_PATH: apps/mobile
        CERTIGO_ENV: staging
        CRASH_REPORTING_ENABLED: "true"
        CRASH_REPORTING_REQUIRED: "true"
        CRASH_SMOKE_TEST_ENABLED: "true"
    cache: *cache
    scripts:
      - *step_pub_get
      - *step_analyze
      - *step_test
      - *step_setup_signing
      - *step_resolve_version
      - *step_sentry_config_gate
      - name: Build destructive internal crash-test IPA
        script: |
          set -euo pipefail
          flutter build ipa --release \
            --dart-define=CERTIGO_ENV="$CERTIGO_ENV" \
            --dart-define=API_BASE_URL="$PROD_API_BASE_URL" \
            --dart-define=ENTRA_CLIENT_ID="$ENTRA_CLIENT_ID" \
            --dart-define=ENTRA_AUTHORITY="$ENTRA_AUTHORITY" \
            --dart-define=ENTRA_API_SCOPE="$ENTRA_API_SCOPE" \
            --dart-define=ACCOUNT_DELETION_ENABLED=false \
            --dart-define=CRASH_REPORTING_ENABLED="$CRASH_REPORTING_ENABLED" \
            --dart-define=CRASH_REPORTING_REQUIRED="$CRASH_REPORTING_REQUIRED" \
            --dart-define=CRASH_SMOKE_TEST_ENABLED="$CRASH_SMOKE_TEST_ENABLED" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=SENTRY_RELEASE="$SENTRY_RELEASE" \
            --dart-define=SENTRY_DIST="$SENTRY_DIST" \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"
        working_directory: apps/mobile
      - *step_upload_sentry_symbols
    artifacts: *artifacts
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
      email:
        recipients:
          - gabriel.chambaud@gmail.com
        notify:
          success: true
          failure: true

  # ===========================================================================
  # ios-refresh-signing : manual-only maintenance. Refreshes signing profiles
  # via the App Store Connect API (new device, cert/profile expiry, bundle id
  # change). Cheap, manual, not part of the build flow.
  # ===========================================================================
  ios-refresh-signing:
    name: iOS - Refresh signing profiles
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: AppStoreConnect
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.certigo.mobileapp
    scripts:
      # Same idempotent recipe as the build workflows: creates the distribution
      # certificate + App Store profile if missing, refreshes them if present.
      - *step_setup_signing
    artifacts:
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - gabriel.chambaud@gmail.com
        notify:
          success: true
          failure: true
