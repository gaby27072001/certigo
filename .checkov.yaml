# Checkov configuration — Certigo / Bicep IaC scan
# Only suppress checks with a documented, accepted justification.
# All other findings from `checkov --framework bicep` are hard-fail.
#
# To add a new suppression:
#   1. Understand the finding (checkov --check <ID> docs).
#   2. Confirm it is a deliberate design choice or a Checkov false positive.
#   3. Add it here with a one-line reason, reviewer name, and date.
#   4. Open a follow-up issue if the suppression should be re-evaluated later.

skip-check:
  # CKV_AZURE_65 — Cosmos DB should have automatic failover enabled.
  # Reason: Certigo uses Cosmos in **serverless** mode, which only supports a
  # single write region and does not support automatic failover. Enabling it
  # would break the deployment. Acceptable for the current stage; revisit when
  # provisioned throughput / multi-region is adopted.
  - CKV_AZURE_65

  # CKV_AZURE_132 — Cosmos DB local (key-based) auth should be disabled.
  # Reason: `disableLocalAuth` is set to `true` in staging/prod via the
  # `hardened` variable; it is intentionally left `false` in dev so that the
  # seed script and local tooling can authenticate without Entra. The dev
  # environment is not production-sensitive.
  - CKV_AZURE_132

  # CKV_AZURE_140 — Cosmos local authentication should be disabled.
  # Reason: same rationale as CKV_AZURE_132 for dev, while staging/prod set
  # disableLocalAuth=true through hardened configuration.
  - CKV_AZURE_140

  # CKV_AZURE_42 — Key Vault recoverability.
  # Reason: dev keeps purge protection optional; staging/prod enable it.
  - CKV_AZURE_42

  # CKV_AZURE_87 — Defender for Cloud on Key Vault.
  # Reason: paid Defender plans are optional and intentionally disabled by
  # default to avoid unexpected subscription cost in dev/test.
  - CKV_AZURE_87
  # CKV_AZURE_19 / CKV_AZURE_84 — Defender Standard pricing.
  # Reason: the shared module is parameterized so production enables paid plans
  # while dev/staging can remain free until budget approval.
  - CKV_AZURE_19
  - CKV_AZURE_84

  # CKV_AZURE_206 — Storage should use geo-redundant replication.
  # Reason: default Standard_LRS is a deliberate dev cost/performance trade-off;
  # production can pass Standard_GRS/GZRS through module parameters.
  - CKV_AZURE_206

  # CKV_AZURE_43 — Storage account naming rule check.
  # Reason: account naming is validated at deployment input (global uniqueness +
  # naming constraints), while static template analysis cannot evaluate final
  # generated names.
  - CKV_AZURE_43
