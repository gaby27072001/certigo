name: native-apple-check

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit SHA (40 lowercase hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-apple-check-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  check:
    name: Unsigned native Apple checks
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'gaby27072001/certigo' && github.actor == github.repository_owner }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Validate exact candidate SHA
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full lowercase commit SHA."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Verify checkout and Apple toolchain
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$CANDIDATE_SHA" ]]; then
            echo "::error::Checkout does not match the requested commit."
            exit 1
          fi
          xcodebuild -version
          swift --version
          xcrun simctl list devices available

      - name: Test portable native packages
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path apps/apple/CertigoKit

      - name: Build unsigned iPhone and iPad simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/apple/CertigoNative/CertigoNative.xcodeproj \
            -scheme CertigoNative \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
