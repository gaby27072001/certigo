name: security-scan

# Reusable Checkov scan called by security-gate.yml only for applicable changes.
on:
  workflow_call:

permissions: {}

jobs:
  iac-scan:
    name: Bicep IaC scan (Checkov)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    env:
      UNTRUSTED_SOURCE_DIR: ${{ github.workspace }}/.untrusted-source
      TRUSTED_CONTROL_DIR: ${{ github.workspace }}/.trusted-control
      CHECKOV_SCAN_LOG: ${{ github.workspace }}/.scanner-state/checkov-results.log
    steps:
      - name: Recheck current PR head after assignment
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const eventHead = context.payload.pull_request.head.sha;
            if (!eventHead || pull.head.sha !== eventHead) {
              core.setFailed(`Superseded PR event ${eventHead || '<missing>'}; current head is ${pull.head.sha}.`);
            }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          path: .untrusted-source
          persist-credentials: false
      - name: Checkout immutable trusted controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: .trusted-control
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pinned Checkov
        run: python -m pip install --disable-pip-version-check checkov==3.2.495
      - name: Test trusted Checkov report gate
        run: python "$TRUSTED_CONTROL_DIR/.github/scripts/test_checkov_report_gate.py"
      - name: Compile immutable runner image templates
        shell: bash
        run: |
          set -euo pipefail
          bicep="$RUNNER_TEMP/bicep-0.44.1"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$bicep" \
            https://github.com/Azure/bicep/releases/download/v0.44.1/bicep-linux-x64
          echo "e17dc9a9888184886bb0c0051a3230b83b19f342749999f707bc571c3dfd2f45  $bicep" |
            sha256sum --check --strict
          chmod 0755 "$bicep"
          compiled="$RUNNER_TEMP/runner-image-arm"
          mkdir -p "$compiled"
          for template in image-build canary canary-main; do
            "$bicep" build \
              "$UNTRUSTED_SOURCE_DIR/infra/ci-runner/image/${template}.bicep" \
              --outfile "$compiled/${template}.json"
          done
      - name: Scan compiled runner image ARM
        shell: bash
        run: |
          set -euo pipefail
          # Exact attested Gallery versions require manual model updates; automatic
          # OS upgrades would bypass the reviewed provenance and rollback contract.
          cat > "$RUNNER_TEMP/runner-image-checkov.yaml" <<'YAML'
          skip-check:
            - CKV_AZURE_95
          YAML
          checkov \
            --directory "$RUNNER_TEMP/runner-image-arm" \
            --framework arm \
            --config-file "$RUNNER_TEMP/runner-image-checkov.yaml"
      - name: Run Checkov on infra/
        run: |
          set -uo pipefail
          mkdir -p -- "$(dirname "$CHECKOV_SCAN_LOG")"
          rm -f -- "$CHECKOV_SCAN_LOG" "$CHECKOV_SCAN_LOG.json"
          set +e
          checkov --directory "$UNTRUSTED_SOURCE_DIR/infra" \
            --framework bicep --compact \
            --config-file "$TRUSTED_CONTROL_DIR/.checkov.yaml" \
            --output cli --output json \
            --output-file-path "console,$CHECKOV_SCAN_LOG.json" \
            > "$CHECKOV_SCAN_LOG" 2>&1
          scan_status=$?
          set -e

          stop_token="$(cat /proc/sys/kernel/random/uuid)"
          echo "::stop-commands::$stop_token"
          cat -- "$CHECKOV_SCAN_LOG"
          echo "::$stop_token::"

          summary_line="$(
            grep -Eo \
              'Passed checks: [0-9]+, Failed checks: [0-9]+, Skipped checks: [0-9]+, Parsing errors: [0-9]+' \
              "$CHECKOV_SCAN_LOG" | tail -n 1
          )"
          if [ -z "$summary_line" ]; then
            {
              echo "## Checkov IaC scan"
              echo
              echo "- Result: **invalid output**"
              echo "- Scanner exit code: \`$scan_status\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Checkov output is missing or malformed."
            exit 1
          fi
          failed_checks="$(sed -E 's/.*Failed checks: ([0-9]+).*/\1/' <<< "$summary_line")"
          {
            echo "## Checkov IaC scan"
            echo
            echo "- $summary_line"
            echo "- Scanner exit code: \`$scan_status\`"
            echo "- Complete scanner output is available in this job's immutable logs."
          } >> "$GITHUB_STEP_SUMMARY"

          if ! python "$TRUSTED_CONTROL_DIR/.github/scripts/checkov_report_gate.py" \
            "$CHECKOV_SCAN_LOG.json" "$scan_status" | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "::error::Checkov report is incomplete, has blocking findings, or has zero effective coverage."
            exit 1
          fi

          if [ "$scan_status" -ne 0 ] || [ "$failed_checks" -ne 0 ]; then
            echo "::error::Checkov found a blocking IaC issue or could not complete."
            exit 1
          fi
