name: security-scan

# Software-composition (dependency CVE) + infrastructure-as-code scanning.
# Complements CodeQL (SAST): this catches vulnerable NuGet packages and risky
# Bicep configuration before they reach main.
on:
  schedule:
    # Nightly scan to reduce daytime pressure on self-hosted runners.
    - cron: "47 2 * * *"
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    name: NuGet vulnerability scan
    runs-on: ${{ vars.PR_RUNNER_LABELS && fromJSON(vars.PR_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]') }}
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        working-directory: backend
        run: dotnet restore Certigo.sln
      - name: Scan for vulnerable & deprecated packages
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet list Certigo.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qi "has the following vulnerable" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages detected — see the log above."
            exit 1
          fi
          echo "No vulnerable NuGet packages found."

  iac-scan:
    name: Bicep IaC scan (Checkov)
    runs-on: ${{ vars.PR_RUNNER_LABELS && fromJSON(vars.PR_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]') }}
        with:
          python-version: "3.x"
      - name: Run Checkov on infra/
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade --quiet checkov
          # Soft-fail for now so known/accepted findings don't block delivery.
          # Flip --soft-fail off (and triage) to enforce as a hard gate later.
          checkov --directory infra --framework bicep --compact --quiet --soft-fail
