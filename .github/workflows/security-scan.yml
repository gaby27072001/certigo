name: security-scan

# Reusable Checkov scan called by security-gate.yml only for applicable changes.
on:
  workflow_call:

permissions: {}

jobs:
  iac-scan:
    name: Bicep IaC scan (Checkov)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || (vars.MAIN_CRITICAL_RUNNER_LABELS && fromJSON(vars.MAIN_CRITICAL_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]')) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pinned Checkov
        run: python -m pip install --disable-pip-version-check checkov==3.2.495
      - name: Run Checkov on infra/
        run: checkov --directory infra --framework bicep --compact --quiet --config-file .checkov.yaml
