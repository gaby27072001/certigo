name: security-scan

# Software-composition (dependency CVE) + infrastructure-as-code scanning.
# Complements CodeQL (SAST): this catches vulnerable NuGet packages and risky
# Bicep configuration before they reach main.
on:
  schedule:
    # Nightly scan to reduce daytime pressure on self-hosted runners.
    - cron: "47 2 * * *"
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-scan:
    name: NuGet vulnerability scan
    runs-on: ${{ vars.CI_GITHUB_HOSTED_FALLBACK == 'true' && 'ubuntu-latest' || (vars.MAIN_CRITICAL_RUNNER_LABELS && fromJSON(vars.MAIN_CRITICAL_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        working-directory: backend
        run: dotnet restore Certigo.sln
      - name: Scan for vulnerable & deprecated packages
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet list Certigo.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qi "has the following vulnerable" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages detected — see the log above."
            exit 1
          fi
          echo "No vulnerable NuGet packages found."

  mobile-dependency-scan:
    name: Flutter pub dependency scan
    runs-on: ${{ vars.CI_GITHUB_HOSTED_FALLBACK == 'true' && 'ubuntu-latest' || (vars.MAIN_CRITICAL_RUNNER_LABELS && fromJSON(vars.MAIN_CRITICAL_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true
      - name: Check Flutter outdated packages
        working-directory: apps/mobile
        run: flutter pub outdated --no-color
      - name: Check for known vulnerabilities (pub audit)
        working-directory: apps/mobile
        # dart pub audit is advisory: reports known advisories without failing the build.
        # flutter pub outdated (above) is the primary actionable gate for stale deps.
        run: dart pub deps --style=compact || true

  iac-scan:
    name: Bicep IaC scan (Checkov)
    runs-on: ${{ vars.CI_GITHUB_HOSTED_FALLBACK == 'true' && 'ubuntu-latest' || (vars.MAIN_CRITICAL_RUNNER_LABELS && fromJSON(vars.MAIN_CRITICAL_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          # Keep Checkov runtime on a stable, broadly compatible Python release.
          python-version: "3.12"
      - name: Run Checkov on infra/
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade --quiet checkov
          # Hard-fail gate: any new critical/high finding blocks delivery.
          # Accepted false-positives are documented in .checkov.yaml (skip-check).
          checkov --directory infra --framework bicep --compact --quiet --config-file .checkov.yaml
