name: security-scan

# Blocking IaC scan. Source and dependency scans live in codeql.yml and
# dependency-vuln-scan.yml so relevant PRs do not pay for duplicate jobs.
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".checkov.yaml"
      - ".github/workflows/security-scan.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".checkov.yaml"
      - ".github/workflows/security-scan.yml"
  schedule:
    - cron: "47 2 * * 1"
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  iac-scan:
    name: Bicep IaC scan (Checkov)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    environment: ${{ github.event_name == 'pull_request' && 'pr-ci' || '' }}
    runs-on: ${{ vars.CI_GITHUB_HOSTED_FALLBACK == 'true' && 'ubuntu-latest' || (github.event_name != 'pull_request' && (vars.MAIN_CRITICAL_RUNNER_LABELS && fromJSON(vars.MAIN_CRITICAL_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]')) || (vars.PR_RUNNER_LABELS && fromJSON(vars.PR_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]'))) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pinned Checkov
        run: python -m pip install --disable-pip-version-check checkov==3.2.495
      - name: Run Checkov on infra/
        run: checkov --directory infra --framework bicep --compact --quiet --config-file .checkov.yaml
