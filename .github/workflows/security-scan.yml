name: security-scan

# Reusable Checkov scan called by security-gate.yml only for applicable changes.
on:
  workflow_call:

permissions: {}

jobs:
  iac-scan:
    name: Bicep IaC scan (Checkov)
    runs-on: [self-hosted, Linux, X64, certigo-ci]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pinned Checkov
        run: python -m pip install --disable-pip-version-check checkov==3.2.495
      - name: Run Checkov on infra/
        run: |
          set -euo pipefail
          checkov --directory infra --framework bicep --compact --quiet \
            --config-file .checkov.yaml 2>&1 | tee checkov-results.log

      - name: Ensure Checkov findings log exists
        if: ${{ always() }}
        run: |
          if [ ! -e checkov-results.log ]; then
            echo "Checkov did not produce a findings log; inspect prior failed steps." > checkov-results.log
          fi

      - name: Preserve Checkov findings
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkov-findings
          path: checkov-results.log
          if-no-files-found: error
          retention-days: 30
