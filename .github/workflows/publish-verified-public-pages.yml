name: publish-verified-public-pages

# This is the only activation path for legal pages after domain ownership is
# verified. The legacy dispatch remains fail-closed because its builder receives
# no public-domain contract.
on:
  repository_dispatch:
    types: [publish-verified-public-pages]

permissions: {}

concurrency:
  group: verified-public-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build verified public legal pages
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, certigo-trusted]
    environment: github-pages
    permissions:
      contents: read
      pages: write
    steps:
      - name: Reject unexpected payload fields
        shell: bash
        env:
          CLIENT_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          if ! jq -e 'type == "object" and length == 0' <<< "$CLIENT_PAYLOAD_JSON" >/dev/null; then
            echo "::error::publish-verified-public-pages does not accept client_payload fields."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Require a compatible verified Pages origin
        shell: bash
        env:
          TARGET_ENV: prod
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
          PUBLIC_DOMAIN_VERIFIED: ${{ vars.PUBLIC_DOMAIN_VERIFIED }}
          APPLE_CIAM_DOMAIN_RECONFIGURED: ${{ vars.APPLE_CIAM_DOMAIN_RECONFIGURED }}
        run: |
          set -euo pipefail
          node .github/scripts/public-domain-contract.mjs legal-pages
          if [[ "$PAGES_ORIGIN" != "$PUBLIC_WEB_ORIGIN" || -n "$PAGES_BASE_PATH" ]]; then
            echo "::error::GitHub Pages must expose the verified origin at its root."
            exit 1
          fi
      - name: Build static legal pages
        env:
          PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
          PUBLIC_DOMAIN_VERIFIED: ${{ vars.PUBLIC_DOMAIN_VERIFIED }}
          APPLE_CIAM_DOMAIN_RECONFIGURED: ${{ vars.APPLE_CIAM_DOMAIN_RECONFIGURED }}
        run: node tools/build_public_pages.mjs --output _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: Deploy verified public legal pages
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, certigo-trusted]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
