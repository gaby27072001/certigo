name: release-android

# Release beta Android : build AAB signé + publication Google Play.
# Déclenchement manuel (workflow_dispatch) ou par tag de version (v*).
# Gates bloquants avant toute release : flutter analyze + flutter test.
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   ANDROID_KEYSTORE_BASE64     base64 du keystore upload (.jks)
#   ANDROID_KEYSTORE_PASSWORD   mot de passe du keystore
#   ANDROID_KEY_ALIAS           alias de la clé (ex: upload)
#   ANDROID_KEY_PASSWORD        mot de passe de la clé
#   PLAY_SERVICE_ACCOUNT_JSON   JSON du compte de service Google Play (rôle "Release manager")
#
# Configuration app injectée au build via --dart-define (étape "appconfig").
# Source prioritaire = Azure Key Vault (vars.AZURE_KEYVAULT_NAME), repli = variables GitHub.
# Ce ne sont PAS des secrets cryptographiques (elles finissent dans le binaire public de
# l'app) -> variables GitHub (vars.*), pas secrets.*. Aucune valeur n'est committée.
#   Secret Key Vault            | Repli variable GitHub       | Rôle / format
#   mobile-app-api-base-url     | vars.MOBILE_API_BASE_URL    | URL backend, https://<host>/api
#   mobile-entra-client-id      | vars.MOBILE_ENTRA_CLIENT_ID | GUID App Registration mobile
#   mobile-entra-authority      | vars.MOBILE_ENTRA_AUTHORITY | https://<domain>.ciamlogin.com/<tenant-id>/v2.0
#   mobile-entra-api-scope      | vars.MOBILE_ENTRA_API_SCOPE | api://<backend-client-id>/user_impersonation
#   mobile-app-env              | vars.MOBILE_CERTIGO_ENV     | prod | staging | dev (défaut: prod)
# Voir docs/RELEASE_MOBILE.md pour la génération des secrets (aucune valeur n'est committée).

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Piste Google Play de destination"
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
      version_name:
        description: "versionName (ex: 0.1.0). Vide = lue depuis pubspec.yaml"
        type: string
        required: false
      build_number:
        description: "versionCode / build number. Vide = numéro de run GitHub (auto-incrémenté)"
        type: string
        required: false
      dry_run:
        description: "Construire l'AAB signé SANS publier sur le Play Store"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.27.4"
  # ⚠️ Doit correspondre à applicationId dans apps/mobile/android/app/build.gradle
  PLAY_PACKAGE_NAME: "com.certigo.mobileapp"
  AAB_PATH: "apps/mobile/build/app/outputs/bundle/release/app-release.aab"

jobs:
  release:
    name: Build AAB signé + publication Play
    # Android reste sur le pool self-hosted redondé : l'accès Key Vault par identité
    # managée n'est pas disponible sur un runner GitHub-hosted.
    runs-on: ${{ vars.MAIN_CRITICAL_RUNNER_LABELS && fromJSON(vars.MAIN_CRITICAL_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]') }}
    permissions:
      contents: read
    # Approval gate: configure required reviewers on the "beta" environment
    # (Settings → Environments) so a human signs off before any Play publish.
    environment: beta
    steps:
      - uses: actions/checkout@v4

      - name: Configurer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer plateformes + build-tools Android
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Configurer Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Résoudre la version (name + build number + track)
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC_VERSION="$(grep -E '^version:' apps/mobile/pubspec.yaml | head -1 | awk '{print $2}')"
          PUBSPEC_NAME="${PUBSPEC_VERSION%%+*}"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            BUILD_NAME="${GITHUB_REF_NAME#v}"
          else
            BUILD_NAME="${{ inputs.version_name }}"
          fi
          BUILD_NAME="${BUILD_NAME:-$PUBSPEC_NAME}"

          BUILD_NUMBER="${{ inputs.build_number }}"
          BUILD_NUMBER="${BUILD_NUMBER:-${{ github.run_number }}}"

          TRACK="${{ inputs.track }}"
          TRACK="${TRACK:-internal}"

          echo "build_name=$BUILD_NAME"   >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "track=$TRACK"             >> "$GITHUB_OUTPUT"
          echo "### Release Android : $BUILD_NAME (+$BUILD_NUMBER) → piste \`$TRACK\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Récupérer les dépendances
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze (gate bloquant)
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test (gate bloquant)
        working-directory: apps/mobile
        run: flutter test

      - name: Résoudre & écrire le matériel de signature (Key Vault → repli secrets)
        id: signing
        shell: bash
        env:
          KV_NAME: ${{ vars.AZURE_KEYVAULT_NAME }}
          # Repli si Key Vault non configuré (sinon valeurs vides) :
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          KEYSTORE_B64="$ANDROID_KEYSTORE_BASE64"; STORE_PWD="$ANDROID_KEYSTORE_PASSWORD"
          KEY_ALIAS="$ANDROID_KEY_ALIAS"; KEY_PWD="$ANDROID_KEY_PASSWORD"; PLAY_JSON="$PLAY_SERVICE_ACCOUNT_JSON"

          if [ -n "${KV_NAME:-}" ]; then
            echo "Secrets : Azure Key Vault ($KV_NAME) via l'identité managée du runner."
            az login --identity --output none
            kv(){ az keyvault secret show --vault-name "$KV_NAME" --name "$1" --query value -o tsv 2>/dev/null || true; }
            KEYSTORE_B64="$(kv mobile-android-keystore-base64)"
            STORE_PWD="$(kv mobile-android-keystore-password)"
            KEY_ALIAS="$(kv mobile-android-key-alias)"
            KEY_PWD="$(kv mobile-android-key-password)"
            PLAY_JSON="$(kv mobile-play-service-account-json)"
          else
            echo "Secrets : secrets GitHub (variable AZURE_KEYVAULT_NAME non définie)."
          fi

          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::Keystore introuvable (ni Key Vault ni secret GitHub). Voir docs/RELEASE_MOBILE.md."
            exit 1
          fi
          for s in "$STORE_PWD" "$KEY_PWD" "$KEY_ALIAS"; do [ -n "$s" ] && echo "::add-mask::$s"; done

          echo "$KEYSTORE_B64" | base64 -d > apps/mobile/android/app/upload-keystore.jks
          cat > apps/mobile/android/key.properties <<EOF
          storePassword=${STORE_PWD}
          keyPassword=${KEY_PWD}
          keyAlias=${KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF

          if [ -n "${PLAY_JSON:-}" ]; then
            printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play-sa.json"
            echo "PLAY_SA_FILE=$RUNNER_TEMP/play-sa.json" >> "$GITHUB_ENV"
            echo "has_play=true"  >> "$GITHUB_OUTPUT"
          else
            echo "has_play=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Résoudre la configuration app (Key Vault → repli variables)
        id: appconfig
        shell: bash
        env:
          KV_NAME: ${{ vars.AZURE_KEYVAULT_NAME }}
          # Repli si Key Vault non configuré. Ce sont des variables (vars.*), pas des
          # secrets : ces valeurs sont embarquées en clair dans le binaire de l'app.
          FB_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
          FB_ENTRA_CLIENT_ID: ${{ vars.MOBILE_ENTRA_CLIENT_ID }}
          FB_ENTRA_AUTHORITY: ${{ vars.MOBILE_ENTRA_AUTHORITY }}
          FB_ENTRA_API_SCOPE: ${{ vars.MOBILE_ENTRA_API_SCOPE }}
          FB_CERTIGO_ENV: ${{ vars.MOBILE_CERTIGO_ENV }}
        run: |
          set -euo pipefail
          API_BASE_URL="$FB_API_BASE_URL"; ENTRA_CLIENT_ID="$FB_ENTRA_CLIENT_ID"
          ENTRA_AUTHORITY="$FB_ENTRA_AUTHORITY"; ENTRA_API_SCOPE="$FB_ENTRA_API_SCOPE"
          CERTIGO_ENV="$FB_CERTIGO_ENV"

          if [ -n "${KV_NAME:-}" ]; then
            echo "Config app : Azure Key Vault ($KV_NAME) via l'identité managée du runner."
            az login --identity --output none
            kv(){ az keyvault secret show --vault-name "$KV_NAME" --name "$1" --query value -o tsv 2>/dev/null || true; }
            V="$(kv mobile-app-api-base-url)"; [ -n "$V" ] && API_BASE_URL="$V"
            V="$(kv mobile-entra-client-id)"; [ -n "$V" ] && ENTRA_CLIENT_ID="$V"
            V="$(kv mobile-entra-authority)"; [ -n "$V" ] && ENTRA_AUTHORITY="$V"
            V="$(kv mobile-entra-api-scope)"; [ -n "$V" ] && ENTRA_API_SCOPE="$V"
            V="$(kv mobile-app-env)";         [ -n "$V" ] && CERTIGO_ENV="$V"
          else
            echo "Config app : variables GitHub (variable AZURE_KEYVAULT_NAME non définie)."
          fi

          CERTIGO_ENV="${CERTIGO_ENV:-prod}"

          # Garde-fou : ces 3 valeurs sont indispensables au login/social. Vide = build
          # dégradé (social/login désactivés) mais on n'échoue PAS le build beta.
          [ -z "${API_BASE_URL:-}" ]    && echo "::warning::Config API_BASE_URL absente → login e-mail désactivé dans ce build."
          [ -z "${ENTRA_CLIENT_ID:-}" ] && echo "::warning::Config ENTRA_CLIENT_ID absente → boutons sociaux désactivés dans ce build."
          [ -z "${ENTRA_AUTHORITY:-}" ] && echo "::warning::Config ENTRA_AUTHORITY absente → boutons sociaux désactivés dans ce build."

          {
            echo "APP_API_BASE_URL=$API_BASE_URL"
            echo "APP_ENTRA_CLIENT_ID=$ENTRA_CLIENT_ID"
            echo "APP_ENTRA_AUTHORITY=$ENTRA_AUTHORITY"
            echo "APP_ENTRA_API_SCOPE=$ENTRA_API_SCOPE"
            echo "APP_CERTIGO_ENV=$CERTIGO_ENV"
          } >> "$GITHUB_ENV"
          echo "Configuration app résolue (env=$CERTIGO_ENV)."

      - name: Construire l'AAB signé
        working-directory: apps/mobile
        shell: bash
        run: >
          flutter build appbundle --release
          --build-name=${{ steps.ver.outputs.build_name }}
          --build-number=${{ steps.ver.outputs.build_number }}
          --dart-define=CERTIGO_ENV=${APP_CERTIGO_ENV}
          --dart-define=API_BASE_URL=${APP_API_BASE_URL}
          --dart-define=ENTRA_CLIENT_ID=${APP_ENTRA_CLIENT_ID}
          --dart-define=ENTRA_AUTHORITY=${APP_ENTRA_AUTHORITY}
          --dart-define=ENTRA_API_SCOPE=${APP_ENTRA_API_SCOPE}

      - name: Publier sur Google Play (piste ${{ steps.ver.outputs.track }})
        if: ${{ inputs.dry_run != true && steps.signing.outputs.has_play == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ env.PLAY_SA_FILE }}
          packageName: ${{ env.PLAY_PACKAGE_NAME }}
          releaseFiles: ${{ env.AAB_PATH }}
          track: ${{ steps.ver.outputs.track }}
          status: completed
          whatsNewDirectory: apps/mobile/distribution/android/whatsnew

      - name: Note — publication sautée
        if: ${{ steps.signing.outputs.has_play != 'true' || inputs.dry_run == true }}
        shell: bash
        run: |
          echo "::warning::Publication Play sautée (dry_run=${{ inputs.dry_run }}, compte de service présent=${{ steps.signing.outputs.has_play }}). L'AAB signé reste disponible en artefact."
          echo "> ℹ️ Publication Play **sautée** — l'AAB signé est téléchargeable dans les artefacts du run." >> "$GITHUB_STEP_SUMMARY"

      - name: Résumé emplacement AAB
        if: always()
        shell: bash
        run: |
          if [ -f "${{ env.AAB_PATH }}" ]; then
            SIZE=$(du -h "${{ env.AAB_PATH }}" | cut -f1)
            echo "### ✅ AAB construit et signé" >> "$GITHUB_STEP_SUMMARY"
            echo "| Champ | Valeur |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Version | ${{ steps.ver.outputs.build_name }}+${{ steps.ver.outputs.build_number }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Taille | $SIZE |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Chemin runner | ${{ env.AAB_PATH }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Publication | AAB signé publié sur Google Play — binaire conservé sur le runner (${{ env.AAB_PATH }}) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::AAB introuvable à ${{ env.AAB_PATH }}"
          fi

      - name: Nettoyer le matériel de signature
        if: always()
        shell: bash
        run: |
          rm -f apps/mobile/android/app/upload-keystore.jks apps/mobile/android/key.properties
          rm -f "$RUNNER_TEMP/play-sa.json" 2>/dev/null || true
          az logout --output none 2>/dev/null || true
          echo "Matériel de signature supprimé du workspace du runner self-hosted."