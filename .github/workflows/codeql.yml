name: codeql

# Static application security testing (SAST) via CodeQL.
# Covers the compiled backend (C#) and the Node + Python content tooling.
# Dart/Flutter is not supported by CodeQL and is covered by `flutter analyze`
# in ci-mobile plus dependency scanning. Buildless ("none") mode is used so the
# scan never depends on a successful compile.
on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
  schedule:
    # Weekly full scan; PR/push runs are path-scoped and language-scoped below.
    - cron: "17 2 * * 0"

concurrency:
  group: codeql-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && (github.event.action == 'opened' || github.event.action == 'synchronize') && github.run_attempt == 1 && github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}-{2}', github.event_name, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.action == 'synchronize' && github.run_attempt == 1 && github.event.pull_request.number > 0 && github.event.after != '' }}

permissions: {}

jobs:
  freshness:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
    uses: ./.github/workflows/pr-head-freshness.yml
    with:
      pull-request-number: ${{ github.event.pull_request.number }}
      event-head-sha: ${{ github.event.pull_request.head.sha }}
    permissions:
      pull-requests: read

  changes:
    name: Select CodeQL languages
    needs: freshness
    if: ${{ always() && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request_target' || needs.freshness.outputs.current != 'false') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
    steps:
      - name: Enforce initial PR freshness validation
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        shell: bash
        env:
          FRESHNESS_RESULT: ${{ needs.freshness.result }}
        run: |
          if [ "$FRESHNESS_RESULT" != "success" ]; then
            echo "::error::Initial PR head freshness validation did not succeed."
            exit 1
          fi
      - name: Recheck current PR head after assignment
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const eventHead = context.payload.pull_request.head.sha;
            if (!eventHead || pull.head.sha !== eventHead) {
              core.setFailed(`Superseded PR event ${eventHead || '<missing>'}; current head is ${pull.head.sha}.`);
            }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect language paths
        id: filter
        if: ${{ github.event_name == 'pull_request_target' || github.event_name == 'push' }}
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            csharp:
              - 'backend/**'
            javascript:
              - 'tools/**/*.js'
              - 'tools/**/*.mjs'
              - '.github/scripts/**/*.js'
              - '.github/scripts/**/*.mjs'
              - 'package.json'
              - 'package-lock.json'
            python:
              - 'tools/**/*.py'
            workflow:
              - '.github/workflows/codeql.yml'
              - '.github/codeql/codeql-config.yml'
      - name: Build minimal language matrix
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CSHARP_CHANGED: ${{ steps.filter.outputs.csharp }}
          JAVASCRIPT_CHANGED: ${{ steps.filter.outputs.javascript }}
          PYTHON_CHANGED: ${{ steps.filter.outputs.python }}
          WORKFLOW_CHANGED: ${{ steps.filter.outputs.workflow }}
        run: |
          set -euo pipefail
          include=()
          if [ "$EVENT_NAME" = "schedule" ] || [ "$WORKFLOW_CHANGED" = "true" ]; then
            CSHARP_CHANGED=true
            JAVASCRIPT_CHANGED=true
            PYTHON_CHANGED=true
          fi
          [ "$CSHARP_CHANGED" = "true" ] &&
            include+=('{"language":"csharp","build-mode":"none"}')
          [ "$JAVASCRIPT_CHANGED" = "true" ] &&
            include+=('{"language":"javascript-typescript","build-mode":"none"}')
          [ "$PYTHON_CHANGED" = "true" ] &&
            include+=('{"language":"python","build-mode":"none"}')

          if [ "${#include[@]}" -eq 0 ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
          else
            joined=$(IFS=,; echo "${include[*]}")
            echo "matrix={\"include\":[$joined]}" >> "$GITHUB_OUTPUT"
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: [freshness, changes]
    if: ${{ always() && github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && needs.freshness.outputs.current != 'false' && needs.changes.outputs.has_changes == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      UNTRUSTED_SOURCE_DIR: ${{ github.workspace }}
      TRUSTED_CONTROL_DIR: ${{ github.workspace }}/.trusted-control
      CODEQL_RESULTS_DIR: ${{ github.workspace }}/.codeql-results/${{ matrix.language }}
      CODEQL_BLOCKING_SECURITY_SEVERITY: "7.0"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Enforce initial PR freshness validation
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        shell: bash
        env:
          FRESHNESS_RESULT: ${{ needs.freshness.result }}
        run: |
          if [ "$FRESHNESS_RESULT" != "success" ]; then
            echo "::error::Initial PR head freshness validation did not succeed."
            exit 1
          fi
      - name: Recheck current PR head after assignment
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const eventHead = context.payload.pull_request.head.sha;
            if (!eventHead || pull.head.sha !== eventHead) {
              core.setFailed(`Superseded PR event ${eventHead || '<missing>'}; current head is ${pull.head.sha}.`);
            }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          path: .
          persist-credentials: false

      - name: Reset trusted control checkout path
        shell: bash
        run: >-
          node -e 'require("node:fs").rmSync(process.env.TRUSTED_CONTROL_DIR, { recursive: true, force: true });'
      - name: Checkout immutable trusted controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: .trusted-control
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20.20.2"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          source-root: .
          config-file: ./.trusted-control/.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        id: codeql-analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
          output: ${{ env.CODEQL_RESULTS_DIR }}
          upload: never
          checkout_path: ${{ env.UNTRUSTED_SOURCE_DIR }}

      - name: Enforce CodeQL severity threshold
        if: ${{ always() }}
        run: node "$TRUSTED_CONTROL_DIR/.github/scripts/enforce-codeql-sarif.mjs" "$CODEQL_RESULTS_DIR"

  analyze-main:
    name: Analyze main (${{ matrix.language }})
    needs: changes
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && needs.changes.result == 'success' && needs.changes.outputs.has_changes == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      UNTRUSTED_SOURCE_DIR: ${{ github.workspace }}
      TRUSTED_CONTROL_DIR: ${{ github.workspace }}/.trusted-control
      CODEQL_RESULTS_DIR: ${{ github.workspace }}/.codeql-results/${{ matrix.language }}
      CODEQL_BLOCKING_SECURITY_SEVERITY: "7.0"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: .
          persist-credentials: false
      - name: Reset trusted control checkout path
        shell: bash
        run: >-
          node -e 'require("node:fs").rmSync(process.env.TRUSTED_CONTROL_DIR, { recursive: true, force: true });'
      - name: Checkout immutable trusted controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: .trusted-control
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20.20.2"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          source-root: .
          config-file: ./.trusted-control/.github/codeql/codeql-config.yml
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
          output: ${{ env.CODEQL_RESULTS_DIR }}
          upload: always
          checkout_path: ${{ env.UNTRUSTED_SOURCE_DIR }}
      - name: Enforce CodeQL severity threshold
        if: ${{ always() }}
        run: node "$TRUSTED_CONTROL_DIR/.github/scripts/enforce-codeql-sarif.mjs" "$CODEQL_RESULTS_DIR"

  security-gate:
    name: CodeQL / Security gate
    needs: [freshness, changes, analyze, analyze-main]
    if: ${{ always() && (github.event_name != 'pull_request_target' || (needs.freshness.outputs.current != 'false' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Enforce CodeQL result
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FRESHNESS_RESULT: ${{ needs.freshness.result }}
          FRESHNESS_CURRENT: ${{ needs.freshness.outputs.current }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          HAS_CHANGES: ${{ needs.changes.outputs.has_changes }}
          ANALYZE_RESULT: ${{ github.event_name == 'pull_request_target' && needs.analyze.result || needs.analyze-main.result }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request|pull_request_target)
              expected_freshness="success"
              if [ "$FRESHNESS_CURRENT" != "true" ]; then
                echo "::error::PR head freshness validation did not confirm the current head."
                exit 1
              fi
              ;;
            push|schedule)
              expected_freshness="skipped"
              ;;
            *)
              echo "::error::Unsupported CodeQL gate event '$EVENT_NAME'."
              exit 1
              ;;
          esac
          if [ "$FRESHNESS_RESULT" != "$expected_freshness" ]; then
            echo "::error::CodeQL freshness result was '$FRESHNESS_RESULT'; expected '$expected_freshness' for '$EVENT_NAME'."
            exit 1
          fi
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::CodeQL path selection did not succeed."
            exit 1
          fi
          case "$HAS_CHANGES" in
            true)
              expected_analysis="success"
              ;;
            false)
              expected_analysis="skipped"
              ;;
            *)
              echo "::error::CodeQL path selection returned invalid has_changes value '$HAS_CHANGES'."
              exit 1
              ;;
          esac
          if [ "$ANALYZE_RESULT" != "$expected_analysis" ]; then
            echo "::error::CodeQL analysis result was '$ANALYZE_RESULT'; expected '$expected_analysis' for has_changes='$HAS_CHANGES'."
            exit 1
          fi
