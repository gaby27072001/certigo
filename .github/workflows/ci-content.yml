name: ci-content

# Validates content-as-code (YAML tracks & lessons) against the JSON schemas in
# content/schema. Keeps the knowledge base structurally correct before publish.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "content/**", "tools/validate_content.mjs", ".github/workflows/ci-content.yml" ]
  pull_request:
    paths: [ "content/**", "tools/validate_content.mjs", ".github/workflows/ci-content.yml" ]

concurrency:
  group: ci-content-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate tracks & lessons
    # CI-01 (fork-guard) : une PR de FORK exécute du code non fiable → elle NE doit
    # PAS toucher le runner self-hosted persistant. Sur un évènement pull_request, on
    # n'autorise le job QUE si la PR vient du même repo (branche interne). Les
    # évènements push/dispatch passent inchangés → zéro régression.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    # CI-01 : approbation humaine requise pour les PR (Environment pr-ci) avant
    # exécution sur le runner self-hosted persistant. Sans effet pour push/dispatch.
    environment: ${{ github.event_name == 'pull_request' && 'pr-ci' || '' }}
    runs-on: ${{ vars.CI_GITHUB_HOSTED_FALLBACK == 'true' && 'ubuntu-latest' || (github.event_name != 'pull_request' && (vars.MAIN_CRITICAL_RUNNER_LABELS && fromJSON(vars.MAIN_CRITICAL_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]')) || (vars.PR_RUNNER_LABELS && fromJSON(vars.PR_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]'))) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install validator deps
        run: npm install --no-save ajv ajv-formats yaml glob
      - name: Validate content
        run: node tools/validate_content.mjs
      - name: npm audit backend tools
        run: cd backend && npm audit --audit-level=high 2>/dev/null || true
      - name: pip check content tools
        run: pip check 2>/dev/null || true
