name: ci-content

# Validates content-as-code (YAML tracks & lessons) against the JSON schemas in
# content/schema. Keeps the knowledge base structurally correct before publish.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "content/**", "tools/validate_content.mjs", ".github/workflows/ci-content.yml" ]
  pull_request_target:
    paths: [ "content/**", "tools/validate_content.mjs", ".github/workflows/ci-content.yml" ]

concurrency:
  group: ci-content-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && (github.event.action == 'opened' || github.event.action == 'synchronize') && github.run_attempt == 1 && github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}-{2}', github.event_name, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.action == 'synchronize' && github.run_attempt == 1 && github.event.pull_request.number > 0 && github.event.after != '' }}

permissions:
  contents: read

jobs:
  freshness:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
    uses: ./.github/workflows/pr-head-freshness.yml
    with:
      pull-request-number: ${{ github.event.pull_request.number }}
      event-head-sha: ${{ github.event.pull_request.head.sha }}
    permissions:
      pull-requests: read

  validate:
    name: Validate tracks & lessons
    needs: freshness
    if: ${{ always() && (github.event_name != 'pull_request_target' || (needs.freshness.outputs.current != 'false' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Enforce initial PR freshness validation
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        shell: bash
        env:
          FRESHNESS_RESULT: ${{ needs.freshness.result }}
        run: |
          if [ "$FRESHNESS_RESULT" != "success" ]; then
            echo "::error::Initial PR head freshness validation did not succeed."
            exit 1
          fi
      - name: Recheck current PR head after assignment
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const eventHead = context.payload.pull_request.head.sha;
            if (!eventHead || pull.head.sha !== eventHead) {
              core.setFailed(`Superseded PR event ${eventHead || '<missing>'}; current head is ${pull.head.sha}.`);
            }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
      - name: Install validator dependencies from lock
        run: npm ci
      - name: Validate content
        run: node tools/validate_content.mjs
      - name: npm audit backend tools
        run: cd backend && npm audit --audit-level=high 2>/dev/null || true
      - name: pip check content tools
        run: pip check 2>/dev/null || true
