name: ci-content

# Validates content-as-code (YAML tracks & lessons) against the JSON schemas in
# content/schema. Keeps the knowledge base structurally correct before publish.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "content/**", "tools/validate_content.mjs", ".github/workflows/ci-content.yml" ]
  pull_request_target:
    paths: [ "content/**", "tools/validate_content.mjs", ".github/workflows/ci-content.yml" ]

concurrency:
  group: ci-content-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate tracks & lessons
    if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository }}
    environment: ${{ github.event_name == 'pull_request_target' && 'pr-ci' || '' }}
    runs-on: [self-hosted, Linux, X64, certigo-ci]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
      - name: Install validator dependencies from lock
        run: npm ci
      - name: Validate content
        run: node tools/validate_content.mjs
      - name: npm audit backend tools
        run: cd backend && npm audit --audit-level=high 2>/dev/null || true
      - name: pip check content tools
        run: pip check 2>/dev/null || true
