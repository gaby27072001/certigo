name: ci-infra

# Lints and compiles the Bicep IaC so template errors surface on PRs.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "infra/**"
      - ".github/scripts/write-secure-bicep-parameters.mjs"
      - ".github/scripts/write-secure-bicep-parameters.test.mjs"
      - ".github/scripts/public-domain-contract.mjs"
      - ".github/scripts/public-domain-contract.test.mjs"
      - ".github/scripts/deploy-flex-onedeploy.sh"
      - ".github/scripts/deploy-flex-onedeploy.test.mjs"
      - ".github/workflows/cd-backend.yml"
      - ".github/workflows/ci-infra.yml"
      - ".github/workflows/post-merge-cosmos-account-deletion.yml"
      - ".github/workflows/runner-health.yml"
      - "docs/ACCOUNT_DELETION.md"
      - "docs/deployment-runbook.md"
      - "docs/PUBLIC_DOMAIN_MIGRATION.md"
      - "docs/E2E_AUTH_PREREQUIS.md"
      - "docs/legal/account-deletion.md"
      - "docs/legal/privacy-policy.md"
      - "tools/build_public_pages.mjs"
      - "tools/tests/build_public_pages.test.mjs"
      - ".github/workflows-disabled/post-merge-cosmos-account-deletion.yml"
      - ".github/workflows-disabled/test-account-deletion-cosmos.yml"
      - "docs/runbooks/COSMOS_EMULATOR_RUNNER.md"
  pull_request_target:
    paths:
      - "infra/**"
      - ".github/scripts/write-secure-bicep-parameters.mjs"
      - ".github/scripts/write-secure-bicep-parameters.test.mjs"
      - ".github/scripts/public-domain-contract.mjs"
      - ".github/scripts/public-domain-contract.test.mjs"
      - ".github/scripts/deploy-flex-onedeploy.sh"
      - ".github/scripts/deploy-flex-onedeploy.test.mjs"
      - ".github/workflows/cd-backend.yml"
      - ".github/workflows/ci-infra.yml"
      - ".github/workflows/post-merge-cosmos-account-deletion.yml"
      - ".github/workflows/runner-health.yml"
      - "docs/ACCOUNT_DELETION.md"
      - "docs/deployment-runbook.md"
      - "docs/PUBLIC_DOMAIN_MIGRATION.md"
      - "docs/E2E_AUTH_PREREQUIS.md"
      - "docs/legal/account-deletion.md"
      - "docs/legal/privacy-policy.md"
      - "tools/build_public_pages.mjs"
      - "tools/tests/build_public_pages.test.mjs"
      - ".github/workflows-disabled/post-merge-cosmos-account-deletion.yml"
      - ".github/workflows-disabled/test-account-deletion-cosmos.yml"
      - "docs/runbooks/COSMOS_EMULATOR_RUNNER.md"

concurrency:
  group: ci-infra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bicep-build:
    name: Bicep build (lint)
    if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64, certigo-pr]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20.20.2"
      # CI-09 : le runner-2 n'a PAS l'Azure CLI (`az`). On installe le CLI Bicep
      # standalone dans un répertoire écrivable ($RUNNER_TEMP) et on l'ajoute au PATH,
      # de sorte que le lint fonctionne à l'identique sur les DEUX runners.
      - name: Install Bicep CLI
        run: |
          set -euo pipefail
          BICEP_DIR="$RUNNER_TEMP/bicep"
          mkdir -p "$BICEP_DIR"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$BICEP_DIR/bicep" \
            https://github.com/Azure/bicep/releases/download/v0.44.1/bicep-linux-x64
          echo "e17dc9a9888184886bb0c0051a3230b83b19f342749999f707bc571c3dfd2f45  $BICEP_DIR/bicep" \
            | sha256sum --check --strict
          chmod +x "$BICEP_DIR/bicep"
          echo "$BICEP_DIR" >> "$GITHUB_PATH"
          "$BICEP_DIR/bicep" --version
      - name: Compile all Bicep templates and parameters
        run: BICEP_BIN=bicep bash infra/validate.sh
      - name: Validate ci-runner bootstrap and health probe
        run: bash infra/ci-runner/validate.sh
      - name: Validate runner observability metrics
        run: node --test .github/scripts/runner-observability.test.mjs
      - name: Validate isolated Cosmos emulator runner
        run: bash infra/ci-runner/cosmos-emulator/validate.sh
      - name: Validate Cosmos indexing policy
        run: node --test infra/tests/cosmos-indexing-policy.test.mjs
      - name: Validate private networking topology
        run: node --test infra/tests/private-networking.test.mjs
      - name: Validate FinOps guardrails
        run: node --test infra/tests/finops-guardrails.test.mjs
      - name: Validate public account-deletion policy
        run: node --test tools/tests/build_public_pages.test.mjs
      - name: Validate public-domain contract
        run: node --test .github/scripts/public-domain-contract.test.mjs
      - name: Validate compiled public-domain ARM gates
        run: node --test infra/tests/public-domain-contract.test.mjs
      - name: Validate secure deployment parameter writer
        run: node --test .github/scripts/write-secure-bicep-parameters.test.mjs
      - name: Validate private URL-based OneDeploy
        run: node --test .github/scripts/deploy-flex-onedeploy.test.mjs
      - name: Validate least-privilege cloud guardrails
        run: node --test infra/tests/least-privilege.test.mjs
