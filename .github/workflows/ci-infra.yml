name: ci-infra

# Lints and compiles the Bicep IaC so template errors surface on PRs.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "infra/**", ".github/workflows/ci-infra.yml" ]
  pull_request:
    paths: [ "infra/**", ".github/workflows/ci-infra.yml" ]

concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: true

env:
  NON_CRITICAL_RUNNER_LABELS_JSON: ${{ vars.PR_RUNNER_LABELS || '["self-hosted","Linux","X64","microlingo-ci"]' }}

jobs:
  bicep-build:
    name: Bicep build (lint)
    runs-on: ${{ fromJSON(env.NON_CRITICAL_RUNNER_LABELS_JSON) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build main.bicep
        run: az bicep build --file infra/main.bicep
      - name: Build ci-runner network.bicep
        run: az bicep build --file infra/ci-runner/network.bicep
      - name: Lint params
        run: az bicep build-params --file infra/params/dev.bicepparam --outfile /dev/null
      - name: Lint params (staging)
        run: az bicep build-params --file infra/params/staging.bicepparam --outfile /dev/null
      - name: Lint params (prod)
        run: az bicep build-params --file infra/params/prod.bicepparam --outfile /dev/null
