name: Verify current PR head

on:
  workflow_call:
    inputs:
      pull-request-number:
        required: true
        type: number
      event-head-sha:
        required: true
        type: string
    outputs:
      current:
        description: Whether the triggering event still targets the current PR head
        value: ${{ jobs.freshness.outputs.current }}

permissions: {}

jobs:
  freshness:
    name: Verify current PR head
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      current: ${{ steps.current-head.outputs.current }}
    steps:
      - name: Compare event head with current PR head
        id: current-head
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          EVENT_HEAD_SHA: ${{ inputs.event-head-sha }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const pullNumber = Number(process.env.PULL_REQUEST_NUMBER);
            const eventHeadSha = process.env.EVENT_HEAD_SHA;
            if (!Number.isInteger(pullNumber) || pullNumber <= 0 || !eventHeadSha) {
              core.setFailed('A positive PR number and event head SHA are required.');
              return;
            }
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            const current = pull.head.sha === eventHeadSha;
            core.setOutput('current', current ? 'true' : 'false');
            if (!current) {
              core.notice(
                `Skipping superseded PR event ${eventHeadSha}; current head is ${pull.head.sha}.`,
              );
            }
