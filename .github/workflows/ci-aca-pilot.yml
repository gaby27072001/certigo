name: ACA runner pilot (disabled by default)

on:
  workflow_dispatch:
    inputs:
      workload:
        description: Stateless validation to exercise on the ACA runner
        required: true
        type: choice
        options:
          - ci-content
          - ci-migration-registry
          - lint-workflows
          - ci-project-state
      pull-request-number:
        description: Open same-repository pull request to validate
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-aca-pilot-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  validate:
    name: Pilot ${{ inputs.workload }}
    if: ${{ github.repository == 'gchambaud_microsoft/Certigo' && github.ref == 'refs/heads/main' && vars.CERTIGO_ACA_PILOT_ENABLED == 'true' }}
    runs-on: [self-hosted, Linux, X64, certigo-pr-aca]
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ inputs['pull-request-number'] }}
      REQUESTED_WORKLOAD: ${{ inputs.workload }}
      UNTRUSTED_SOURCE_DIR: ${{ github.workspace }}/.untrusted-source
      TRUSTED_CONTROL_DIR: ${{ github.workspace }}/.trusted-control
      PYTHONSAFEPATH: "1"
    steps:
      - name: Authorize immutable internal PR head
        id: authorize
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RUNNER_NAME: ${{ runner.name }}
        with:
          github-token: ${{ github.token }}
          script: |
            const pullNumber = Number.parseInt(process.env.PR_NUMBER, 10);
            if (!Number.isSafeInteger(pullNumber) || pullNumber < 1 || String(pullNumber) !== process.env.PR_NUMBER) {
              core.setFailed('pull-request-number must be a positive canonical integer.');
              return;
            }
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            if (pull.state !== 'open' || pull.base.ref !== 'main') {
              core.setFailed('The pilot accepts only open pull requests targeting main.');
              return;
            }
            if (pull.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Fork pull requests are not eligible for the ACA pilot.');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(pull.head.sha)) {
              core.setFailed('GitHub returned an invalid pull request head SHA.');
              return;
            }
            core.setOutput('sha', pull.head.sha);

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRunAttempt,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                attempt_number: context.runAttempt,
                per_page: 100,
              },
            );
            const current = jobs.find((job) => job.runner_name === process.env.RUNNER_NAME);
            const created = Date.parse(current?.created_at ?? '');
            const started = Date.parse(current?.started_at ?? '');
            const queueSeconds = Number.isFinite(created) && Number.isFinite(started)
              ? Math.max(0, Math.round((started - created) / 1000))
              : null;
            core.info(`CERTIGO_ACA_METRIC ${JSON.stringify({
              event: 'job_start',
              workload: process.env.REQUESTED_WORKLOAD,
              queueSeconds,
              runId: context.runId,
              runAttempt: context.runAttempt,
            })}`);

      - name: Checkout immutable untrusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.authorize.outputs.sha }}
          path: .untrusted-source
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable trusted controls
        if: ${{ inputs.workload == 'lint-workflows' || inputs.workload == 'ci-project-state' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: .trusted-control
          persist-credentials: false

      - name: Set up Node.js
        if: ${{ inputs.workload == 'ci-content' || inputs.workload == 'lint-workflows' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20.20.2"

      - name: Set up Python
        if: ${{ inputs.workload == 'ci-migration-registry' || inputs.workload == 'ci-project-state' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate content
        if: ${{ inputs.workload == 'ci-content' }}
        working-directory: .untrusted-source
        run: |
          npm ci
          node tools/validate_content.mjs

      - name: Audit backend tools
        if: ${{ inputs.workload == 'ci-content' }}
        working-directory: .untrusted-source
        run: cd backend && npm audit --audit-level=high 2>/dev/null || true

      - name: Check content Python environment
        if: ${{ inputs.workload == 'ci-content' }}
        run: pip check 2>/dev/null || true

      - name: Validate migration registry
        if: ${{ inputs.workload == 'ci-migration-registry' }}
        working-directory: .untrusted-source
        run: |
          python -m pip install PyYAML==6.0.2
          python tools/validate_migration_registry.py

      - name: Install actionlint
        if: ${{ inputs.workload == 'lint-workflows' }}
        run: |
          set -euo pipefail
          actionlint_dir="$RUNNER_TEMP/actionlint"
          archive="$actionlint_dir/actionlint.tar.gz"
          mkdir -p "$actionlint_dir"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" \
            | sha256sum --check --strict
          tar xzf "$archive" -C "$actionlint_dir"
          chmod +x "$actionlint_dir/actionlint"
          echo "$actionlint_dir" >> "$GITHUB_PATH"

      - name: Install trusted workflow validator dependencies
        if: ${{ inputs.workload == 'lint-workflows' }}
        working-directory: .trusted-control
        run: npm ci --ignore-scripts

      - name: Validate workflow YAML and security policy
        if: ${{ inputs.workload == 'lint-workflows' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          workflows=(
            "$UNTRUSTED_SOURCE_DIR"/.github/workflows/*.yml
            "$UNTRUSTED_SOURCE_DIR"/.github/workflows/*.yaml
          )
          if [ "${#workflows[@]}" -eq 0 ]; then
            echo "::error::No workflow files found under .github/workflows."
            exit 1
          fi
          actionlint "${workflows[@]}"
          node "$TRUSTED_CONTROL_DIR/.github/scripts/validate-workflow-security.mjs" \
            --workspace "$UNTRUSTED_SOURCE_DIR"
          (
            cd "$TRUSTED_CONTROL_DIR"
            node --test .github/scripts/*.test.mjs
          )

      - name: Validate generated project state
        if: ${{ inputs.workload == 'ci-project-state' }}
        run: |
          set -euo pipefail
          (
            cd "$TRUSTED_CONTROL_DIR"
            python -P -m unittest discover -s tools/tests -p "test_*.py" -v
            python -P tools/project_state.py --root "$UNTRUSTED_SOURCE_DIR" --check
          )

      - name: Emit completion capacity metric
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          disk_used_percent="$(df --output=pcent "$GITHUB_WORKSPACE" | tail -n 1 | tr -cd '0-9')"
          printf 'CERTIGO_ACA_METRIC {"event":"job_complete","workload":"%s","diskUsedPercent":%d,"timestamp":"%s"}\n' \
            "$REQUESTED_WORKLOAD" "${disk_used_percent:-0}" "$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
