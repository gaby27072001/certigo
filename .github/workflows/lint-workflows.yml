# Valide la syntaxe de tous les workflows GitHub Actions a chaque PR sur main.
# Bloque les PRs qui introduisent des workflows YAML malformes ou non conformes
# au schema GitHub Actions (ex. doublon d'id:, champs inconnus, etc.).
# Les PR, y compris les forks, utilisent un runner GitHub-hosted ephemere sans secrets.
name: Lint GitHub Actions workflows

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate workflow YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          ACTIONLINT_DIR="$RUNNER_TEMP/actionlint"
          ACTIONLINT_ARCHIVE="$ACTIONLINT_DIR/actionlint.tar.gz"
          mkdir -p "$ACTIONLINT_DIR"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$ACTIONLINT_ARCHIVE" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $ACTIONLINT_ARCHIVE" \
            | sha256sum --check --strict
          tar xzf "$ACTIONLINT_ARCHIVE" -C "$ACTIONLINT_DIR"
          chmod +x "$ACTIONLINT_DIR/actionlint"
          echo "$ACTIONLINT_DIR" >> "$GITHUB_PATH"

      - name: Validate all workflows
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          workflows=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ "${#workflows[@]}" -eq 0 ]; then
            echo "::error::No workflow files found under .github/workflows."
            exit 1
          fi
          actionlint "${workflows[@]}"

      - name: Enforce workflow security policy
        run: node .github/scripts/validate-workflow-security.mjs

      - name: Test workflow security scripts
        run: node --test .github/scripts/*.test.mjs
