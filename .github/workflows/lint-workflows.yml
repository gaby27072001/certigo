# Loaded from main through pull_request_target. Only same-repository pull
# requests are checked out; fork policy is enforced by fork-pr-policy.yml.
name: Lint GitHub Actions workflows

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate workflow YAML
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64, certigo-pr]
    env:
      UNTRUSTED_SOURCE_DIR: ${{ github.workspace }}/.untrusted-source
      TRUSTED_CONTROL_DIR: ${{ github.workspace }}/.trusted-control
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .untrusted-source
          persist-credentials: false

      - name: Checkout immutable trusted controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-control
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          ACTIONLINT_DIR="$RUNNER_TEMP/actionlint"
          ACTIONLINT_ARCHIVE="$ACTIONLINT_DIR/actionlint.tar.gz"
          mkdir -p "$ACTIONLINT_DIR"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$ACTIONLINT_ARCHIVE" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $ACTIONLINT_ARCHIVE" \
            | sha256sum --check --strict
          tar xzf "$ACTIONLINT_ARCHIVE" -C "$ACTIONLINT_DIR"
          chmod +x "$ACTIONLINT_DIR/actionlint"
          echo "$ACTIONLINT_DIR" >> "$GITHUB_PATH"

      - name: Validate all workflows
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          workflows=(
            "$UNTRUSTED_SOURCE_DIR"/.github/workflows/*.yml
            "$UNTRUSTED_SOURCE_DIR"/.github/workflows/*.yaml
          )
          if [ "${#workflows[@]}" -eq 0 ]; then
            echo "::error::No workflow files found under .github/workflows."
            exit 1
          fi
          actionlint "${workflows[@]}"

      - name: Enforce workflow security policy
        run: |
          node "$TRUSTED_CONTROL_DIR/.github/scripts/validate-workflow-security.mjs" \
            --workspace "$UNTRUSTED_SOURCE_DIR"

      - name: Test workflow security scripts
        working-directory: .trusted-control
        run: node --test .github/scripts/*.test.mjs
