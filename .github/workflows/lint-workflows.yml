# Valide la syntaxe de tous les workflows GitHub Actions à chaque PR sur main.
# Bloque les PRs qui introduisent des workflows YAML malformés ou non conformes
# au schéma GitHub Actions (ex. doublon d'id:, champs inconnus, etc.).
name: Lint GitHub Actions workflows

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate workflow YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all workflows with action-validator
        uses: raven-actions/actionlint@v2
        with:
          files: ".github/workflows/*.yml"
