# Valide la syntaxe de tous les workflows GitHub Actions a chaque PR sur main.
# Bloque les PRs qui introduisent des workflows YAML malformes ou non conformes
# au schema GitHub Actions (ex. doublon d'id:, champs inconnus, etc.).
# Note: utilise le runner self-hosted (les GitHub-hosted runners sont desactives dans ce repo).
name: Lint GitHub Actions workflows

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate workflow YAML
    runs-on: [self-hosted, Linux, X64, law-microlingo]
    steps:
      - uses: actions/checkout@v4

      - name: Validate all workflows with action-validator
        uses: raven-actions/actionlint@v2
        with:
          files: ".github/workflows/*.yml"
