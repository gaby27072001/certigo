# Valide la syntaxe de tous les workflows GitHub Actions a chaque PR sur main.
# Bloque les PRs qui introduisent des workflows YAML malformes ou non conformes
# au schema GitHub Actions (ex. doublon d'id:, champs inconnus, etc.).
# Note: ce lint reste runnerless (GitHub-hosted) pour eviter toute dependance au pool self-hosted.
name: Lint GitHub Actions workflows

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate workflow YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all workflows with action-validator
        uses: raven-actions/actionlint@v2
        with:
          files: ".github/workflows/*.yml"
