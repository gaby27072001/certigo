# Valide la syntaxe de tous les workflows GitHub Actions a chaque PR sur main.
# Bloque les PRs qui introduisent des workflows YAML malformes ou non conformes
# au schema GitHub Actions (ex. doublon d'id:, champs inconnus, etc.).
# Note: utilise le runner self-hosted (les GitHub-hosted runners sont desactives dans ce repo).
name: Lint GitHub Actions workflows

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate workflow YAML
    # CI-01 (fork-guard) : une PR de FORK exécute du code non fiable → elle NE doit
    # PAS toucher le runner self-hosted persistant. Sur un évènement pull_request, on
    # n'autorise le job QUE si la PR vient du même repo (branche interne). Les
    # évènements push/dispatch passent inchangés → zéro régression.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    # CI-01 : approbation humaine requise pour les PR (Environment pr-ci) avant
    # exécution sur le runner self-hosted persistant. Sans effet pour push/dispatch.
    environment: ${{ github.event_name == 'pull_request' && 'pr-ci' || '' }}
    runs-on: ${{ vars.CI_GITHUB_HOSTED_FALLBACK == 'true' && 'ubuntu-latest' || (vars.PR_RUNNER_LABELS && fromJSON(vars.PR_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | tar xz -C /tmp
          chmod +x /tmp/actionlint

      - name: Validate all workflows
        run: /tmp/actionlint .github/workflows/*.yml
