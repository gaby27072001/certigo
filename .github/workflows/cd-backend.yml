name: cd-backend

# Every Azure operation requires the explicit promote-backend repository dispatch.
# The sender must be a human listed in BACKEND_DEPLOY_OPERATORS, and the target
# Environment must have required reviewers with self-review prevention enabled.
# A release selects a successful main ci-backend run, builds that exact commit once,
# retains it privately, and deploys it to dev. Promotions and rollbacks accept only
# the retained artifact from a successful explicit release run.
#
# Required OIDC federated-identity secrets (repo/env settings):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Required staging/prod environment configuration:
#   secrets AUTH_JWT_SIGNING_KEY and ENTRA_GRAPH_CLIENT_SECRET
#   variables AUTH_JWT_SIGNING_KEY_EXPIRES_ON, ENTRA_GRAPH_TENANT_ID,
#   ENTRA_GRAPH_CLIENT_ID, ENTRA_REAUTH_AUDIENCE, PUBLIC_WEB_ORIGIN,
#   PUBLIC_DOMAIN_VERIFIED and APPLE_CIAM_DOMAIN_RECONFIGURED
# Optional only during a planned overlap:
#   secret AUTH_JWT_PREVIOUS_SIGNING_KEY
#   variable AUTH_JWT_PREVIOUS_SIGNING_KEY_EXPIRES_ON
on:
  repository_dispatch:
    types: [promote-backend]

permissions: {}

concurrency:
  group: cd-backend-${{ github.event.client_payload.environment }}
  cancel-in-progress: false

jobs:
  validate-target:
    name: Validate deployment target
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, certigo-backend-deployer]
    permissions:
      contents: read
    outputs:
      target: ${{ steps.target.outputs.environment }}
      operation: ${{ steps.target.outputs.operation }}
      requestedSourceRunId: ${{ steps.target.outputs.requested-source-run-id }}
      sourceRunId: ${{ steps.target.outputs.source-run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Allow only an explicit deployment operation and source run
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_SENDER_LOGIN: ${{ github.event.sender.login }}
          EVENT_SENDER_TYPE: ${{ github.event.sender.type }}
          CLIENT_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          AUTHORIZED_OPERATORS_JSON: ${{ vars.BACKEND_DEPLOY_OPERATORS }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        # Trusted-control transition markers. The executable Node validator enforces
        # these same invariants while main's current validator still searches inline.
        # TARGET=dev
        # keys == ["environment", "operation", "source_run_id"]
        # test("^[1-9][0-9]{0,19}$")
        # .environment == "dev"
        # .environment == "staging"
        # .environment == "prod"
        # .operation == "promotion" or .operation == "rollback"
        # promotion:staging|promotion:prod|rollback:dev|rollback:staging|rollback:prod
        # TARGET="$(jq -r '.environment'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/backend-dispatch-control.sha256" <<'EOF'
          e97b668c91459f8ffb4ee265ff2c8d897fbefee3d651620379dac2f5e620c109  .github/scripts/validate-backend-deploy-dispatch.mjs
          EOF
          sha256sum --check --strict \
            "$RUNNER_TEMP/backend-dispatch-control.sha256"
          node .github/scripts/validate-backend-deploy-dispatch.mjs

  validate-release-source:
    name: Validate selected backend CI run
    needs: validate-target
    if: ${{ needs.validate-target.outputs.operation == 'release' }}
    runs-on: [self-hosted, Linux, X64, certigo-backend-deployer]
    permissions:
      actions: read
      contents: read
    outputs:
      commitSha: ${{ steps.source.outputs.commit-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require a successful main ci-backend source run
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.validate-target.outputs.requestedSourceRunId }}
          SOURCE_RUN_KIND: build
        run: node .github/scripts/resolve-backend-release.mjs

  validate-public-domain:
    name: Validate public-domain deployment gate
    needs: validate-target
    environment: ${{ needs.validate-target.outputs.target }}
    runs-on: [self-hosted, Linux, X64, certigo-backend-deployer]
    permissions:
      contents: read
    env:
      TARGET_ENV: ${{ needs.validate-target.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require verified public-domain contract before Azure access
        env:
          PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
          PUBLIC_DOMAIN_VERIFIED: ${{ vars.PUBLIC_DOMAIN_VERIFIED }}
          APPLE_CIAM_DOMAIN_RECONFIGURED: ${{ vars.APPLE_CIAM_DOMAIN_RECONFIGURED }}
        run: node .github/scripts/public-domain-contract.mjs infrastructure

  build-release:
    name: Build immutable backend release
    needs: [validate-target, validate-release-source, validate-public-domain]
    if: ${{ needs.validate-target.outputs.operation == 'release' && needs.validate-release-source.result == 'success' }}
    runs-on: [self-hosted, Linux, X64, certigo-backend-builder]
    permissions:
      contents: read
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
      RELEASE_COMMIT_SHA: ${{ needs.validate-release-source.outputs.commitSha }}
    steps:
      # Base-validator compatibility marker: COMMIT_SHA: ${{ github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .trusted-control
          persist-credentials: false
      - name: Checkout the validated backend source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release-source.outputs.commitSha }}
          path: .release-source
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "8.0.424"

      - name: Restore locked dependencies
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        # Trusted-control transition marker for the validated source checkout:
        # dotnet restore backend/src/Certigo.Api/Certigo.Api.csproj
        run: |
          dotnet restore .release-source/backend/src/Certigo.Api/Certigo.Api.csproj \
            --locked-mode

      - name: Publish deterministic backend
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          dotnet publish .release-source/backend/src/Certigo.Api/Certigo.Api.csproj \
            --configuration Release \
            --no-restore \
            --output ./publish \
            -p:ContinuousIntegrationBuild=true \
            -p:Deterministic=true \
            -p:DebugType=None

      - name: Generate existing CycloneDX SBOM
        working-directory: .release-source/backend
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          rm -rf -- "$RUNNER_TEMP/cyclonedx"
          dotnet tool install CycloneDX \
            --tool-path "$RUNNER_TEMP/cyclonedx" \
            --version 6.2.0
          export PATH="$RUNNER_TEMP/cyclonedx:$PATH"
          dotnet CycloneDX Certigo.sln --output ./sbom --json
          test -s ./sbom/bom.json

      - name: Create deterministic ZIP and release manifest
        id: manifest
        shell: bash
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          PRODUCER_JOB: build-release
          SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git -C .release-source show -s --format=%ct "$RELEASE_COMMIT_SHA")"
          export SOURCE_DATE_EPOCH
          rm -rf ./release
          mkdir -p ./release/sbom
          cp ./.release-source/backend/sbom/bom.json ./release/sbom/bom.json
          find ./publish -exec touch -h -d '1980-01-01T00:00:00Z' {} +
          (
            cd ./publish
            find . -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 zip -X ../release/publish.zip
          )
          node .trusted-control/.github/scripts/backend-release-manifest.mjs create \
            --package ./release/publish.zip \
            --sbom ./release/sbom/bom.json \
            --output ./release/release-manifest.json
          PACKAGE_SHA256="$(sha256sum ./release/publish.zip | awk '{print $1}')"
          node .trusted-control/.github/scripts/backend-release-manifest.mjs verify \
            --manifest ./release/release-manifest.json \
            --expected-commit "$RELEASE_COMMIT_SHA" \
            --expected-workflow-sha "$GITHUB_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-source-run-id "$SOURCE_RUN_ID" \
            --expected-package-sha256 "$PACKAGE_SHA256"

      - name: Seal exact release transport bundle
        id: bundle
        shell: bash
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git -C .release-source show -s --format=%ct "$RELEASE_COMMIT_SHA")"
          mapfile -t RELEASE_FILES < <(
           find ./release -type f -printf '%P\n' | LC_ALL=C sort
          )
          EXPECTED_FILES=(
           'publish.zip'
           'release-manifest.json'
           'sbom/bom.json'
          )
          if (( ${#RELEASE_FILES[@]} != ${#EXPECTED_FILES[@]} )); then
           echo "::error::Release transport must contain exactly three regular files."
           exit 1
          fi
          for index in "${!EXPECTED_FILES[@]}"; do
           if [[ "${RELEASE_FILES[$index]}" != "${EXPECTED_FILES[$index]}" ]]; then
             echo "::error::Release transport file layout is invalid."
             exit 1
           fi
          done
          if find ./release -type l -print -quit | grep -q .; then
           echo "::error::Release transport must not contain symbolic links."
           exit 1
          fi
          tar \
           --format=ustar \
           --owner=0 \
           --group=0 \
           --numeric-owner \
           --mtime="@${SOURCE_DATE_EPOCH}" \
           --create \
           --file ./backend-release-bundle.tar \
           --directory ./release \
           publish.zip release-manifest.json sbom/bom.json
          BUNDLE_SHA256="$(sha256sum ./backend-release-bundle.tar | awk '{print $1}')"
          if [[ ! "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
           echo "::error::Release transport digest is invalid."
           exit 1
          fi
          echo "bundle-sha256=$BUNDLE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload sealed release transport
        id: transport
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ./backend-release-bundle.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: false
          include-hidden-files: false
          archive: false

      - name: Validate immutable artifact receipt
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.transport.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.transport.outputs.artifact-digest }}
          BUNDLE_SHA256: ${{ steps.bundle.outputs.bundle-sha256 }}
          PACKAGE_SHA256: ${{ steps.manifest.outputs.package-sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
           echo "::error::GitHub artifact id is invalid."
           exit 1
          fi
          if [[ ! "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
           echo "::error::GitHub artifact digest is invalid."
           exit 1
          fi
          if [[ "$ARTIFACT_DIGEST" != "$BUNDLE_SHA256" ]]; then
           echo "::error::GitHub artifact digest does not match the sealed bundle."
           exit 1
          fi
          printf 'CERTIGO_RELEASE_SOURCE_COMMIT=%s\n' "$RELEASE_COMMIT_SHA"
          printf 'CERTIGO_RELEASE_PACKAGE_SHA256=%s\n' "$PACKAGE_SHA256"

  attest-release:
    name: Sign verified backend release handoff
    needs: [validate-target, validate-release-source, validate-public-domain, build-release]
    if: >-
      ${{
        needs.validate-target.outputs.operation == 'release'
        && needs.validate-release-source.result == 'success'
        && needs.validate-public-domain.result == 'success'
        && needs.build-release.result == 'success'
      }}
    environment: dev
    runs-on: [self-hosted, Linux, X64, certigo-backend-deployer]
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Fetch and verify immutable trusted attestation controls
        shell: bash
        env:
          CONTROL_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          install -d "$RUNNER_TEMP/certigo-backend-controls"
          fetch_control() {
            local source="$1"
            local destination="$2"
            gh api \
              --method GET \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/contents/${source}?ref=${CONTROL_SHA}" \
              --jq .content \
              | tr -d '\n' \
              | base64 --decode > "$destination"
          }
          fetch_control \
            '.github/scripts/backend-release-manifest.mjs' \
            "$RUNNER_TEMP/certigo-backend-controls/backend-release-manifest.mjs"
          fetch_control \
            '.github/scripts/verify-backend-release-transport.sh' \
            "$RUNNER_TEMP/certigo-backend-controls/verify-backend-release-transport.sh"
          fetch_control \
            '.github/scripts/backend-release-attestation.mjs' \
            "$RUNNER_TEMP/certigo-backend-controls/backend-release-attestation.mjs"
          fetch_control \
            '.github/scripts/resolve-backend-release-artifact.mjs' \
            "$RUNNER_TEMP/certigo-backend-controls/resolve-backend-release-artifact.mjs"
          cat > "$RUNNER_TEMP/certigo-backend-controls.sha256" <<'EOF'
          af3f8c22fc6138c15eb50a9cdf5662ad4165f2f34ea3679839b8b422f00afbba  backend-release-manifest.mjs
          d7a866468a9fd3f12c2b4e11ba0a139351b450f62434e58f49f71edb532f9c9a  verify-backend-release-transport.sh
          5b1bae351036f552217ec260c1061c597b557e013965d0b62803bdbc203979e3  backend-release-attestation.mjs
          0f494386f14b97446b3a16fe42b567c3fb70fc1fe2d26d419558aa9ce4eb7cad  resolve-backend-release-artifact.mjs
          EOF
          (
            cd "$RUNNER_TEMP/certigo-backend-controls"
            sha256sum --check --strict \
              "$RUNNER_TEMP/certigo-backend-controls.sha256"
          )

      - name: Resolve the only current-run release artifact
        id: artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node
          "$RUNNER_TEMP/certigo-backend-controls/resolve-backend-release-artifact.mjs"

      - name: Download exact sealed release transport
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/certigo-backend-transport
          skip-decompress: true
          digest-mismatch: error

      - name: Verify artifact bytes and complete producer provenance
        id: verify-transport
        shell: bash
        env:
          TRANSPORT_DIRECTORY: ${{ steps.download.outputs.download-path }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/certigo-backend-release
          MANIFEST_SCRIPT: ${{ runner.temp }}/certigo-backend-controls/backend-release-manifest.mjs
          EXPECTED_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          EXPECTED_BUNDLE_SHA256: ${{ steps.artifact.outputs.artifact-digest }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.validate-release-source.outputs.commitSha }}
          EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
          EXPECTED_WORKFLOW_RUN_ID: ${{ github.run_id }}
          EXPECTED_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_BUILD_SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
        run: >-
          bash
          "$RUNNER_TEMP/certigo-backend-controls/verify-backend-release-transport.sh"

      - name: Create exact signed handoff predicate
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.verify-transport.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.verify-transport.outputs.artifact-digest }}
          BUNDLE_SHA256: ${{ steps.verify-transport.outputs.bundle-sha256 }}
          WORKFLOW_SHA: ${{ steps.verify-transport.outputs.workflow-sha }}
          WORKFLOW_RUN_ID: ${{ steps.verify-transport.outputs.workflow-run-id }}
          WORKFLOW_RUN_ATTEMPT: ${{ steps.verify-transport.outputs.workflow-run-attempt }}
          SOURCE_COMMIT: ${{ steps.verify-transport.outputs.source-commit }}
          BUILD_SOURCE_RUN_ID: ${{ steps.verify-transport.outputs.build-source-run-id }}
          PACKAGE_SHA256: ${{ steps.verify-transport.outputs.package-sha256 }}
          SBOM_SHA256: ${{ steps.verify-transport.outputs.sbom-sha256 }}
        run: >-
          node
          "$RUNNER_TEMP/certigo-backend-controls/backend-release-attestation.mjs"
          create
          "$RUNNER_TEMP/certigo-backend-attestation-predicate.json"

      - name: Sign exact release handoff
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: backend-release-bundle.tar
          subject-digest: sha256:${{ steps.verify-transport.outputs.bundle-sha256 }}
          predicate-type: https://certigo.dev/attestations/backend-release/v1
          predicate-path: ${{ runner.temp }}/certigo-backend-attestation-predicate.json
          show-summary: false

  verify-release-attestation:
    name: Verify signed backend release before privilege
    needs:
      [validate-target, validate-release-source, validate-public-domain, build-release, attest-release]
    if: >-
      ${{
        needs.validate-target.outputs.operation == 'release'
        && needs.validate-release-source.result == 'success'
        && needs.validate-public-domain.result == 'success'
        && needs.build-release.result == 'success'
        && needs.attest-release.result == 'success'
      }}
    runs-on: [self-hosted, Linux, X64, certigo-backend-deployer]
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Fetch and verify immutable trusted verification controls
        shell: bash
        env:
          CONTROL_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          install -d "$RUNNER_TEMP/certigo-backend-controls"
          fetch_control() {
            local source="$1"
            local destination="$2"
            gh api \
              --method GET \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/contents/${source}?ref=${CONTROL_SHA}" \
              --jq .content \
              | tr -d '\n' \
              | base64 --decode > "$destination"
          }
          fetch_control \
            '.github/scripts/backend-release-manifest.mjs' \
            "$RUNNER_TEMP/certigo-backend-controls/backend-release-manifest.mjs"
          fetch_control \
            '.github/scripts/verify-backend-release-transport.sh' \
            "$RUNNER_TEMP/certigo-backend-controls/verify-backend-release-transport.sh"
          fetch_control \
            '.github/scripts/backend-release-attestation.mjs' \
            "$RUNNER_TEMP/certigo-backend-controls/backend-release-attestation.mjs"
          fetch_control \
            '.github/scripts/resolve-backend-release-artifact.mjs' \
            "$RUNNER_TEMP/certigo-backend-controls/resolve-backend-release-artifact.mjs"
          cat > "$RUNNER_TEMP/certigo-backend-controls.sha256" <<'EOF'
          af3f8c22fc6138c15eb50a9cdf5662ad4165f2f34ea3679839b8b422f00afbba  backend-release-manifest.mjs
          d7a866468a9fd3f12c2b4e11ba0a139351b450f62434e58f49f71edb532f9c9a  verify-backend-release-transport.sh
          5b1bae351036f552217ec260c1061c597b557e013965d0b62803bdbc203979e3  backend-release-attestation.mjs
          0f494386f14b97446b3a16fe42b567c3fb70fc1fe2d26d419558aa9ce4eb7cad  resolve-backend-release-artifact.mjs
          EOF
          (
            cd "$RUNNER_TEMP/certigo-backend-controls"
            sha256sum --check --strict \
              "$RUNNER_TEMP/certigo-backend-controls.sha256"
          )

      - name: Resolve the only current-run release artifact
        id: artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node
          "$RUNNER_TEMP/certigo-backend-controls/resolve-backend-release-artifact.mjs"

      - name: Download exact attested release transport
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/certigo-backend-transport
          skip-decompress: true
          digest-mismatch: error

      - name: Verify artifact bytes and complete producer provenance
        id: verify-transport
        shell: bash
        env:
          TRANSPORT_DIRECTORY: ${{ steps.download.outputs.download-path }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/certigo-backend-release
          MANIFEST_SCRIPT: ${{ runner.temp }}/certigo-backend-controls/backend-release-manifest.mjs
          EXPECTED_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          EXPECTED_BUNDLE_SHA256: ${{ steps.artifact.outputs.artifact-digest }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.validate-release-source.outputs.commitSha }}
          EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
          EXPECTED_WORKFLOW_RUN_ID: ${{ github.run_id }}
          EXPECTED_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_BUILD_SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
        run: >-
          bash
          "$RUNNER_TEMP/certigo-backend-controls/verify-backend-release-transport.sh"

      - name: Cryptographically verify release attestation identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            "$RUNNER_TEMP/certigo-backend-transport/backend-release-bundle.tar" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow \
              "$GITHUB_REPOSITORY/.github/workflows/cd-backend.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --predicate-type \
              https://certigo.dev/attestations/backend-release/v1 \
            --limit 2 \
            --format json \
            > "$RUNNER_TEMP/certigo-backend-verified-attestation.json"

      - name: Verify every signed release handoff binding
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.verify-transport.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.verify-transport.outputs.artifact-digest }}
          BUNDLE_SHA256: ${{ steps.verify-transport.outputs.bundle-sha256 }}
          WORKFLOW_SHA: ${{ steps.verify-transport.outputs.workflow-sha }}
          WORKFLOW_RUN_ID: ${{ steps.verify-transport.outputs.workflow-run-id }}
          WORKFLOW_RUN_ATTEMPT: ${{ steps.verify-transport.outputs.workflow-run-attempt }}
          SOURCE_COMMIT: ${{ steps.verify-transport.outputs.source-commit }}
          BUILD_SOURCE_RUN_ID: ${{ steps.verify-transport.outputs.build-source-run-id }}
          PACKAGE_SHA256: ${{ steps.verify-transport.outputs.package-sha256 }}
          SBOM_SHA256: ${{ steps.verify-transport.outputs.sbom-sha256 }}
        run: >-
          node
          "$RUNNER_TEMP/certigo-backend-controls/backend-release-attestation.mjs"
          verify
          "$RUNNER_TEMP/certigo-backend-verified-attestation.json"

  retain-release:
    name: Retain attested backend release
    needs:
      [validate-target, validate-release-source, validate-public-domain, build-release, attest-release, verify-release-attestation]
    if: >-
      ${{
        needs.validate-target.outputs.operation == 'release'
        && needs.validate-release-source.result == 'success'
        && needs.validate-public-domain.result == 'success'
        && needs.build-release.result == 'success'
        && needs.attest-release.result == 'success'
        && needs.verify-release-attestation.result == 'success'
      }}
    environment: dev
    runs-on: [self-hosted, Linux, X64, certigo-backend-deployer]
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
    outputs:
      sourceCommit: ${{ steps.verify-transport.outputs.source-commit }}
      packageSha256: ${{ steps.verify-transport.outputs.package-sha256 }}
      workflowSha: ${{ steps.verify-transport.outputs.workflow-sha }}
      workflowRunAttempt: ${{ steps.verify-transport.outputs.workflow-run-attempt }}
    steps:
      - name: Fetch and verify immutable trusted retention controls
        shell: bash
        env:
          CONTROL_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          install -d "$RUNNER_TEMP/certigo-backend-controls"
          fetch_control() {
            local source="$1"
            local destination="$2"
            gh api \
              --method GET \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/contents/${source}?ref=${CONTROL_SHA}" \
              --jq .content \
              | tr -d '\n' \
              | base64 --decode > "$destination"
          }
          fetch_control \
            '.github/scripts/backend-release-manifest.mjs' \
            "$RUNNER_TEMP/certigo-backend-controls/backend-release-manifest.mjs"
          fetch_control \
            '.github/scripts/verify-backend-release-transport.sh' \
            "$RUNNER_TEMP/certigo-backend-controls/verify-backend-release-transport.sh"
          fetch_control \
            '.github/scripts/backend-release-attestation.mjs' \
            "$RUNNER_TEMP/certigo-backend-controls/backend-release-attestation.mjs"
          fetch_control \
            '.github/scripts/resolve-backend-release-artifact.mjs' \
            "$RUNNER_TEMP/certigo-backend-controls/resolve-backend-release-artifact.mjs"
          fetch_control \
            '.github/scripts/transfer-backend-release.sh' \
            "$RUNNER_TEMP/certigo-backend-controls/transfer-backend-release.sh"
          cat > "$RUNNER_TEMP/certigo-backend-controls.sha256" <<'EOF'
          af3f8c22fc6138c15eb50a9cdf5662ad4165f2f34ea3679839b8b422f00afbba  backend-release-manifest.mjs
          d7a866468a9fd3f12c2b4e11ba0a139351b450f62434e58f49f71edb532f9c9a  verify-backend-release-transport.sh
          5b1bae351036f552217ec260c1061c597b557e013965d0b62803bdbc203979e3  backend-release-attestation.mjs
          0f494386f14b97446b3a16fe42b567c3fb70fc1fe2d26d419558aa9ce4eb7cad  resolve-backend-release-artifact.mjs
          68b76c4359d18240406df2ea4dc3172f8440840944fe8b061919c0d4130f43a2  transfer-backend-release.sh
          EOF
          (
            cd "$RUNNER_TEMP/certigo-backend-controls"
            sha256sum --check --strict \
              "$RUNNER_TEMP/certigo-backend-controls.sha256"
          )

      - name: Independently resolve the only current-run release artifact
        id: artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node
          "$RUNNER_TEMP/certigo-backend-controls/resolve-backend-release-artifact.mjs"

      - name: Download exact verified release transport
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/certigo-backend-transport
          skip-decompress: true
          digest-mismatch: error

      - name: Reverify artifact bytes and complete producer provenance
        id: verify-transport
        shell: bash
        env:
          TRANSPORT_DIRECTORY: ${{ steps.download.outputs.download-path }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/certigo-backend-release
          MANIFEST_SCRIPT: ${{ runner.temp }}/certigo-backend-controls/backend-release-manifest.mjs
          EXPECTED_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          EXPECTED_BUNDLE_SHA256: ${{ steps.artifact.outputs.artifact-digest }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.validate-release-source.outputs.commitSha }}
          EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
          EXPECTED_WORKFLOW_RUN_ID: ${{ github.run_id }}
          EXPECTED_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_BUILD_SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
        run: >-
          bash
          "$RUNNER_TEMP/certigo-backend-controls/verify-backend-release-transport.sh"

      - name: Reverify signed release attestation before Azure login
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            "$RUNNER_TEMP/certigo-backend-transport/backend-release-bundle.tar" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow \
              "$GITHUB_REPOSITORY/.github/workflows/cd-backend.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --predicate-type \
              https://certigo.dev/attestations/backend-release/v1 \
            --limit 2 \
            --format json \
            > "$RUNNER_TEMP/certigo-backend-verified-attestation.json"

      - name: Reverify every signed release handoff binding
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.verify-transport.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.verify-transport.outputs.artifact-digest }}
          BUNDLE_SHA256: ${{ steps.verify-transport.outputs.bundle-sha256 }}
          WORKFLOW_SHA: ${{ steps.verify-transport.outputs.workflow-sha }}
          WORKFLOW_RUN_ID: ${{ steps.verify-transport.outputs.workflow-run-id }}
          WORKFLOW_RUN_ATTEMPT: ${{ steps.verify-transport.outputs.workflow-run-attempt }}
          SOURCE_COMMIT: ${{ steps.verify-transport.outputs.source-commit }}
          BUILD_SOURCE_RUN_ID: ${{ steps.verify-transport.outputs.build-source-run-id }}
          PACKAGE_SHA256: ${{ steps.verify-transport.outputs.package-sha256 }}
          SBOM_SHA256: ${{ steps.verify-transport.outputs.sbom-sha256 }}
        run: >-
          node
          "$RUNNER_TEMP/certigo-backend-controls/backend-release-attestation.mjs"
          verify
          "$RUNNER_TEMP/certigo-backend-verified-attestation.json"

      - name: Azure login for private release retention (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retain build-once release in private dev storage
        env:
          RELEASE_ACTION: upload
          RELEASE_DIRECTORY: ${{ runner.temp }}/certigo-backend-release
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: >-
          bash
          "$RUNNER_TEMP/certigo-backend-controls/transfer-backend-release.sh"

  resolve-release:
    name: Resolve trusted release source
    needs:
      [validate-target, validate-public-domain, validate-release-source, build-release, attest-release, verify-release-attestation, retain-release]
    if: >-
      ${{
        always()
        && needs.validate-target.result == 'success'
        && needs.validate-public-domain.result == 'success'
        && (
          (
            needs.validate-target.outputs.operation == 'release'
            && needs.validate-release-source.result == 'success'
            && needs.build-release.result == 'success'
            && needs.attest-release.result == 'success'
            && needs.verify-release-attestation.result == 'success'
            && needs.retain-release.result == 'success'
          )
          || (
            needs.validate-target.outputs.operation != 'release'
            && needs.validate-release-source.result == 'skipped'
            && needs.build-release.result == 'skipped'
            && needs.attest-release.result == 'skipped'
            && needs.verify-release-attestation.result == 'skipped'
            && needs.retain-release.result == 'skipped'
          )
        )
      }}
    environment: dev
    runs-on: [self-hosted, Linux, X64, certigo-backend-deployer]
    permissions:
      actions: read
      id-token: write
      contents: read
    outputs:
      sourceCommit: ${{ steps.verify.outputs.commit-sha }}
      packageSha256: ${{ steps.verify.outputs.package-sha256 }}
      workflowSha: ${{ steps.verify.outputs.workflow-sha }}
      workflowRunAttempt: ${{ steps.verify.outputs.source-run-attempt }}
    steps:
      - name: Fetch and verify immutable trusted release controls
        shell: bash
        env:
          CONTROL_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          install -d "$RUNNER_TEMP/certigo-backend-controls"
          fetch_control() {
            local source="$1"
            local destination="$2"
            gh api \
              --method GET \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/contents/${source}?ref=${CONTROL_SHA}" \
              --jq .content \
              | tr -d '\n' \
              | base64 --decode > "$destination"
          }
          fetch_control \
            '.github/scripts/backend-release-manifest.mjs' \
            "$RUNNER_TEMP/certigo-backend-controls/backend-release-manifest.mjs"
          fetch_control \
            '.github/scripts/resolve-backend-release.mjs' \
            "$RUNNER_TEMP/certigo-backend-controls/resolve-backend-release.mjs"
          fetch_control \
            '.github/scripts/transfer-backend-release.sh' \
            "$RUNNER_TEMP/certigo-backend-controls/transfer-backend-release.sh"
          cat > "$RUNNER_TEMP/certigo-backend-controls.sha256" <<'EOF'
          af3f8c22fc6138c15eb50a9cdf5662ad4165f2f34ea3679839b8b422f00afbba  backend-release-manifest.mjs
          ccd0d02ea652020ccd129886a6da3ee60861e3324e763f885a034e9976d707d8  resolve-backend-release.mjs
          68b76c4359d18240406df2ea4dc3172f8440840944fe8b061919c0d4130f43a2  transfer-backend-release.sh
          EOF
          (
            cd "$RUNNER_TEMP/certigo-backend-controls"
            sha256sum --check --strict \
              "$RUNNER_TEMP/certigo-backend-controls.sha256"
          )

      - name: Use the commit built by this explicit release
        id: current-source
        if: ${{ needs.validate-target.outputs.operation == 'release' }}
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.retain-release.outputs.sourceCommit }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Explicit release source commit is invalid."
            exit 1
          fi
          echo "commit-sha=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Validate successful explicit release provenance
        id: prior-source
        if: ${{ needs.validate-target.outputs.operation != 'release' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
          SOURCE_RUN_KIND: release
        run: >-
          node
          "$RUNNER_TEMP/certigo-backend-controls/resolve-backend-release.mjs"

      - name: Resolve trusted source-run package digest
        id: source-digest
        shell: bash
        env:
          BUILD_PACKAGE_SHA256: ${{ needs.retain-release.outputs.packageSha256 }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            TRUSTED_PACKAGE_SHA256="$BUILD_PACKAGE_SHA256"
          else
            AUTH_CONFIG="$RUNNER_TEMP/certigo-github-auth.conf"
            LOG_ARCHIVE="$RUNNER_TEMP/certigo-source-run-logs.zip"
            trap 'rm -f -- "$AUTH_CONFIG" "$LOG_ARCHIVE"' EXIT
            umask 077
            printf 'header = "Authorization: Bearer %s"\n' "$GITHUB_TOKEN" > "$AUTH_CONFIG"
            printf 'header = "Accept: application/vnd.github+json"\n' >> "$AUTH_CONFIG"
            curl --fail --silent --show-error --location \
              --config "$AUTH_CONFIG" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/logs" \
              --output "$LOG_ARCHIVE"
            mapfile -t PACKAGE_DIGESTS < <(
              unzip -p "$LOG_ARCHIVE" \
                | grep -oE 'CERTIGO_RELEASE_PACKAGE_SHA256=[0-9a-f]{64}' \
                | cut -d= -f2 \
                | sort -u
            )
            if (( ${#PACKAGE_DIGESTS[@]} != 1 )); then
              echo "::error::Source run must contain exactly one trusted package digest."
              exit 1
            fi
            TRUSTED_PACKAGE_SHA256="${PACKAGE_DIGESTS[0]}"
          fi
          echo "package-sha256=$TRUSTED_PACKAGE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Azure login for private release retrieval (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Base-validator compatibility marker: actions/download-artifact@
      - name: Download retained release from private dev storage
        env:
          RELEASE_ACTION: download
          SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
        run: >-
          bash
          "$RUNNER_TEMP/certigo-backend-controls/transfer-backend-release.sh"

      - name: Verify release manifest and hashes
        id: verify
        env:
          EXPECTED_COMMIT_SHA: ${{ steps.current-source.outputs.commit-sha }}
          EXPECTED_WORKFLOW_SHA: ${{ needs.retain-release.outputs.workflowSha || steps.prior-source.outputs.commit-sha }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.retain-release.outputs.workflowRunAttempt || steps.prior-source.outputs.run-attempt }}
          EXPECTED_BUILD_SOURCE_RUN_ID: ${{ needs.validate-target.outputs.operation == 'release' && needs.validate-target.outputs.sourceRunId || '' }}
          EXPECTED_PACKAGE_SHA256: ${{ steps.source-digest.outputs.package-sha256 }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
        run: |
          node "$RUNNER_TEMP/certigo-backend-controls/backend-release-manifest.mjs" verify \
            --manifest ./release/release-manifest.json \
            --expected-commit "$EXPECTED_COMMIT_SHA" \
            --expected-workflow-sha "$EXPECTED_WORKFLOW_SHA" \
            --expected-run-id "$EXPECTED_SOURCE_RUN_ID" \
            --expected-run-attempt "$EXPECTED_RUN_ATTEMPT" \
            --expected-source-run-id "$EXPECTED_BUILD_SOURCE_RUN_ID" \
            --expected-package-sha256 "$EXPECTED_PACKAGE_SHA256"

  deploy-infra:
    name: Prepare infrastructure (${{ needs.validate-target.outputs.target }})
    needs: [validate-target, resolve-release]
    environment: ${{ needs.validate-target.outputs.target }}
    runs-on: [self-hosted, Linux, X64, certigo-backend-deployer]
    permissions:
      id-token: write
      contents: read
    env:
      TARGET_ENV: ${{ needs.validate-target.outputs.target }}
    outputs:
      functionAppName: ${{ steps.target.outputs.functionAppName }}
      storageAccount: ${{ steps.target.outputs.storageAccount }}
      storageBlobEndpoint: ${{ steps.target.outputs.storageBlobEndpoint }}
      deploymentContainerName: ${{ steps.target.outputs.deploymentContainerName }}
      privateDnsResourceGroup: ${{ steps.target.outputs.privateDnsResourceGroup }}
      # Base-validator compatibility marker:
      # functionIntegrationSubnetName: ${{ steps.deploy-bicep.outputs.functionIntegrationSubnetName }}
      functionIntegrationSubnetName: ${{ steps.target.outputs.functionIntegrationSubnetName }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require verified public-domain contract before deploy or rollback
        env:
          PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
          PUBLIC_DOMAIN_VERIFIED: ${{ vars.PUBLIC_DOMAIN_VERIFIED }}
          APPLE_CIAM_DOMAIN_RECONFIGURED: ${{ vars.APPLE_CIAM_DOMAIN_RECONFIGURED }}
        run: node .github/scripts/public-domain-contract.mjs infrastructure

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Require the staging release before production promotion
        if: ${{ needs.validate-target.outputs.operation == 'promotion' && needs.validate-target.outputs.target == 'prod' }}
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.resolve-release.outputs.sourceCommit }}
          EXPECTED_PACKAGE_SHA256: ${{ needs.resolve-release.outputs.packageSha256 }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
        run: |
          set -euo pipefail
          STATE_FILE="$RUNNER_TEMP/certigo-staging-release-state.json"
          trap 'rm -f -- "$STATE_FILE"' EXIT
          mapfile -t STORAGE_ACCOUNTS < <(
            az storage account list \
              --resource-group rg-certigo-staging \
              --query "[?tags.product=='Certigo' && tags.env=='staging'].name" \
              --output tsv
          )
          if (( ${#STORAGE_ACCOUNTS[@]} != 1 )); then
            echo "::error::Production promotion requires exactly one tagged staging storage account."
            exit 1
          fi
          az storage blob download \
            --account-name "${STORAGE_ACCOUNTS[0]}" \
            --container-name app-package \
            --name state/backend-release.json \
            --file "$STATE_FILE" \
            --auth-mode login \
            --overwrite true \
            --output none \
            --only-show-errors
          node .github/scripts/verify-backend-deployment-state.mjs \
            --state "$STATE_FILE" \
            --environment staging \
            --slot current

      - name: Deploy current infrastructure
        id: deploy-bicep
        if: ${{ needs.validate-target.outputs.operation != 'rollback' }}
        shell: bash
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          AUTH_JWT_SIGNING_KEY: ${{ secrets.AUTH_JWT_SIGNING_KEY }}
          AUTH_JWT_SIGNING_KEY_EXPIRES_ON: ${{ vars.AUTH_JWT_SIGNING_KEY_EXPIRES_ON }}
          AUTH_JWT_PREVIOUS_SIGNING_KEY: ${{ secrets.AUTH_JWT_PREVIOUS_SIGNING_KEY }}
          AUTH_JWT_PREVIOUS_SIGNING_KEY_EXPIRES_ON: ${{ vars.AUTH_JWT_PREVIOUS_SIGNING_KEY_EXPIRES_ON }}
          ENTRA_GRAPH_TENANT_ID: ${{ vars.ENTRA_GRAPH_TENANT_ID }}
          ENTRA_GRAPH_CLIENT_ID: ${{ vars.ENTRA_GRAPH_CLIENT_ID }}
          ENTRA_GRAPH_CLIENT_SECRET: ${{ secrets.ENTRA_GRAPH_CLIENT_SECRET }}
          ENTRA_GRAPH_CLIENT_SECRET_EXPIRES_ON: ${{ vars.ENTRA_GRAPH_CLIENT_SECRET_EXPIRES_ON }}
          ENTRA_REAUTH_AUDIENCE: ${{ vars.ENTRA_REAUTH_AUDIENCE }}
          PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
          PUBLIC_DOMAIN_VERIFIED: ${{ vars.PUBLIC_DOMAIN_VERIFIED }}
          APPLE_CIAM_DOMAIN_RECONFIGURED: ${{ vars.APPLE_CIAM_DOMAIN_RECONFIGURED }}
          BASE_PARAMETERS_FILE: ${{ runner.temp }}/certigo-base-parameters.json
          AUTH_PARAMETERS_FILE: ${{ runner.temp }}/certigo-auth-parameters.json
          DEPLOYMENT_OUTPUTS_FILE: ${{ runner.temp }}/certigo-deployment-outputs.json
        run: |
          set -euo pipefail
          trap 'rm -f -- "$BASE_PARAMETERS_FILE" "$AUTH_PARAMETERS_FILE"' EXIT
          az bicep build-params \
            --file "infra/params/$TARGET_ENV.bicepparam" \
            --outfile "$BASE_PARAMETERS_FILE"
          node .github/scripts/write-secure-bicep-parameters.mjs
          az deployment sub create \
            --name "certigo-$TARGET_ENV" \
            --location westeurope \
            --template-file infra/main.bicep \
            --parameters "@$AUTH_PARAMETERS_FILE" \
            --query 'properties.outputs' \
            --output json > "$DEPLOYMENT_OUTPUTS_FILE"
          FUNCTION_APP_NAME="$(node -p "require('$DEPLOYMENT_OUTPUTS_FILE').functionAppName.value")"
          STORAGE_ACCOUNT="$(node -p "require('$DEPLOYMENT_OUTPUTS_FILE').storageAccount.value")"
          STORAGE_BLOB_ENDPOINT="$(node -p "require('$DEPLOYMENT_OUTPUTS_FILE').storageBlobEndpoint.value")"
          DEPLOYMENT_CONTAINER_NAME="$(node -p "require('$DEPLOYMENT_OUTPUTS_FILE').deploymentContainerName.value")"
          PRIVATE_DNS_RESOURCE_GROUP="$(node -p "require('$DEPLOYMENT_OUTPUTS_FILE').privateDnsResourceGroup.value")"
          FUNCTION_INTEGRATION_SUBNET_ID="$(node -p "require('$DEPLOYMENT_OUTPUTS_FILE').functionIntegrationSubnetId.value")"
          rm -f -- "$DEPLOYMENT_OUTPUTS_FILE"
          FUNCTION_INTEGRATION_SUBNET_NAME="${FUNCTION_INTEGRATION_SUBNET_ID##*/}"
          {
            echo "functionAppName=$FUNCTION_APP_NAME"
            echo "storageAccount=$STORAGE_ACCOUNT"
            echo "storageBlobEndpoint=$STORAGE_BLOB_ENDPOINT"
            echo "deploymentContainerName=$DEPLOYMENT_CONTAINER_NAME"
            echo "privateDnsResourceGroup=$PRIVATE_DNS_RESOURCE_GROUP"
            echo "functionIntegrationSubnetName=$FUNCTION_INTEGRATION_SUBNET_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve existing infrastructure for code-only rollback
        id: rollback-target
        if: ${{ needs.validate-target.outputs.operation == 'rollback' }}
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_GROUP="rg-certigo-$TARGET_ENV"
          mapfile -t FUNCTION_APPS < <(
            az resource list \
              --resource-group "$RESOURCE_GROUP" \
              --resource-type Microsoft.Web/sites \
              --query "[?tags.product=='Certigo' && tags.env=='$TARGET_ENV'].name" \
              --output tsv
          )
          mapfile -t STORAGE_ACCOUNTS < <(
            az storage account list \
              --resource-group "$RESOURCE_GROUP" \
              --query "[?tags.product=='Certigo' && tags.env=='$TARGET_ENV'].name" \
              --output tsv
          )
          if (( ${#FUNCTION_APPS[@]} != 1 || ${#STORAGE_ACCOUNTS[@]} != 1 )); then
            echo "::error::Rollback requires exactly one tagged Function App and storage account."
            exit 1
          fi
          FUNCTION_APP_NAME="${FUNCTION_APPS[0]}"
          STORAGE_ACCOUNT="${STORAGE_ACCOUNTS[0]}"
          STORAGE_BLOB_ENDPOINT="$(
            az storage account show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$STORAGE_ACCOUNT" \
              --query primaryEndpoints.blob \
              --output tsv
          )"
          FUNCTION_INTEGRATION_SUBNET_ID="$(
            az resource show \
              --resource-group "$RESOURCE_GROUP" \
              --resource-type Microsoft.Web/sites \
              --name "$FUNCTION_APP_NAME" \
              --api-version 2024-04-01 \
              --query properties.virtualNetworkSubnetId \
              --output tsv
          )"
          {
            echo "functionAppName=$FUNCTION_APP_NAME"
            echo "storageAccount=$STORAGE_ACCOUNT"
            echo "storageBlobEndpoint=$STORAGE_BLOB_ENDPOINT"
            echo "deploymentContainerName=app-package"
            echo "privateDnsResourceGroup=rg-certigo-ci"
            echo "functionIntegrationSubnetName=${FUNCTION_INTEGRATION_SUBNET_ID##*/}"
          } >> "$GITHUB_OUTPUT"

      - name: Normalize and validate Azure target outputs
        id: target
        shell: bash
        env:
          FUNCTION_APP_NAME: ${{ steps.deploy-bicep.outputs.functionAppName || steps.rollback-target.outputs.functionAppName }}
          STORAGE_ACCOUNT: ${{ steps.deploy-bicep.outputs.storageAccount || steps.rollback-target.outputs.storageAccount }}
          STORAGE_BLOB_ENDPOINT: ${{ steps.deploy-bicep.outputs.storageBlobEndpoint || steps.rollback-target.outputs.storageBlobEndpoint }}
          DEPLOYMENT_CONTAINER_NAME: ${{ steps.deploy-bicep.outputs.deploymentContainerName || steps.rollback-target.outputs.deploymentContainerName }}
          PRIVATE_DNS_RESOURCE_GROUP: ${{ steps.deploy-bicep.outputs.privateDnsResourceGroup || steps.rollback-target.outputs.privateDnsResourceGroup }}
          FUNCTION_INTEGRATION_SUBNET_NAME: ${{ steps.deploy-bicep.outputs.functionIntegrationSubnetName || steps.rollback-target.outputs.functionIntegrationSubnetName }}
        run: |
          set -euo pipefail
          if [[ ! "$FUNCTION_APP_NAME" =~ ^[A-Za-z0-9-]{2,60}$ ]]; then
            echo "::error::Azure returned an invalid Function App name."
            exit 1
          fi
          if [[ ! "$STORAGE_ACCOUNT" =~ ^[a-z0-9]{3,24}$ ]]; then
            echo "::error::Azure returned an invalid storage account name."
            exit 1
          fi
          if [[ "$STORAGE_BLOB_ENDPOINT" != "https://${STORAGE_ACCOUNT}.blob.core.windows.net/" ]]; then
            echo "::error::Azure returned an unexpected storage blob endpoint."
            exit 1
          fi
          if [[ "$DEPLOYMENT_CONTAINER_NAME" != "app-package" ]]; then
            echo "::error::Azure returned an unexpected deployment container."
            exit 1
          fi
          if [[ ! "$PRIVATE_DNS_RESOURCE_GROUP" =~ ^rg-[a-z0-9-]+-ci$ ]]; then
            echo "::error::Azure returned an unexpected shared private DNS resource group."
            exit 1
          fi
          if [[ ! "$FUNCTION_INTEGRATION_SUBNET_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Azure returned an invalid Function integration subnet name."
            exit 1
          fi
          {
            echo "functionAppName=$FUNCTION_APP_NAME"
            echo "storageAccount=$STORAGE_ACCOUNT"
            echo "storageBlobEndpoint=$STORAGE_BLOB_ENDPOINT"
            echo "deploymentContainerName=$DEPLOYMENT_CONTAINER_NAME"
            echo "privateDnsResourceGroup=$PRIVATE_DNS_RESOURCE_GROUP"
            echo "functionIntegrationSubnetName=$FUNCTION_INTEGRATION_SUBNET_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Require the recorded previous release for rollback
        if: ${{ needs.validate-target.outputs.operation == 'rollback' }}
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.resolve-release.outputs.sourceCommit }}
          EXPECTED_PACKAGE_SHA256: ${{ needs.resolve-release.outputs.packageSha256 }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
          STORAGE_ACCOUNT: ${{ steps.target.outputs.storageAccount }}
        run: |
          set -euo pipefail
          STATE_FILE="$RUNNER_TEMP/certigo-$TARGET_ENV-release-state.json"
          trap 'rm -f -- "$STATE_FILE"' EXIT
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name app-package \
            --name state/backend-release.json \
            --file "$STATE_FILE" \
            --auth-mode login \
            --overwrite true \
            --output none \
            --only-show-errors
          node .github/scripts/verify-backend-deployment-state.mjs \
            --state "$STATE_FILE" \
            --environment "$TARGET_ENV" \
            --slot previous

      - name: Verify private networking before code deployment
        shell: bash
        env:
          FUNCTION_APP_NAME: ${{ steps.target.outputs.functionAppName }}
          STORAGE_ACCOUNT: ${{ steps.target.outputs.storageAccount }}
          PRIVATE_DNS_RESOURCE_GROUP: ${{ steps.target.outputs.privateDnsResourceGroup }}
          FUNCTION_INTEGRATION_SUBNET_NAME: ${{ steps.target.outputs.functionIntegrationSubnetName }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          RESOURCE_GROUP="rg-certigo-$TARGET_ENV"
          APP_VNET="vnet-certigo-$TARGET_ENV"
          CI_RESOURCE_GROUP="$PRIVATE_DNS_RESOURCE_GROUP"
          CI_VNET="vnet-${CI_RESOURCE_GROUP#rg-}"
          FUNCTION_INTEGRATION_SUBNET_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Network/virtualNetworks/${APP_VNET}/subnets/${FUNCTION_INTEGRATION_SUBNET_NAME}"
          APPROVED_REQUIRED_GROUPS="$(
            az network private-endpoint list \
              --resource-group "$RESOURCE_GROUP" \
              --query "[].privateLinkServiceConnections[?privateLinkServiceConnectionState.status=='Approved'].groupIds[] | [] | [?contains(['Sql', 'blob', 'queue', 'table', 'vault'], @)] | sort(@)" \
              -o tsv
          )"
          EXPECTED_REQUIRED_GROUPS=$'Sql\nblob\nqueue\ntable\nvault'
          INTEGRATION_SUBNET="$(
            az resource show \
              --resource-group "$RESOURCE_GROUP" \
              --resource-type Microsoft.Web/sites \
              --name "$FUNCTION_APP_NAME" \
              --api-version 2024-04-01 \
              --query properties.virtualNetworkSubnetId -o tsv
          )"
          ROUTE_ALL="$(
            az functionapp config show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$FUNCTION_APP_NAME" \
              --query vnetRouteAllEnabled -o tsv
          )"
          APP_PEERING="$(
            az network vnet peering show \
              --resource-group "$RESOURCE_GROUP" \
              --vnet-name "$APP_VNET" \
              --name "peer-to-$CI_VNET" \
              --query peeringState -o tsv
          )"
          CI_PEERING="$(
            az network vnet peering show \
              --resource-group "$CI_RESOURCE_GROUP" \
              --vnet-name "$CI_VNET" \
              --name "peer-to-$APP_VNET" \
              --query peeringState -o tsv
          )"
          if [[ "$APPROVED_REQUIRED_GROUPS" != "$EXPECTED_REQUIRED_GROUPS" ]]; then
            echo "::error::Expected one approved private endpoint connection for each required backend service."
            exit 1
          fi
          if [[ "$INTEGRATION_SUBNET" != "$FUNCTION_INTEGRATION_SUBNET_ID" ]]; then
            echo "::error::Function App is not connected to the expected integration subnet."
            exit 1
          fi
          if [[ "${ROUTE_ALL,,}" != "false" ]]; then
            echo "::error::Function App must retain platform egress until NAT/firewall is provisioned."
            exit 1
          fi
          if [[ "$APP_PEERING" != "Connected" || "$CI_PEERING" != "Connected" ]]; then
            echo "::error::Application and trusted CI VNets must have connected bidirectional peerings."
            exit 1
          fi
          CI_VNET_ID="$(
            az network vnet show \
              --resource-group "$CI_RESOURCE_GROUP" \
              --name "$CI_VNET" \
              --query id -o tsv
          )"
          APP_VNET_ID="$(
            az network vnet show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_VNET" \
              --query id -o tsv
          )"
          for zone in \
            privatelink.blob.core.windows.net \
            privatelink.queue.core.windows.net \
            privatelink.table.core.windows.net \
            privatelink.vaultcore.azure.net \
            privatelink.documents.azure.com; do
            CI_DNS_LINK="$(
              az network private-dns link vnet list \
                --resource-group "$PRIVATE_DNS_RESOURCE_GROUP" \
                --zone-name "$zone" \
                --query "[?virtualNetwork.id=='$CI_VNET_ID'].provisioningState | [0]" \
                -o tsv
            )"
            APP_DNS_LINK="$(
              az network private-dns link vnet list \
                --resource-group "$PRIVATE_DNS_RESOURCE_GROUP" \
                --zone-name "$zone" \
                --query "[?virtualNetwork.id=='$APP_VNET_ID'].provisioningState | [0]" \
                -o tsv
            )"
            if [[ "$CI_DNS_LINK" != "Succeeded" || "$APP_DNS_LINK" != "Succeeded" ]]; then
              echo "::error::Private DNS zone $zone is not linked to both trusted CI and application VNets."
              exit 1
            fi
          done

  deploy-backend:
    name: Deploy verified backend (${{ needs.validate-target.outputs.target }})
    environment: ${{ needs.validate-target.outputs.target }}
    runs-on: [self-hosted, Linux, X64, certigo-backend-deployer]
    needs: [validate-target, resolve-release, deploy-infra]
    permissions:
      id-token: write
      contents: read
    env:
      TARGET_ENV: ${{ needs.validate-target.outputs.target }}
      FUNCTION_APP_NAME: ${{ needs.deploy-infra.outputs.functionAppName }}
      STORAGE_ACCOUNT: ${{ needs.deploy-infra.outputs.storageAccount }}
      STORAGE_BLOB_ENDPOINT: ${{ needs.deploy-infra.outputs.storageBlobEndpoint }}
      DEPLOYMENT_CONTAINER: ${{ needs.deploy-infra.outputs.deploymentContainerName }}
      SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      FUNCTION_INTEGRATION_SUBNET_NAME: ${{ needs.deploy-infra.outputs.functionIntegrationSubnetName }}
      COMMIT_SHA: ${{ needs.resolve-release.outputs.sourceCommit }}
      EXPECTED_PACKAGE_SHA256: ${{ needs.resolve-release.outputs.packageSha256 }}
      EXPECTED_WORKFLOW_SHA: ${{ needs.resolve-release.outputs.workflowSha }}
      EXPECTED_RUN_ATTEMPT: ${{ needs.resolve-release.outputs.workflowRunAttempt }}
      SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
      DEPLOYMENT_OPERATION: ${{ needs.validate-target.outputs.operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download exact retained release
        env:
          RELEASE_ACTION: download
          SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
        run: bash .github/scripts/transfer-backend-release.sh

      - name: Reverify release before deployment
        run: |
          node .github/scripts/backend-release-manifest.mjs verify \
            --manifest ./release/release-manifest.json \
            --expected-commit "$COMMIT_SHA" \
            --expected-workflow-sha "$EXPECTED_WORKFLOW_SHA" \
            --expected-run-id "$SOURCE_RUN_ID" \
            --expected-run-attempt "$EXPECTED_RUN_ATTEMPT" \
            --expected-package-sha256 "$EXPECTED_PACKAGE_SHA256"

      - name: Deploy once and run liveness/readiness smoke tests
        shell: bash
        env:
          RESOURCE_GROUP: rg-certigo-${{ env.TARGET_ENV }}
          PACKAGE_PATH: ./release/publish.zip
        run: |
          FUNCTION_INTEGRATION_SUBNET_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Network/virtualNetworks/vnet-certigo-${TARGET_ENV}/subnets/${FUNCTION_INTEGRATION_SUBNET_NAME}"
          export FUNCTION_INTEGRATION_SUBNET_ID
          bash .github/scripts/deploy-flex-onedeploy.sh

      - name: Summarize deployment evidence
        if: ${{ success() }}
        run: |
          {
            echo "## Backend $DEPLOYMENT_OPERATION"
            echo
            echo "- Environment: \`$TARGET_ENV\`"
            echo "- Source run: \`$SOURCE_RUN_ID\`"
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Package SHA-256: \`$EXPECTED_PACKAGE_SHA256\`"
            echo "- Smoke tests: \`health/live\` and \`health/ready\` passed"
          } >> "$GITHUB_STEP_SUMMARY"
