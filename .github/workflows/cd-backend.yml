name: cd-backend

# Deploys the Certigo Azure infrastructure (Bicep) then the .NET 8
# Azure Functions API code.
#
# Required OIDC federated-identity secrets (repo/env settings):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
  push:
    branches: [ main ]

env:
  TARGET_ENV: ${{ inputs.environment || 'dev' }}
  MAIN_CRITICAL_RUNNER_LABELS_JSON: ${{ vars.MAIN_CRITICAL_RUNNER_LABELS || '["self-hosted","Linux","X64","law-certigo"]' }}

# Prevent concurrent deployments to the same environment.
concurrency:
  group: cd-backend-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy-infra:
    name: Deploy infrastructure (${{ inputs.environment || 'dev' }})
    environment: ${{ inputs.environment || 'dev' }}
    runs-on: ${{ fromJSON(env.MAIN_CRITICAL_RUNNER_LABELS_JSON) }}
    permissions:
      id-token: write
      contents: read
    outputs:
      functionAppName: ${{ steps.deploy-bicep.outputs.functionAppName }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure and capture outputs
        id: deploy-bicep
        run: |
          FUNCTION_APP_NAME=$(az deployment sub create \
            --name certigo-$TARGET_ENV \
            --location westeurope \
            --template-file infra/main.bicep \
            --parameters infra/params/$TARGET_ENV.bicepparam \
            --query 'properties.outputs.functionAppName.value' -o tsv)
          echo "functionAppName=$FUNCTION_APP_NAME" >> $GITHUB_OUTPUT

  deploy-backend:
    name: Deploy backend code (${{ inputs.environment || 'dev' }})
    environment: ${{ inputs.environment || 'dev' }}
    runs-on: ${{ fromJSON(env.MAIN_CRITICAL_RUNNER_LABELS_JSON) }}
    needs: deploy-infra
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: |
          dotnet publish backend/src/Certigo.Api/Certigo.Api.csproj \
            --configuration Release \
            --output ./publish

      - name: Zip publish artefact
        run: cd ./publish && zip -r ../publish.zip . && cd ..

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Function App (with retry for RBAC propagation)
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i of 5..."
            if az functionapp deployment source config-zip \
              --resource-group rg-certigo-$TARGET_ENV \
              --name ${{ needs.deploy-infra.outputs.functionAppName }} \
              --src ./publish.zip; then
              echo "Deployment succeeded on attempt $i"
              exit 0
            fi
            if [ $i -lt 5 ]; then
              echo "Attempt $i failed (likely RBAC propagation delay), waiting 90s..."
              sleep 90
            fi
          done
          echo "All 5 attempts failed"
          exit 1
