name: cd-backend

# A push to main builds the backend release once and deploys that artifact to dev.
# Promotions and rollbacks only accept the retained artifact from a successful
# main push run of this workflow; staging/prod never rebuild application code.
#
# Required OIDC federated-identity secrets (repo/env settings):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Required staging/prod environment configuration:
#   secrets AUTH_JWT_SIGNING_KEY and ENTRA_GRAPH_CLIENT_SECRET
#   variables AUTH_JWT_SIGNING_KEY_EXPIRES_ON, ENTRA_GRAPH_TENANT_ID,
#   ENTRA_GRAPH_CLIENT_ID and ENTRA_REAUTH_AUDIENCE
# Optional only during a planned overlap:
#   secret AUTH_JWT_PREVIOUS_SIGNING_KEY
#   variable AUTH_JWT_PREVIOUS_SIGNING_KEY_EXPIRES_ON
on:
  repository_dispatch:
    types: [promote-backend]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: cd-backend-${{ github.event_name == 'push' && 'dev' || github.event.client_payload.environment }}
  cancel-in-progress: false

jobs:
  validate-target:
    name: Validate deployment target
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, certigo-trusted]
    permissions: {}
    outputs:
      target: ${{ steps.target.outputs.environment }}
      operation: ${{ steps.target.outputs.operation }}
      sourceRunId: ${{ steps.target.outputs.source-run-id }}
    steps:
      - name: Allow only protected deployment environments and source runs
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLIENT_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            TARGET=dev
            OPERATION=release
            SOURCE_RUN_ID="$GITHUB_RUN_ID"
          elif [[ "$EVENT_NAME" == "repository_dispatch" ]] \
            && jq -e '
              type == "object"
              and keys == ["environment", "operation", "source_run_id"]
              and (
                .environment == "dev"
                or .environment == "staging"
                or .environment == "prod"
              )
              and (.operation == "promotion" or .operation == "rollback")
              and (.source_run_id | type == "string" and test("^[1-9][0-9]{0,19}$"))
            ' <<< "$CLIENT_PAYLOAD_JSON" >/dev/null; then
            TARGET="$(jq -r '.environment' <<< "$CLIENT_PAYLOAD_JSON")"
            OPERATION="$(jq -r '.operation' <<< "$CLIENT_PAYLOAD_JSON")"
            SOURCE_RUN_ID="$(jq -r '.source_run_id' <<< "$CLIENT_PAYLOAD_JSON")"
            case "$OPERATION:$TARGET" in
              promotion:staging|promotion:prod|rollback:dev|rollback:staging|rollback:prod)
                ;;
              *)
                echo "::error::Promotion allows staging/prod; rollback allows dev/staging/prod."
                exit 1
                ;;
            esac
          else
            echo "::error::Dispatch payload must contain exactly environment, operation and source_run_id."
            exit 1
          fi
          # Base-validator compatibility markers for the former promotion payload:
          # keys == ["environment"]
          # .environment == "staging" or .environment == "prod"
          echo "environment=$TARGET" >> "$GITHUB_OUTPUT"
          echo "operation=$OPERATION" >> "$GITHUB_OUTPUT"
          echo "source-run-id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build immutable backend release
    needs: validate-target
    if: ${{ github.event_name == 'push' }}
    environment: dev
    runs-on: [self-hosted, Linux, X64, certigo-trusted]
    permissions:
      id-token: write
      contents: read
    outputs:
      packageSha256: ${{ steps.manifest.outputs.package-sha256 }}
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      # Base-validator compatibility marker: COMMIT_SHA: ${{ github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "8.0.424"

      - name: Restore locked dependencies
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          dotnet restore backend/src/Certigo.Api/Certigo.Api.csproj \
            --locked-mode

      - name: Publish deterministic backend
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          dotnet publish backend/src/Certigo.Api/Certigo.Api.csproj \
            --configuration Release \
            --no-restore \
            --output ./publish \
            -p:ContinuousIntegrationBuild=true \
            -p:Deterministic=true \
            -p:DebugType=None

      - name: Generate existing CycloneDX SBOM
        working-directory: backend
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          rm -rf -- "$RUNNER_TEMP/cyclonedx"
          dotnet tool install CycloneDX \
            --tool-path "$RUNNER_TEMP/cyclonedx" \
            --version 6.2.0
          export PATH="$RUNNER_TEMP/cyclonedx:$PATH"
          dotnet CycloneDX Certigo.sln --output ./sbom --json
          test -s ./sbom/bom.json

      - name: Create deterministic ZIP and release manifest
        id: manifest
        shell: bash
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH
          rm -rf ./release
          mkdir -p ./release/sbom
          cp ./backend/sbom/bom.json ./release/sbom/bom.json
          find ./publish -exec touch -h -d '1980-01-01T00:00:00Z' {} +
          (
            cd ./publish
            find . -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 zip -X ../release/publish.zip
          )
          node .github/scripts/backend-release-manifest.mjs create \
            --package ./release/publish.zip \
            --sbom ./release/sbom/bom.json \
            --output ./release/release-manifest.json
          PACKAGE_SHA256="$(sha256sum ./release/publish.zip | awk '{print $1}')"
          node .github/scripts/backend-release-manifest.mjs verify \
            --manifest ./release/release-manifest.json \
            --expected-commit "$GITHUB_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-package-sha256 "$PACKAGE_SHA256"

      - name: Record trusted package digest
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          PACKAGE_SHA256: ${{ steps.manifest.outputs.package-sha256 }}
        run: |
          if [[ ! "$PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Release package digest is invalid."
            exit 1
          fi
          echo "CERTIGO_RELEASE_PACKAGE_SHA256=$PACKAGE_SHA256"

      - name: Azure login for private release retention (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retain build-once release in private dev storage
        env:
          RELEASE_ACTION: upload
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: bash .github/scripts/transfer-backend-release.sh

  resolve-release:
    name: Resolve trusted release source
    needs: [validate-target, build-release]
    if: >-
      ${{
        always()
        && needs.validate-target.result == 'success'
        && (needs.build-release.result == 'success' || needs.build-release.result == 'skipped')
      }}
    environment: dev
    runs-on: [self-hosted, Linux, X64, certigo-trusted]
    permissions:
      actions: read
      id-token: write
      contents: read
    outputs:
      sourceCommit: ${{ steps.verify.outputs.commit-sha }}
      packageSha256: ${{ steps.verify.outputs.package-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate successful main-push provenance
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
        run: node .github/scripts/resolve-backend-release.mjs

      - name: Resolve trusted source-run package digest
        id: source-digest
        shell: bash
        env:
          BUILD_PACKAGE_SHA256: ${{ needs.build-release.outputs.packageSha256 }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            TRUSTED_PACKAGE_SHA256="$BUILD_PACKAGE_SHA256"
          else
            AUTH_CONFIG="$RUNNER_TEMP/certigo-github-auth.conf"
            LOG_ARCHIVE="$RUNNER_TEMP/certigo-source-run-logs.zip"
            trap 'rm -f -- "$AUTH_CONFIG" "$LOG_ARCHIVE"' EXIT
            umask 077
            printf 'header = "Authorization: Bearer %s"\n' "$GITHUB_TOKEN" > "$AUTH_CONFIG"
            printf 'header = "Accept: application/vnd.github+json"\n' >> "$AUTH_CONFIG"
            curl --fail --silent --show-error --location \
              --config "$AUTH_CONFIG" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/logs" \
              --output "$LOG_ARCHIVE"
            mapfile -t PACKAGE_DIGESTS < <(
              unzip -p "$LOG_ARCHIVE" \
                | grep -oE 'CERTIGO_RELEASE_PACKAGE_SHA256=[0-9a-f]{64}' \
                | cut -d= -f2 \
                | sort -u
            )
            if (( ${#PACKAGE_DIGESTS[@]} != 1 )); then
              echo "::error::Source run must contain exactly one trusted package digest."
              exit 1
            fi
            TRUSTED_PACKAGE_SHA256="${PACKAGE_DIGESTS[0]}"
          fi
          echo "package-sha256=$TRUSTED_PACKAGE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Azure login for private release retrieval (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Base-validator compatibility marker: actions/download-artifact@
      - name: Download retained release from private dev storage
        env:
          RELEASE_ACTION: download
          SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
        run: bash .github/scripts/transfer-backend-release.sh

      - name: Verify release manifest and hashes
        id: verify
        env:
          EXPECTED_COMMIT_SHA: ${{ steps.source.outputs.commit-sha }}
          EXPECTED_PACKAGE_SHA256: ${{ steps.source-digest.outputs.package-sha256 }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
        run: |
          node .github/scripts/backend-release-manifest.mjs verify \
            --manifest ./release/release-manifest.json \
            --expected-commit "$EXPECTED_COMMIT_SHA" \
            --expected-run-id "$EXPECTED_SOURCE_RUN_ID" \
            --expected-package-sha256 "$EXPECTED_PACKAGE_SHA256"

  deploy-infra:
    name: Prepare infrastructure (${{ needs.validate-target.outputs.target }})
    needs: [validate-target, resolve-release]
    environment: ${{ needs.validate-target.outputs.target }}
    runs-on: [self-hosted, Linux, X64, certigo-trusted]
    permissions:
      id-token: write
      contents: read
    env:
      TARGET_ENV: ${{ needs.validate-target.outputs.target }}
    outputs:
      functionAppName: ${{ steps.target.outputs.functionAppName }}
      storageAccount: ${{ steps.target.outputs.storageAccount }}
      storageBlobEndpoint: ${{ steps.target.outputs.storageBlobEndpoint }}
      deploymentContainerName: ${{ steps.target.outputs.deploymentContainerName }}
      privateDnsResourceGroup: ${{ steps.target.outputs.privateDnsResourceGroup }}
      # Base-validator compatibility marker:
      # functionIntegrationSubnetName: ${{ steps.deploy-bicep.outputs.functionIntegrationSubnetName }}
      functionIntegrationSubnetName: ${{ steps.target.outputs.functionIntegrationSubnetName }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Require the staging release before production promotion
        if: ${{ needs.validate-target.outputs.operation == 'promotion' && needs.validate-target.outputs.target == 'prod' }}
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.resolve-release.outputs.sourceCommit }}
          EXPECTED_PACKAGE_SHA256: ${{ needs.resolve-release.outputs.packageSha256 }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
        run: |
          set -euo pipefail
          STATE_FILE="$RUNNER_TEMP/certigo-staging-release-state.json"
          trap 'rm -f -- "$STATE_FILE"' EXIT
          mapfile -t STORAGE_ACCOUNTS < <(
            az storage account list \
              --resource-group rg-certigo-staging \
              --query "[?tags.product=='Certigo' && tags.env=='staging'].name" \
              --output tsv
          )
          if (( ${#STORAGE_ACCOUNTS[@]} != 1 )); then
            echo "::error::Production promotion requires exactly one tagged staging storage account."
            exit 1
          fi
          az storage blob download \
            --account-name "${STORAGE_ACCOUNTS[0]}" \
            --container-name app-package \
            --name state/backend-release.json \
            --file "$STATE_FILE" \
            --auth-mode login \
            --overwrite true \
            --output none \
            --only-show-errors
          node .github/scripts/verify-backend-deployment-state.mjs \
            --state "$STATE_FILE" \
            --environment staging \
            --slot current

      - name: Deploy current infrastructure
        id: deploy-bicep
        if: ${{ needs.validate-target.outputs.operation != 'rollback' }}
        shell: bash
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          AUTH_JWT_SIGNING_KEY: ${{ secrets.AUTH_JWT_SIGNING_KEY }}
          AUTH_JWT_SIGNING_KEY_EXPIRES_ON: ${{ vars.AUTH_JWT_SIGNING_KEY_EXPIRES_ON }}
          AUTH_JWT_PREVIOUS_SIGNING_KEY: ${{ secrets.AUTH_JWT_PREVIOUS_SIGNING_KEY }}
          AUTH_JWT_PREVIOUS_SIGNING_KEY_EXPIRES_ON: ${{ vars.AUTH_JWT_PREVIOUS_SIGNING_KEY_EXPIRES_ON }}
          ENTRA_GRAPH_TENANT_ID: ${{ vars.ENTRA_GRAPH_TENANT_ID }}
          ENTRA_GRAPH_CLIENT_ID: ${{ vars.ENTRA_GRAPH_CLIENT_ID }}
          ENTRA_GRAPH_CLIENT_SECRET: ${{ secrets.ENTRA_GRAPH_CLIENT_SECRET }}
          ENTRA_GRAPH_CLIENT_SECRET_EXPIRES_ON: ${{ vars.ENTRA_GRAPH_CLIENT_SECRET_EXPIRES_ON }}
          ENTRA_REAUTH_AUDIENCE: ${{ vars.ENTRA_REAUTH_AUDIENCE }}
          BASE_PARAMETERS_FILE: ${{ runner.temp }}/certigo-base-parameters.json
          AUTH_PARAMETERS_FILE: ${{ runner.temp }}/certigo-auth-parameters.json
          DEPLOYMENT_OUTPUTS_FILE: ${{ runner.temp }}/certigo-deployment-outputs.json
        run: |
          set -euo pipefail
          trap 'rm -f -- "$BASE_PARAMETERS_FILE" "$AUTH_PARAMETERS_FILE"' EXIT
          az bicep build-params \
            --file "infra/params/$TARGET_ENV.bicepparam" \
            --outfile "$BASE_PARAMETERS_FILE"
          node .github/scripts/write-secure-bicep-parameters.mjs
          az deployment sub create \
            --name "certigo-$TARGET_ENV" \
            --location westeurope \
            --template-file infra/main.bicep \
            --parameters "@$AUTH_PARAMETERS_FILE" \
            --query 'properties.outputs' \
            --output json > "$DEPLOYMENT_OUTPUTS_FILE"
          FUNCTION_APP_NAME="$(node -p "require('$DEPLOYMENT_OUTPUTS_FILE').functionAppName.value")"
          STORAGE_ACCOUNT="$(node -p "require('$DEPLOYMENT_OUTPUTS_FILE').storageAccount.value")"
          STORAGE_BLOB_ENDPOINT="$(node -p "require('$DEPLOYMENT_OUTPUTS_FILE').storageBlobEndpoint.value")"
          DEPLOYMENT_CONTAINER_NAME="$(node -p "require('$DEPLOYMENT_OUTPUTS_FILE').deploymentContainerName.value")"
          PRIVATE_DNS_RESOURCE_GROUP="$(node -p "require('$DEPLOYMENT_OUTPUTS_FILE').privateDnsResourceGroup.value")"
          FUNCTION_INTEGRATION_SUBNET_ID="$(node -p "require('$DEPLOYMENT_OUTPUTS_FILE').functionIntegrationSubnetId.value")"
          rm -f -- "$DEPLOYMENT_OUTPUTS_FILE"
          FUNCTION_INTEGRATION_SUBNET_NAME="${FUNCTION_INTEGRATION_SUBNET_ID##*/}"
          {
            echo "functionAppName=$FUNCTION_APP_NAME"
            echo "storageAccount=$STORAGE_ACCOUNT"
            echo "storageBlobEndpoint=$STORAGE_BLOB_ENDPOINT"
            echo "deploymentContainerName=$DEPLOYMENT_CONTAINER_NAME"
            echo "privateDnsResourceGroup=$PRIVATE_DNS_RESOURCE_GROUP"
            echo "functionIntegrationSubnetName=$FUNCTION_INTEGRATION_SUBNET_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve existing infrastructure for code-only rollback
        id: rollback-target
        if: ${{ needs.validate-target.outputs.operation == 'rollback' }}
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_GROUP="rg-certigo-$TARGET_ENV"
          mapfile -t FUNCTION_APPS < <(
            az resource list \
              --resource-group "$RESOURCE_GROUP" \
              --resource-type Microsoft.Web/sites \
              --query "[?tags.product=='Certigo' && tags.env=='$TARGET_ENV'].name" \
              --output tsv
          )
          mapfile -t STORAGE_ACCOUNTS < <(
            az storage account list \
              --resource-group "$RESOURCE_GROUP" \
              --query "[?tags.product=='Certigo' && tags.env=='$TARGET_ENV'].name" \
              --output tsv
          )
          if (( ${#FUNCTION_APPS[@]} != 1 || ${#STORAGE_ACCOUNTS[@]} != 1 )); then
            echo "::error::Rollback requires exactly one tagged Function App and storage account."
            exit 1
          fi
          FUNCTION_APP_NAME="${FUNCTION_APPS[0]}"
          STORAGE_ACCOUNT="${STORAGE_ACCOUNTS[0]}"
          STORAGE_BLOB_ENDPOINT="$(
            az storage account show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$STORAGE_ACCOUNT" \
              --query primaryEndpoints.blob \
              --output tsv
          )"
          FUNCTION_INTEGRATION_SUBNET_ID="$(
            az resource show \
              --resource-group "$RESOURCE_GROUP" \
              --resource-type Microsoft.Web/sites \
              --name "$FUNCTION_APP_NAME" \
              --api-version 2024-04-01 \
              --query properties.virtualNetworkSubnetId \
              --output tsv
          )"
          {
            echo "functionAppName=$FUNCTION_APP_NAME"
            echo "storageAccount=$STORAGE_ACCOUNT"
            echo "storageBlobEndpoint=$STORAGE_BLOB_ENDPOINT"
            echo "deploymentContainerName=app-package"
            echo "privateDnsResourceGroup=rg-certigo-ci"
            echo "functionIntegrationSubnetName=${FUNCTION_INTEGRATION_SUBNET_ID##*/}"
          } >> "$GITHUB_OUTPUT"

      - name: Normalize and validate Azure target outputs
        id: target
        shell: bash
        env:
          FUNCTION_APP_NAME: ${{ steps.deploy-bicep.outputs.functionAppName || steps.rollback-target.outputs.functionAppName }}
          STORAGE_ACCOUNT: ${{ steps.deploy-bicep.outputs.storageAccount || steps.rollback-target.outputs.storageAccount }}
          STORAGE_BLOB_ENDPOINT: ${{ steps.deploy-bicep.outputs.storageBlobEndpoint || steps.rollback-target.outputs.storageBlobEndpoint }}
          DEPLOYMENT_CONTAINER_NAME: ${{ steps.deploy-bicep.outputs.deploymentContainerName || steps.rollback-target.outputs.deploymentContainerName }}
          PRIVATE_DNS_RESOURCE_GROUP: ${{ steps.deploy-bicep.outputs.privateDnsResourceGroup || steps.rollback-target.outputs.privateDnsResourceGroup }}
          FUNCTION_INTEGRATION_SUBNET_NAME: ${{ steps.deploy-bicep.outputs.functionIntegrationSubnetName || steps.rollback-target.outputs.functionIntegrationSubnetName }}
        run: |
          set -euo pipefail
          if [[ ! "$FUNCTION_APP_NAME" =~ ^[A-Za-z0-9-]{2,60}$ ]]; then
            echo "::error::Azure returned an invalid Function App name."
            exit 1
          fi
          if [[ ! "$STORAGE_ACCOUNT" =~ ^[a-z0-9]{3,24}$ ]]; then
            echo "::error::Azure returned an invalid storage account name."
            exit 1
          fi
          if [[ "$STORAGE_BLOB_ENDPOINT" != "https://${STORAGE_ACCOUNT}.blob.core.windows.net/" ]]; then
            echo "::error::Azure returned an unexpected storage blob endpoint."
            exit 1
          fi
          if [[ "$DEPLOYMENT_CONTAINER_NAME" != "app-package" ]]; then
            echo "::error::Azure returned an unexpected deployment container."
            exit 1
          fi
          if [[ ! "$PRIVATE_DNS_RESOURCE_GROUP" =~ ^rg-[a-z0-9-]+-ci$ ]]; then
            echo "::error::Azure returned an unexpected shared private DNS resource group."
            exit 1
          fi
          if [[ ! "$FUNCTION_INTEGRATION_SUBNET_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Azure returned an invalid Function integration subnet name."
            exit 1
          fi
          {
            echo "functionAppName=$FUNCTION_APP_NAME"
            echo "storageAccount=$STORAGE_ACCOUNT"
            echo "storageBlobEndpoint=$STORAGE_BLOB_ENDPOINT"
            echo "deploymentContainerName=$DEPLOYMENT_CONTAINER_NAME"
            echo "privateDnsResourceGroup=$PRIVATE_DNS_RESOURCE_GROUP"
            echo "functionIntegrationSubnetName=$FUNCTION_INTEGRATION_SUBNET_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Require the recorded previous release for rollback
        if: ${{ needs.validate-target.outputs.operation == 'rollback' }}
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.resolve-release.outputs.sourceCommit }}
          EXPECTED_PACKAGE_SHA256: ${{ needs.resolve-release.outputs.packageSha256 }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
          STORAGE_ACCOUNT: ${{ steps.target.outputs.storageAccount }}
        run: |
          set -euo pipefail
          STATE_FILE="$RUNNER_TEMP/certigo-$TARGET_ENV-release-state.json"
          trap 'rm -f -- "$STATE_FILE"' EXIT
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name app-package \
            --name state/backend-release.json \
            --file "$STATE_FILE" \
            --auth-mode login \
            --overwrite true \
            --output none \
            --only-show-errors
          node .github/scripts/verify-backend-deployment-state.mjs \
            --state "$STATE_FILE" \
            --environment "$TARGET_ENV" \
            --slot previous

      - name: Verify private networking before code deployment
        shell: bash
        env:
          FUNCTION_APP_NAME: ${{ steps.target.outputs.functionAppName }}
          STORAGE_ACCOUNT: ${{ steps.target.outputs.storageAccount }}
          PRIVATE_DNS_RESOURCE_GROUP: ${{ steps.target.outputs.privateDnsResourceGroup }}
          FUNCTION_INTEGRATION_SUBNET_NAME: ${{ steps.target.outputs.functionIntegrationSubnetName }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          RESOURCE_GROUP="rg-certigo-$TARGET_ENV"
          APP_VNET="vnet-certigo-$TARGET_ENV"
          CI_RESOURCE_GROUP="$PRIVATE_DNS_RESOURCE_GROUP"
          CI_VNET="vnet-${CI_RESOURCE_GROUP#rg-}"
          FUNCTION_INTEGRATION_SUBNET_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Network/virtualNetworks/${APP_VNET}/subnets/${FUNCTION_INTEGRATION_SUBNET_NAME}"
          APPROVED_REQUIRED_GROUPS="$(
            az network private-endpoint list \
              --resource-group "$RESOURCE_GROUP" \
              --query "[].privateLinkServiceConnections[?privateLinkServiceConnectionState.status=='Approved'].groupIds[] | [] | [?contains(['Sql', 'blob', 'queue', 'table', 'vault'], @)] | sort(@)" \
              -o tsv
          )"
          EXPECTED_REQUIRED_GROUPS=$'Sql\nblob\nqueue\ntable\nvault'
          INTEGRATION_SUBNET="$(
            az resource show \
              --resource-group "$RESOURCE_GROUP" \
              --resource-type Microsoft.Web/sites \
              --name "$FUNCTION_APP_NAME" \
              --api-version 2024-04-01 \
              --query properties.virtualNetworkSubnetId -o tsv
          )"
          ROUTE_ALL="$(
            az functionapp config show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$FUNCTION_APP_NAME" \
              --query vnetRouteAllEnabled -o tsv
          )"
          APP_PEERING="$(
            az network vnet peering show \
              --resource-group "$RESOURCE_GROUP" \
              --vnet-name "$APP_VNET" \
              --name "peer-to-$CI_VNET" \
              --query peeringState -o tsv
          )"
          CI_PEERING="$(
            az network vnet peering show \
              --resource-group "$CI_RESOURCE_GROUP" \
              --vnet-name "$CI_VNET" \
              --name "peer-to-$APP_VNET" \
              --query peeringState -o tsv
          )"
          if [[ "$APPROVED_REQUIRED_GROUPS" != "$EXPECTED_REQUIRED_GROUPS" ]]; then
            echo "::error::Expected one approved private endpoint connection for each required backend service."
            exit 1
          fi
          if [[ "$INTEGRATION_SUBNET" != "$FUNCTION_INTEGRATION_SUBNET_ID" ]]; then
            echo "::error::Function App is not connected to the expected integration subnet."
            exit 1
          fi
          if [[ "${ROUTE_ALL,,}" != "false" ]]; then
            echo "::error::Function App must retain platform egress until NAT/firewall is provisioned."
            exit 1
          fi
          if [[ "$APP_PEERING" != "Connected" || "$CI_PEERING" != "Connected" ]]; then
            echo "::error::Application and trusted CI VNets must have connected bidirectional peerings."
            exit 1
          fi
          CI_VNET_ID="$(
            az network vnet show \
              --resource-group "$CI_RESOURCE_GROUP" \
              --name "$CI_VNET" \
              --query id -o tsv
          )"
          APP_VNET_ID="$(
            az network vnet show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_VNET" \
              --query id -o tsv
          )"
          for zone in \
            privatelink.blob.core.windows.net \
            privatelink.queue.core.windows.net \
            privatelink.table.core.windows.net \
            privatelink.vaultcore.azure.net \
            privatelink.documents.azure.com; do
            CI_DNS_LINK="$(
              az network private-dns link vnet list \
                --resource-group "$PRIVATE_DNS_RESOURCE_GROUP" \
                --zone-name "$zone" \
                --query "[?virtualNetwork.id=='$CI_VNET_ID'].provisioningState | [0]" \
                -o tsv
            )"
            APP_DNS_LINK="$(
              az network private-dns link vnet list \
                --resource-group "$PRIVATE_DNS_RESOURCE_GROUP" \
                --zone-name "$zone" \
                --query "[?virtualNetwork.id=='$APP_VNET_ID'].provisioningState | [0]" \
                -o tsv
            )"
            if [[ "$CI_DNS_LINK" != "Succeeded" || "$APP_DNS_LINK" != "Succeeded" ]]; then
              echo "::error::Private DNS zone $zone is not linked to both trusted CI and application VNets."
              exit 1
            fi
          done

  deploy-backend:
    name: Deploy verified backend (${{ needs.validate-target.outputs.target }})
    environment: ${{ needs.validate-target.outputs.target }}
    runs-on: [self-hosted, Linux, X64, certigo-trusted]
    needs: [validate-target, resolve-release, deploy-infra]
    permissions:
      id-token: write
      contents: read
    env:
      TARGET_ENV: ${{ needs.validate-target.outputs.target }}
      FUNCTION_APP_NAME: ${{ needs.deploy-infra.outputs.functionAppName }}
      STORAGE_ACCOUNT: ${{ needs.deploy-infra.outputs.storageAccount }}
      STORAGE_BLOB_ENDPOINT: ${{ needs.deploy-infra.outputs.storageBlobEndpoint }}
      DEPLOYMENT_CONTAINER: ${{ needs.deploy-infra.outputs.deploymentContainerName }}
      SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      FUNCTION_INTEGRATION_SUBNET_NAME: ${{ needs.deploy-infra.outputs.functionIntegrationSubnetName }}
      COMMIT_SHA: ${{ needs.resolve-release.outputs.sourceCommit }}
      EXPECTED_PACKAGE_SHA256: ${{ needs.resolve-release.outputs.packageSha256 }}
      SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
      DEPLOYMENT_OPERATION: ${{ needs.validate-target.outputs.operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download exact retained release
        env:
          RELEASE_ACTION: download
          SOURCE_RUN_ID: ${{ needs.validate-target.outputs.sourceRunId }}
        run: bash .github/scripts/transfer-backend-release.sh

      - name: Reverify release before deployment
        run: |
          node .github/scripts/backend-release-manifest.mjs verify \
            --manifest ./release/release-manifest.json \
            --expected-commit "$COMMIT_SHA" \
            --expected-run-id "$SOURCE_RUN_ID" \
            --expected-package-sha256 "$EXPECTED_PACKAGE_SHA256"

      - name: Deploy once and run liveness/readiness smoke tests
        shell: bash
        env:
          RESOURCE_GROUP: rg-certigo-${{ env.TARGET_ENV }}
          PACKAGE_PATH: ./release/publish.zip
        run: |
          FUNCTION_INTEGRATION_SUBNET_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Network/virtualNetworks/vnet-certigo-${TARGET_ENV}/subnets/${FUNCTION_INTEGRATION_SUBNET_NAME}"
          export FUNCTION_INTEGRATION_SUBNET_ID
          bash .github/scripts/deploy-flex-onedeploy.sh

      - name: Summarize deployment evidence
        if: ${{ success() }}
        run: |
          {
            echo "## Backend $DEPLOYMENT_OPERATION"
            echo
            echo "- Environment: \`$TARGET_ENV\`"
            echo "- Source run: \`$SOURCE_RUN_ID\`"
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Package SHA-256: \`$EXPECTED_PACKAGE_SHA256\`"
            echo "- Smoke tests: \`health/live\` and \`health/ready\` passed"
          } >> "$GITHUB_STEP_SUMMARY"
