name: Runner daily health

on:
  schedule:
    - cron: "17 5 * * *"
  repository_dispatch:
    types: [runner-health]

permissions:
  actions: read
  contents: read

concurrency:
  group: runner-daily-health
  cancel-in-progress: false

jobs:
  probe:
    name: Egress, disk and SDK probe
    # Scheduled workflows are loaded from the default branch.
    if: ${{ github.ref == 'refs/heads/main' }}
    timeout-minutes: 45
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    # EMU policy keeps this on the redundant self-hosted pool. There is no PR
    # trigger, so untrusted fork code cannot reach a persistent runner.
    runs-on: [self-hosted, Linux, X64, certigo-trusted]
    steps:
      - name: Reject unexpected payload fields
        if: ${{ github.event_name == 'repository_dispatch' }}
        shell: bash
        env:
          CLIENT_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          if ! jq -e 'type == "null" or (type == "object" and length == 0)' <<< "$CLIENT_PAYLOAD_JSON" >/dev/null; then
            echo "::error::runner-health does not accept client_payload fields."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Assert this runner is in the versioned inventory
        shell: bash
        env:
          CURRENT_RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          node .github/scripts/assert-runner-inventoried.mjs \
            "$CURRENT_RUNNER_NAME" \
            infra/ci-runner/capacity-controller.config.json

      - name: Measure current workflow queue wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_TIMESTAMPS="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              | jq -er '[.created_at, .run_started_at] | @tsv'
          )"
          IFS=$'\t' read -r CREATED_AT RUN_STARTED_AT <<< "$RUN_TIMESTAMPS"
          CREATED_EPOCH="$(date --date="$CREATED_AT" +%s)"
          STARTED_EPOCH="$(date --date="$RUN_STARTED_AT" +%s)"
          if (( CREATED_EPOCH > STARTED_EPOCH )); then
            echo "::error::Workflow start time precedes its creation time."
            exit 1
          fi
          echo "RUN_QUEUE_WAIT_SECONDS=$((STARTED_EPOCH - CREATED_EPOCH))" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: "3.6.0"

      - name: Install digest-verified Flutter without shared caches
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_INSTALL_DIR="$RUNNER_TEMP/certigo-flutter-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          PUB_CACHE="$RUNNER_TEMP/certigo-pub-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$PUB_CACHE"
          mkdir -p -- "$PUB_CACHE"
          echo "FLUTTER_INSTALL_DIR=$FLUTTER_INSTALL_DIR" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$PUB_CACHE" >> "$GITHUB_ENV"
          bash .github/scripts/install-verified-flutter.sh \
            "3.44.4" \
            "$FLUTTER_INSTALL_DIR"

      - name: Install verified Bicep CLI
        shell: bash
        run: |
          set -euo pipefail
          BICEP_DIR="$RUNNER_TEMP/bicep"
          BICEP_FILE="$BICEP_DIR/bicep"
          mkdir -p "$BICEP_DIR"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$BICEP_FILE" \
            https://github.com/Azure/bicep/releases/download/v0.44.1/bicep-linux-x64
          echo "e17dc9a9888184886bb0c0051a3230b83b19f342749999f707bc571c3dfd2f45  $BICEP_FILE" \
            | sha256sum --check --strict
          chmod +x "$BICEP_FILE"
          echo "$BICEP_DIR" >> "$GITHUB_PATH"

      - name: Probe GitHub, package registries, Azure, disk and tools
        shell: bash
        env:
          MIN_FREE_GB: "10"
          CACHE_PATHS: ${{ runner.tool_cache }}:${{ env.PUB_CACHE }}:${{ env.DOTNET_INSTALL_DIR }}
        run: bash infra/ci-runner/health-probe.sh

      - name: Remove isolated Flutter state
        if: ${{ always() }}
        shell: bash
        run: |
          [ -z "${FLUTTER_INSTALL_DIR:-}" ] || rm -rf -- "$FLUTTER_INSTALL_DIR"
          [ -z "${PUB_CACHE:-}" ] || rm -rf -- "$PUB_CACHE"
