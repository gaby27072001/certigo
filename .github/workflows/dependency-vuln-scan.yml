name: dependency-vuln-scan

# Reusable OSV scanner called by security-gate.yml only for trusted source refs.
on:
  workflow_call:

permissions: {}

jobs:
  osv-scan:
    name: OSV-Scanner (all dependencies, SARIF)
    runs-on: [self-hosted, Linux, X64, certigo-ci]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download OSV-Scanner (v2.4.0, verified SHA256)
        run: |
          set -euo pipefail
          OSV_VERSION="v2.4.0"
          OSV_SHA256="15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0"
          curl --fail --silent --show-error --location --retry 3 \
            --output osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner

      - name: Run and enforce OSV-Scanner
        run: |
          set -uo pipefail
          set +e
          ./osv-scanner scan --format=sarif --recursive ./ > osv-results.sarif 2> osv-scan.log
          scan_status=$?
          set -e

          echo "::group::OSV-Scanner diagnostics"
          cat osv-scan.log
          echo "::endgroup::"
          echo "::group::OSV SARIF"
          cat osv-results.sarif
          echo "::endgroup::"

          if ! finding_count="$(node <<'NODE'
          const fs = require('node:fs');
          const file = 'osv-results.sarif';
          if (!fs.existsSync(file) || fs.statSync(file).size === 0) {
            throw new Error('OSV-Scanner did not produce SARIF output.');
          fi
          const sarif = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (sarif.version !== '2.1.0' || !Array.isArray(sarif.runs) || sarif.runs.length === 0) {
            throw new Error('OSV-Scanner produced malformed SARIF.');
          }
          let count = 0;
          for (const run of sarif.runs) {
            if (
              !run
              || typeof run !== 'object'
              || !run.tool?.driver?.name
              || !Array.isArray(run.results)
            ) {
              throw new Error('OSV-Scanner produced a malformed SARIF run.');
            }
            count += run.results.length;
          }
          process.stdout.write(String(count));
          NODE
          )"; then
            {
              echo "## OSV dependency scan"
              echo
              echo "- Result: **invalid output**"
              echo "- Scanner exit code: \`$scan_status\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::OSV-Scanner output is missing or malformed."
            exit 1
          fi

          {
            echo "## OSV dependency scan"
            echo
            echo "- Findings: **$finding_count**"
            echo "- Scanner exit code: \`$scan_status\`"
            echo "- Full diagnostics and SARIF are available in this job's immutable logs."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$scan_status" -ne 0 ] || [ "$finding_count" -ne 0 ]; then
            echo "::error::OSV-Scanner found a vulnerability or could not complete."
            exit 1
          fi
