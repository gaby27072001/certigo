name: dependency-vuln-scan

# Reusable scanners called by security-gate.yml only when dependency files change.
# Pull requests, including forks, run on an ephemeral GitHub-hosted runner.
on:
  workflow_call:
    inputs:
      scanner:
        description: Dependency scanner to execute (osv or nuget).
        required: true
        type: string

permissions: {}

jobs:
  validate-input:
    name: Validate scanner selection
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || (vars.MAIN_CRITICAL_RUNNER_LABELS && fromJSON(vars.MAIN_CRITICAL_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]')) }}
    permissions: {}
    steps:
      - name: Validate scanner
        shell: bash
        env:
          SCANNER: ${{ inputs.scanner }}
        run: |
          set -euo pipefail
          case "$SCANNER" in
            osv|nuget) ;;
            *)
              echo "::error::Unsupported dependency scanner."
              exit 1
              ;;
          esac

  osv-scan:
    name: OSV-Scanner (all dependencies, SARIF)
    needs: validate-input
    if: ${{ inputs.scanner == 'osv' }}
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || (vars.MAIN_CRITICAL_RUNNER_LABELS && fromJSON(vars.MAIN_CRITICAL_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]')) }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download OSV-Scanner (v2.4.0, verified SHA256)
        run: |
          set -euo pipefail
          OSV_VERSION="v2.4.0"
          OSV_SHA256="15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0"
          curl --fail --silent --show-error --location --retry 3 \
            --output osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner

      - name: Run OSV-Scanner
        id: osv-scan
        continue-on-error: true
        run: |
          ./osv-scanner scan --format=sarif --recursive ./ > osv-results.sarif 2> osv-scan.log

      - name: Ensure valid SARIF
        if: ${{ always() }}
        run: |
          if [ ! -s osv-results.sarif ]; then
            printf '%s' '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"osv-scanner","informationUri":"https://github.com/google/osv-scanner","rules":[]}},"results":[]}]}' > osv-results.sarif
          fi

      - name: Upload SARIF to code scanning
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

      - name: Enforce OSV result
        if: ${{ always() && steps.osv-scan.outcome == 'failure' }}
        run: |
          cat osv-scan.log >&2
          echo "::error::OSV-Scanner found a vulnerability or could not complete."
          exit 1

  dotnet-vuln:
    name: Vulnerable .NET packages (NuGet/GitHub Advisory)
    needs: validate-input
    if: ${{ inputs.scanner == 'nuget' }}
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || (vars.MAIN_CRITICAL_RUNNER_LABELS && fromJSON(vars.MAIN_CRITICAL_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]')) }}
    permissions:
      contents: read
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore backend/Certigo.sln

      - name: Check vulnerable packages
        run: |
          set -euo pipefail
          dotnet list backend/Certigo.sln package --vulnerable --include-transitive | tee dotnet-vulnerable.log
          if grep -qi "has the following vulnerable" dotnet-vulnerable.log; then
            echo "::error::Vulnerable NuGet packages detected."
            exit 1
          fi
