name: dependency-vuln-scan

# Reusable OSV scanner called by security-gate.yml only for trusted source refs.
on:
  workflow_call:

permissions: {}

jobs:
  osv-scan:
    name: OSV-Scanner (all dependencies, SARIF)
    runs-on: [self-hosted, Linux, X64, certigo-ci]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download OSV-Scanner (v2.4.0, verified SHA256)
        run: |
          set -euo pipefail
          OSV_VERSION="v2.4.0"
          OSV_SHA256="15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0"
          curl --fail --silent --show-error --location --retry 3 \
            --output osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner

      - name: Run OSV-Scanner
        id: osv-scan
        continue-on-error: true
        run: |
          ./osv-scanner scan --format=sarif --recursive ./ > osv-results.sarif 2> osv-scan.log

      - name: Ensure valid SARIF
        if: ${{ always() }}
        run: |
          if [ ! -s osv-results.sarif ]; then
            printf '%s' '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"osv-scanner","informationUri":"https://github.com/google/osv-scanner","rules":[]}},"results":[]}]}' > osv-results.sarif
          fi

      - name: Preserve OSV findings
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-findings
          path: |
            osv-results.sarif
            osv-scan.log
          if-no-files-found: error
          retention-days: 30

      - name: Enforce OSV result
        if: ${{ always() && steps.osv-scan.outcome == 'failure' }}
        run: |
          cat osv-scan.log >&2
          echo "::error::OSV-Scanner found a vulnerability or could not complete."
          exit 1
