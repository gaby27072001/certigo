name: dependency-vuln-scan

# Reusable OSV scanner called by security-gate.yml only for trusted source refs.
on:
  workflow_call:

permissions: {}

jobs:
  osv-scan:
    name: OSV-Scanner (all dependencies, JSON)
    environment: ${{ github.event_name == 'pull_request_target' && 'pr-ci' || '' }}
    runs-on: [self-hosted, Linux, X64, certigo-ci]
    permissions:
      contents: read
    env:
      UNTRUSTED_SOURCE_DIR: ${{ github.workspace }}/.untrusted-source
      TRUSTED_CONTROL_DIR: ${{ github.workspace }}/.trusted-control
      OSV_BINARY: ${{ github.workspace }}/.scanner-state/osv-scanner
      OSV_RESULTS_FILE: ${{ github.workspace }}/.scanner-state/osv-results.json
      OSV_SCAN_LOG: ${{ github.workspace }}/.scanner-state/osv-scan.log
      OSV_ENFORCE_LOG: ${{ github.workspace }}/.scanner-state/osv-enforce.log
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          path: .untrusted-source
          persist-credentials: false

      - name: Checkout immutable trusted controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: .trusted-control
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Validate committed NuGet dependency graphs
        run: |
          python -P "$TRUSTED_CONTROL_DIR/tools/validate_nuget_locks.py" \
            --root "$UNTRUSTED_SOURCE_DIR"

      - name: Download OSV-Scanner (v2.4.0, verified SHA256)
        run: |
          set -euo pipefail
          OSV_VERSION="v2.4.0"
          OSV_SHA256="15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0"
          mkdir -p -- "$(dirname "$OSV_BINARY")"
          rm -f -- "$OSV_BINARY"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$OSV_BINARY" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $OSV_BINARY" | sha256sum --check --strict
          chmod +x "$OSV_BINARY"

      - name: Run and enforce OSV-Scanner
        run: |
          set -uo pipefail
          output_temp="$RUNNER_TEMP/osv-results.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.json"
          rm -f -- "$output_temp" "$OSV_RESULTS_FILE" "$OSV_SCAN_LOG" "$OSV_ENFORCE_LOG"
          set +e
          "$OSV_BINARY" scan --format=json --recursive --no-ignore \
            --config="$TRUSTED_CONTROL_DIR/.github/osv-scanner.toml" \
            "$UNTRUSTED_SOURCE_DIR" \
            --output-file "$output_temp" 2> "$OSV_SCAN_LOG"
          scan_status=$?
          set -e
          if [ -e "$output_temp" ]; then
            mv -- "$output_temp" "$OSV_RESULTS_FILE"
          fi

          stop_token="$(cat /proc/sys/kernel/random/uuid)"
          echo "::group::OSV-Scanner diagnostics"
          echo "::stop-commands::$stop_token"
          cat -- "$OSV_SCAN_LOG"
          echo "::$stop_token::"
          echo "::endgroup::"

          set +e
          evaluation="$(
            node "$TRUSTED_CONTROL_DIR/.github/scripts/enforce-osv-json.mjs" \
              "$OSV_RESULTS_FILE" 2> "$OSV_ENFORCE_LOG"
          )"
          enforcement_status=$?
          set -e
          echo "::group::OSV structured result"
          printf '%s\n' "$evaluation"
          echo "::endgroup::"
          echo "::group::OSV enforcement diagnostics"
          cat -- "$OSV_ENFORCE_LOG"
          echo "::endgroup::"

          if [ "$enforcement_status" -eq 2 ]; then
            {
              echo "## OSV dependency scan"
              echo
              echo "- Result: **invalid output**"
              echo "- Scanner exit code: \`$scan_status\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::OSV-Scanner output is missing or malformed."
            exit 1
          fi

          finding_count="$(
            node -e '
              const summary = JSON.parse(process.argv[1].split(/\r?\n/, 1)[0]);
              process.stdout.write(String(summary.vulnerabilityCount));
            ' "$evaluation"
          )"
          {
            echo "## OSV dependency scan"
            echo
            echo "- Findings: **$finding_count**"
            echo "- Scanner exit code: \`$scan_status\`"
            echo "- Structured validation result and scanner diagnostics are in the job logs."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$scan_status" -gt 1 ]; then
            echo "::error::OSV-Scanner could not complete."
            exit 1
          fi
          if [ "$enforcement_status" -ne 0 ] || [ "$finding_count" -ne 0 ]; then
            echo "::error::OSV-Scanner found a vulnerability or could not complete."
            exit 1
          fi
