name: dependency-vuln-scan

# Reusable OSV scanner called by security-gate.yml only for trusted source refs.
on:
  workflow_call:

permissions: {}

jobs:
  osv-scan:
    name: OSV-Scanner (validated lockfiles, JSON)
    runs-on: [self-hosted, Linux, X64, certigo-pr]
    permissions:
      contents: read
    env:
      UNTRUSTED_SOURCE_DIR: ${{ github.workspace }}/.untrusted-source
      TRUSTED_CONTROL_DIR: ${{ github.workspace }}/.trusted-control
      SCANNER_STATE_DIR: ${{ github.workspace }}/.scanner-state
      OSV_BINARY: ${{ github.workspace }}/.scanner-state/osv-scanner
      OSV_RESULTS_FILE: ${{ github.workspace }}/.scanner-state/osv-results.json
      OSV_SCAN_LOG: ${{ github.workspace }}/.scanner-state/osv-scan.log
      OSV_ENFORCE_LOG: ${{ github.workspace }}/.scanner-state/osv-enforce.log
      EXPECTED_LOCKS_FILE: ${{ github.workspace }}/.scanner-state/expected-lockfiles.json
      UNTRUSTED_PUB_DIR: ${{ github.workspace }}/.untrusted-pub-restore
      PUB_CACHE: ${{ github.workspace }}/.scanner-state/pub-cache-${{ github.run_id }}-${{ github.run_attempt }}
      FLUTTER_INSTALL_DIR: ${{ github.workspace }}/.scanner-state/flutter-sdk
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Reset isolated dependency state
        run: |
          /usr/bin/rm -rf -- "$SCANNER_STATE_DIR" "$UNTRUSTED_PUB_DIR"
          /usr/bin/mkdir -p -- "$SCANNER_STATE_DIR"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          path: .untrusted-source
          persist-credentials: false

      - name: Checkout immutable trusted controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: .trusted-control
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20.20.2"

      - name: Validate committed NuGet dependency graphs
        run: |
          python -P "$TRUSTED_CONTROL_DIR/tools/validate_dependency_locks.py" \
            --root "$UNTRUSTED_SOURCE_DIR" \
            --write-expected-sources "$EXPECTED_LOCKS_FILE"

      - name: Checkout isolated Pub restore source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          path: .untrusted-pub-restore
          persist-credentials: false

      - name: Install digest-verified Flutter without shared caches
        shell: bash
        run: |
          bash "$TRUSTED_CONTROL_DIR/.github/scripts/install-verified-flutter.sh" \
            "3.44.4" \
            "$FLUTTER_INSTALL_DIR"

      - name: Resolve every Pub lock from trusted inventory
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_EXECUTABLE="$FLUTTER_INSTALL_DIR/flutter/bin/flutter"
          if [ ! -x "$FLUTTER_EXECUTABLE" ]; then
            echo "::error::Digest-verified Flutter executable is unavailable."
            exit 1
          fi
          python -P "$TRUSTED_CONTROL_DIR/tools/verify_pub_locks.py" \
            --root "$UNTRUSTED_PUB_DIR" \
            --contract "$EXPECTED_LOCKS_FILE" \
            --flutter "$FLUTTER_EXECUTABLE" \
            --pub-cache "$PUB_CACHE"

      - name: Remove isolated Pub restore state
        run: /usr/bin/rm -rf -- "$UNTRUSTED_PUB_DIR" "$PUB_CACHE"

      - name: Verify trusted controls remain immutable
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git -C "$TRUSTED_CONTROL_DIR" status --porcelain --untracked-files=all)" ]; then
            echo "::error::Pub resolution modified the immutable trusted-control checkout."
            exit 1
          fi

      - name: Download OSV-Scanner (v2.4.0, verified SHA256)
        run: |
          set -euo pipefail
          OSV_VERSION="v2.4.0"
          OSV_SHA256="15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0"
          mkdir -p -- "$(dirname "$OSV_BINARY")"
          rm -f -- "$OSV_BINARY"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$OSV_BINARY" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $OSV_BINARY" | sha256sum --check --strict
          chmod +x "$OSV_BINARY"

      - name: Run and enforce OSV-Scanner
        run: |
          set -uo pipefail
          output_temp="$RUNNER_TEMP/osv-results.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.json"
          rm -f -- "$output_temp" "$OSV_RESULTS_FILE" "$OSV_SCAN_LOG" "$OSV_ENFORCE_LOG"
          set +e
          node "$TRUSTED_CONTROL_DIR/.github/scripts/run-osv-scan.mjs" \
            "$OSV_BINARY" \
            "$EXPECTED_LOCKS_FILE" \
            "$UNTRUSTED_SOURCE_DIR" \
            --format=json \
            --no-ignore \
            --forbid-argument=--all-packages \
            --forbid-argument=--recursive \
            --config="$TRUSTED_CONTROL_DIR/.github/osv-scanner.toml" \
            --output-file "$output_temp" > "$OSV_SCAN_LOG" 2>&1
          scan_status=$?
          set -e
          if [ -e "$output_temp" ]; then
            mv -- "$output_temp" "$OSV_RESULTS_FILE"
          fi

          stop_token="$(cat /proc/sys/kernel/random/uuid)"
          echo "::group::OSV-Scanner diagnostics"
          echo "::stop-commands::$stop_token"
          cat -- "$OSV_SCAN_LOG"
          echo "::$stop_token::"
          echo "::endgroup::"

          set +e
          evaluation="$(
            node "$TRUSTED_CONTROL_DIR/.github/scripts/enforce-osv-json.mjs" \
              "$OSV_RESULTS_FILE" \
              "$EXPECTED_LOCKS_FILE" \
              "$UNTRUSTED_SOURCE_DIR" 2> "$OSV_ENFORCE_LOG"
          )"
          enforcement_status=$?
          set -e
          echo "::group::OSV structured result"
          printf '%s\n' "$evaluation"
          echo "::endgroup::"
          echo "::group::OSV enforcement diagnostics"
          cat -- "$OSV_ENFORCE_LOG"
          echo "::endgroup::"

          if [ "$enforcement_status" -eq 2 ]; then
            {
              echo "## OSV dependency scan"
              echo
              echo "- Result: **invalid output**"
              echo "- Scanner exit code: \`$scan_status\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::OSV-Scanner output is missing or malformed."
            exit 1
          fi

          finding_count="$(
            node -e '
              const summary = JSON.parse(process.argv[1].split(/\r?\n/, 1)[0]);
              process.stdout.write(String(summary.vulnerabilityCount));
            ' "$evaluation"
          )"
          tracked_lock_count="$(
            node -e '
              const contract = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              process.stdout.write(String(contract.sources.length));
            ' "$EXPECTED_LOCKS_FILE"
          )"
          {
            echo "## OSV dependency scan"
            echo
            echo "- Findings: **$finding_count**"
            echo "- Explicit lockfiles scanned: **$tracked_lock_count**"
            echo "- Scanner exit code: \`$scan_status\`"
            echo "- Structured validation result and scanner diagnostics are in the job logs."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$scan_status" -gt 1 ]; then
            echo "::error::OSV-Scanner could not complete."
            exit 1
          fi
          if [ "$enforcement_status" -ne 0 ] || [ "$finding_count" -ne 0 ]; then
            echo "::error::OSV-Scanner found a vulnerability or could not complete."
            exit 1
          fi

      - name: Remove isolated dependency state
        if: ${{ always() }}
        run: /usr/bin/rm -rf -- "$SCANNER_STATE_DIR" "$UNTRUSTED_PUB_DIR"

  locked-restore:
    name: NuGet locked restore (no secrets)
    needs: osv-scan
    runs-on: [self-hosted, Linux, X64, certigo-pr]
    permissions:
      contents: read
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet-locked
      UNTRUSTED_RESTORE_DIR: ${{ github.workspace }}/.untrusted-restore
    steps:
      - name: Reset isolated .NET tool path
        run: /usr/bin/rm -rf -- "$DOTNET_INSTALL_DIR" "$UNTRUSTED_RESTORE_DIR"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          path: .untrusted-restore
          persist-credentials: false
      - name: Verify NuGet locks through isolated restore
        env:
          DOTNET_EXECUTABLE: ${{ github.workspace }}/.dotnet-locked/dotnet
          RESTORE_SOLUTION: ${{ github.workspace }}/.untrusted-restore/backend/Certigo.sln
        run: '"$DOTNET_EXECUTABLE" restore "$RESTORE_SOLUTION" --locked-mode'
      - name: Remove untrusted restore state
        if: ${{ always() }}
        env:
          CLEANUP_DOTNET_DIR: ${{ github.workspace }}/.dotnet-locked
          CLEANUP_SOURCE_DIR: ${{ github.workspace }}/.untrusted-restore
        run: /usr/bin/rm -rf -- "$CLEANUP_DOTNET_DIR" "$CLEANUP_SOURCE_DIR"
