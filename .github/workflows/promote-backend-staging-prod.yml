name: promote-backend-staging-prod

on:
  repository_dispatch:
    types: [promote-backend-staging-prod]

permissions: {}

concurrency:
  group: promote-backend-staging-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-dispatch:
    name: Validate default-branch dispatch
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, certigo-trusted]
    outputs:
      target: ${{ steps.payload.outputs.target }}
    steps:
      - name: Validate promotion target
        id: payload
        shell: bash
        env:
          CLIENT_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          if ! jq -e '
            type == "object"
            and (
              length == 0
              or (
                keys == ["environment"]
                and (.environment == "staging" or .environment == "prod")
              )
            )
          ' <<< "$CLIENT_PAYLOAD_JSON" >/dev/null; then
            echo "::error::client_payload must be empty or select exactly staging or prod."
            exit 1
          fi
          echo "target=$(jq -r '.environment // "staging-prod"' <<< "$CLIENT_PAYLOAD_JSON")" \
            >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Promote backend to staging
    needs: validate-dispatch
    if: ${{ needs.validate-dispatch.outputs.target != 'prod' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cd-backend.yml
    with:
      environment: staging
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy-prod:
    name: Promote backend to prod
    needs: [validate-dispatch, deploy-staging]
    if: >-
      ${{
        always()
        && github.ref == 'refs/heads/main'
        && needs.validate-dispatch.result == 'success'
        && (
          needs.validate-dispatch.outputs.target == 'prod'
          || (
            needs.validate-dispatch.outputs.target == 'staging-prod'
            && needs.deploy-staging.result == 'success'
          )
        )
      }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cd-backend.yml
    with:
      environment: prod
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
