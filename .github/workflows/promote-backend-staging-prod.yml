name: promote-backend-staging-prod

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: promote-backend-staging-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Promote backend to staging
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/cd-backend.yml
    with:
      environment: staging
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy-prod:
    name: Promote backend to prod
    needs: deploy-staging
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/cd-backend.yml
    with:
      environment: prod
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
