name: ci-mobile

# Flutter app + Dart packages: format check, static analysis and tests.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "apps/**", "packages/**", ".github/workflows/ci-mobile.yml" ]
  pull_request_target:

concurrency:
  group: ci-mobile-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && (github.event.action == 'opened' || github.event.action == 'synchronize') && github.run_attempt == 1 && github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}-{2}', github.event_name, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.action == 'synchronize' && github.run_attempt == 1 && github.event.pull_request.number > 0 && github.event.after != '' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  freshness:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
    uses: ./.github/workflows/pr-head-freshness.yml
    with:
      pull-request-number: ${{ github.event.pull_request.number }}
      event-head-sha: ${{ github.event.pull_request.head.sha }}
    permissions:
      pull-requests: read

  # CI-08 : détecte si des chemins pertinents ont changé pour cette PR. Une PR qui ne
  # touche pas ces chemins skippe packages/app AU NIVEAU JOB (le check requis passe alors
  # en success 'skipped'), au lieu d'un skip par filtre de chemin workflow-level qui
  # laisserait le check requis Pending et bloquerait la PR indéfiniment.
  changes:
    name: Detect changed paths
    needs: freshness
    if: ${{ always() && github.event_name == 'pull_request_target' && needs.freshness.outputs.current != 'false' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - 'apps/**'
              - 'packages/**'
              - '.github/workflows/ci-mobile.yml'
              # Voir ci-backend.yml : tout docs/contracts/, meme raison (#472).
              - 'docs/contracts/**'

  packages:
    name: Pure-Dart packages (core, cortex, data)
    needs: [freshness, changes]
    # Only internal head SHAs selected by the trusted base workflow execute here.
    if: >-
      always()
      && (github.event_name != 'pull_request_target' || needs.freshness.outputs.current != 'false')
      && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'pull_request_target' || needs.changes.outputs.relevant != 'false')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    strategy:
      matrix:
        package: [ core, cortex, data ]
    steps:
      - name: Enforce initial PR freshness validation
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        shell: bash
        env:
          FRESHNESS_RESULT: ${{ needs.freshness.result }}
        run: |
          if [ "$FRESHNESS_RESULT" != "success" ]; then
            echo "::error::Initial PR head freshness validation did not succeed."
            exit 1
          fi
      - name: Recheck current PR head after assignment
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const eventHead = context.payload.pull_request.head.sha;
            if (!eventHead || pull.head.sha !== eventHead) {
              core.setFailed(`Superseded PR event ${eventHead || '<missing>'}; current head is ${pull.head.sha}.`);
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Ensure CI prerequisites (unzip, jq, zip, xz)
        run: |
          set -e
          missing=""
          for t in unzip zip jq xz; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "Installing missing tools:$missing"
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y unzip zip jq xz-utils
          else
            echo "All prerequisites already present."
          fi
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          # Pinned for reproducible CI (matches the Dart bundled with Flutter
          # 3.44.4). Bump deliberately alongside FLUTTER_VERSION.
          sdk: "3.12.2"
      - name: Get dependencies
        working-directory: packages/${{ matrix.package }}
        run: dart pub get --enforce-lockfile
      - name: Analyze
        working-directory: packages/${{ matrix.package }}
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: packages/${{ matrix.package }}
        run: dart test

  app:
    name: Flutter app + UI packages
    needs: [freshness, changes]
    # Only internal head SHAs selected by the trusted base workflow execute here.
    if: >-
      always()
      && (github.event_name != 'pull_request_target' || needs.freshness.outputs.current != 'false')
      && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'pull_request_target' || needs.changes.outputs.relevant != 'false')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Enforce initial PR freshness validation
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        shell: bash
        env:
          FRESHNESS_RESULT: ${{ needs.freshness.result }}
        run: |
          if [ "$FRESHNESS_RESULT" != "success" ]; then
            echo "::error::Initial PR head freshness validation did not succeed."
            exit 1
          fi
      - name: Recheck current PR head after assignment
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const eventHead = context.payload.pull_request.head.sha;
            if (!eventHead || pull.head.sha !== eventHead) {
              core.setFailed(`Superseded PR event ${eventHead || '<missing>'}; current head is ${pull.head.sha}.`);
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Ensure CI prerequisites (unzip, jq, zip, xz)
        run: |
          set -e
          missing=""
          for t in unzip zip jq xz; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "Installing missing tools:$missing"
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y unzip zip jq xz-utils
          else
            echo "All prerequisites already present."
          fi
      - name: Set up repository formatter
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          # Formatting normalization is intentionally a separate migration.
          sdk: "3.6.0"
      - name: Format check
        run: dart format --line-length 100 --set-exit-if-changed apps packages
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Pub get (app)
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Dart pub outdated
        working-directory: apps/mobile
        run: flutter pub outdated --no-color || true
      - name: Analyze (app)
        working-directory: apps/mobile
        run: flutter analyze
      - name: Test (app)
        working-directory: apps/mobile
        run: flutter test --coverage
      # Toute la suite prism_ui (#487), dans ce job parce que son contexte
      # « Flutter app + UI packages » est requis sur main, contrairement à
      # « Prism UI renderer goldens ». Ne pas renommer ce job : la protection de
      # branche attendrait un contexte que plus aucun workflow ne produirait.
      - name: Pub get (prism_ui)
        working-directory: packages/prism_ui
        run: flutter pub get --enforce-lockfile
      - name: Test (prism_ui)
        working-directory: packages/prism_ui
        run: flutter test
      - name: Upload coverage
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/lcov.info
          if-no-files-found: ignore

  prism-goldens:
    name: Prism UI renderer goldens
    needs: [freshness, changes]
    # Uses the same Flutter/Dart toolchain as the app and package jobs so
    # dependency resolution and golden rendering cannot drift independently.
    # Only internal head SHAs selected by the trusted base workflow execute here.
    if: >-
      always()
      && (github.event_name != 'pull_request_target' || needs.freshness.outputs.current != 'false')
      && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'pull_request_target' || needs.changes.outputs.relevant != 'false')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Enforce initial PR freshness validation
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        shell: bash
        env:
          FRESHNESS_RESULT: ${{ needs.freshness.result }}
        run: |
          if [ "$FRESHNESS_RESULT" != "success" ]; then
            echo "::error::Initial PR head freshness validation did not succeed."
            exit 1
          fi
      - name: Recheck current PR head after assignment
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const eventHead = context.payload.pull_request.head.sha;
            if (!eventHead || pull.head.sha !== eventHead) {
              core.setFailed(`Superseded PR event ${eventHead || '<missing>'}; current head is ${pull.head.sha}.`);
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Ensure CI prerequisites (unzip, jq, zip, xz)
        run: |
          set -e
          missing=""
          for t in unzip zip jq xz; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "Installing missing tools:$missing"
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y unzip zip jq xz-utils
          else
            echo "All prerequisites already present."
          fi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      # Gate de régression visuelle : rejoue les golden tests par type de bloc
      # rendu. Toute divergence au-delà de la tolérance du comparateur fait
      # échouer CE job — c'est le gate dédié exigé par la DoD.
      - name: Pub get (prism_ui)
        working-directory: packages/prism_ui
        run: flutter pub get --enforce-lockfile
      - name: Golden tests (prism_ui renderer)
        working-directory: packages/prism_ui
        run: flutter test test/rendering/renderer_golden_test.dart
