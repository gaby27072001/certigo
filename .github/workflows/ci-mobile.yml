name: ci-mobile

# Flutter app + Dart packages: format check, static analysis and tests.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "apps/**", "packages/**", ".github/workflows/ci-mobile.yml" ]
  pull_request:
    paths: [ "apps/**", "packages/**", ".github/workflows/ci-mobile.yml" ]

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.27.4"
  NON_CRITICAL_RUNNER_LABELS_JSON: ${{ vars.PR_RUNNER_LABELS || '["self-hosted","Linux","X64","microlingo-ci"]' }}

jobs:
  packages:
    name: Pure-Dart packages (core, cortex, data)
    runs-on: ${{ vars.PR_RUNNER_LABELS && fromJSON(vars.PR_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","microlingo-ci"]') }}
    strategy:
      matrix:
        package: [ core, cortex, data ]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned for reproducible CI (matches the Dart bundled with Flutter
          # 3.27.4). Bump deliberately alongside FLUTTER_VERSION.
          sdk: "3.6.0"
      - name: Get dependencies
        working-directory: packages/${{ matrix.package }}
        run: dart pub get
      - name: Analyze
        working-directory: packages/${{ matrix.package }}
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: packages/${{ matrix.package }}
        run: dart test

  app:
    name: Flutter app + UI packages
    runs-on: ${{ vars.PR_RUNNER_LABELS && fromJSON(vars.PR_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","microlingo-ci"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Clear corrupted Flutter tool cache
        run: |
          # subosito/flutter-action caches Flutter under _work/_tool/flutter.
          # If a previous download was interrupted, the extracted dir exists but
          # bin/internal/shared.sh is missing, causing every subsequent run to
          # fail. Detect and remove such entries so the action downloads fresh.
          TOOL_DIR="/home/runner/actions-runner/_work/_tool/flutter"
          TOOL_DIR2="/home/runner/actions-runner-2/_work/_tool/flutter"
          for BASE in "$TOOL_DIR" "$TOOL_DIR2"; do
            if [ -d "$BASE" ]; then
              for DIR in "$BASE"/stable-*; do
                if [ -d "$DIR" ] && [ ! -f "$DIR/flutter/bin/internal/shared.sh" ]; then
                  echo "Removing corrupted Flutter install: $DIR"
                  rm -rf "$DIR"
                fi
              done
            fi
          done
        continue-on-error: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Format check
        run: dart format --line-length 100 --set-exit-if-changed apps packages
      - name: Pub get (app)
        working-directory: apps/mobile
        run: flutter pub get
      - name: Dart pub outdated
        working-directory: apps/mobile
        run: flutter pub outdated --no-color || true
      - name: Analyze (app)
        working-directory: apps/mobile
        run: flutter analyze
      - name: Test (app)
        working-directory: apps/mobile
        run: flutter test --coverage
      - name: Upload coverage
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/lcov.info
          if-no-files-found: ignore
