name: ci-mobile

# Flutter app + Dart packages: format check, static analysis and tests.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "apps/**", "packages/**", ".github/workflows/ci-mobile.yml" ]
  pull_request:

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.27.4"
  NON_CRITICAL_RUNNER_LABELS_JSON: ${{ vars.PR_RUNNER_LABELS || '["self-hosted","Linux","X64","certigo-ci"]' }}

jobs:
  # CI-08 : détecte si des chemins pertinents ont changé pour cette PR. Une PR qui ne
  # touche pas ces chemins skippe packages/app AU NIVEAU JOB (le check requis passe alors
  # en success 'skipped'), au lieu d'un skip par filtre de chemin workflow-level qui
  # laisserait le check requis Pending et bloquerait la PR indéfiniment.
  changes:
    name: Detect changed paths
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.PR_RUNNER_LABELS && fromJSON(vars.PR_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]') }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            relevant:
              - 'apps/**'
              - 'packages/**'
              - '.github/workflows/ci-mobile.yml'

  packages:
    name: Pure-Dart packages (core, cortex, data)
    needs: [changes]
    # CI-01 (fork-guard) : une PR de FORK exécute du code non fiable → elle NE doit
    # PAS toucher le runner self-hosted persistant. Sur un évènement pull_request, on
    # n'autorise le job QUE si la PR vient du même repo (branche interne). Les
    # évènements push/dispatch passent inchangés → zéro régression.
    # CI-08 : `always()` neutralise le skip hérité de `needs.changes` ; le fork-guard reste
    # (clause 2) ; on ne skippe QUE si paths-filter dit explicitement `false` (clause 3, PR
    # seulement). Un output vide/erreur de filtre (!= 'false') => le vrai job tourne (sûr).
    if: >-
      always()
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'pull_request' || needs.changes.outputs.relevant != 'false')
    # CI-01 : approbation humaine requise pour les PR (Environment pr-ci) avant
    # exécution sur le runner self-hosted persistant. Sans effet pour push/dispatch.
    environment: ${{ github.event_name == 'pull_request' && 'pr-ci' || '' }}
    runs-on: ${{ vars.PR_RUNNER_LABELS && fromJSON(vars.PR_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]') }}
    strategy:
      matrix:
        package: [ core, cortex, data ]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure CI prerequisites (unzip, jq, zip, xz)
        run: |
          set -e
          missing=""
          for t in unzip zip jq xz; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "Installing missing tools:$missing"
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y unzip zip jq xz-utils
          else
            echo "All prerequisites already present."
          fi
      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned for reproducible CI (matches the Dart bundled with Flutter
          # 3.27.4). Bump deliberately alongside FLUTTER_VERSION.
          sdk: "3.6.0"
      - name: Get dependencies
        working-directory: packages/${{ matrix.package }}
        run: dart pub get
      - name: Analyze
        working-directory: packages/${{ matrix.package }}
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: packages/${{ matrix.package }}
        run: dart test

  app:
    name: Flutter app + UI packages
    needs: [changes]
    # CI-01 (fork-guard) : une PR de FORK exécute du code non fiable → elle NE doit
    # PAS toucher le runner self-hosted persistant. Sur un évènement pull_request, on
    # n'autorise le job QUE si la PR vient du même repo (branche interne). Les
    # évènements push/dispatch passent inchangés → zéro régression.
    # CI-08 : `always()` neutralise le skip hérité de `needs.changes` ; le fork-guard reste
    # (clause 2) ; on ne skippe QUE si paths-filter dit explicitement `false` (clause 3, PR
    # seulement). Un output vide/erreur de filtre (!= 'false') => le vrai job tourne (sûr).
    if: >-
      always()
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'pull_request' || needs.changes.outputs.relevant != 'false')
    # CI-01 : approbation humaine requise pour les PR (Environment pr-ci) avant
    # exécution sur le runner self-hosted persistant. Sans effet pour push/dispatch.
    environment: ${{ github.event_name == 'pull_request' && 'pr-ci' || '' }}
    runs-on: ${{ vars.PR_RUNNER_LABELS && fromJSON(vars.PR_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure CI prerequisites (unzip, jq, zip, xz)
        run: |
          set -e
          missing=""
          for t in unzip zip jq xz; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "Installing missing tools:$missing"
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y unzip zip jq xz-utils
          else
            echo "All prerequisites already present."
          fi
      - name: Clear corrupted Flutter tool cache
        run: |
          # subosito/flutter-action caches Flutter under _work/_tool/flutter.
          # If a previous download was interrupted, the extracted dir exists but
          # bin/internal/shared.sh is missing, causing every subsequent run to
          # fail. Detect and remove such entries so the action downloads fresh.
          TOOL_DIR="/home/runner/actions-runner/_work/_tool/flutter"
          TOOL_DIR2="/home/runner/actions-runner-2/_work/_tool/flutter"
          for BASE in "$TOOL_DIR" "$TOOL_DIR2"; do
            if [ -d "$BASE" ]; then
              for DIR in "$BASE"/stable-*; do
                if [ -d "$DIR" ] && [ ! -f "$DIR/flutter/bin/internal/shared.sh" ]; then
                  echo "Removing corrupted Flutter install: $DIR"
                  rm -rf "$DIR"
                fi
              done
            fi
          done
        continue-on-error: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Format check
        run: dart format --line-length 100 --set-exit-if-changed apps packages
      - name: Pub get (app)
        working-directory: apps/mobile
        run: flutter pub get
      - name: Dart pub outdated
        working-directory: apps/mobile
        run: flutter pub outdated --no-color || true
      - name: Analyze (app)
        working-directory: apps/mobile
        run: flutter analyze
      - name: Test (app)
        working-directory: apps/mobile
        run: flutter test --coverage
      - name: Upload coverage
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/lcov.info
          if-no-files-found: ignore

  prism-goldens:
    name: Prism UI renderer goldens
    needs: [changes]
    # CI-01 (fork-guard) : une PR de FORK exécute du code non fiable → elle NE doit
    # PAS toucher le runner self-hosted persistant. Sur un évènement pull_request, on
    # n'autorise le job QUE si la PR vient du même repo (branche interne). Les
    # évènements push/dispatch passent inchangés → zéro régression.
    # CI-08 : `always()` neutralise le skip hérité de `needs.changes` ; le fork-guard reste
    # (clause 2) ; on ne skippe QUE si paths-filter dit explicitement `false` (clause 3, PR
    # seulement). Un output vide/erreur de filtre (!= 'false') => le vrai job tourne (sûr).
    if: >-
      always()
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'pull_request' || needs.changes.outputs.relevant != 'false')
    # CI-01 : approbation humaine requise pour les PR (Environment pr-ci) avant
    # exécution sur le runner self-hosted persistant. Sans effet pour push/dispatch.
    environment: ${{ github.event_name == 'pull_request' && 'pr-ci' || '' }}
    runs-on: ${{ vars.PR_RUNNER_LABELS && fromJSON(vars.PR_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure CI prerequisites (unzip, jq, zip, xz)
        run: |
          set -e
          missing=""
          for t in unzip zip jq xz; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "Installing missing tools:$missing"
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y unzip zip jq xz-utils
          else
            echo "All prerequisites already present."
          fi
      - name: Clear corrupted Flutter tool cache
        run: |
          # subosito/flutter-action caches Flutter under _work/_tool/flutter.
          # If a previous download was interrupted, the extracted dir exists but
          # bin/internal/shared.sh is missing, causing every subsequent run to
          # fail. Detect and remove such entries so the action downloads fresh.
          TOOL_DIR="/home/runner/actions-runner/_work/_tool/flutter"
          TOOL_DIR2="/home/runner/actions-runner-2/_work/_tool/flutter"
          for BASE in "$TOOL_DIR" "$TOOL_DIR2"; do
            if [ -d "$BASE" ]; then
              for DIR in "$BASE"/stable-*; do
                if [ -d "$DIR" ] && [ ! -f "$DIR/flutter/bin/internal/shared.sh" ]; then
                  echo "Removing corrupted Flutter install: $DIR"
                  rm -rf "$DIR"
                fi
              done
            fi
          done
        continue-on-error: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Gate de régression visuelle : rejoue les golden tests par type de bloc
      # rendu. Toute divergence au-delà de la tolérance du comparateur fait
      # échouer CE job — c'est le gate dédié exigé par la DoD.
      - name: Pub get (prism_ui)
        working-directory: packages/prism_ui
        run: flutter pub get
      - name: Golden tests (prism_ui renderer)
        working-directory: packages/prism_ui
        run: flutter test test/rendering/renderer_golden_test.dart
