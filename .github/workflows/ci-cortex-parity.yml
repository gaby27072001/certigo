name: ci-cortex-parity

# CORTEX parity gate : le meme jeu de golden vectors partages
# (packages/cortex/test/golden/cortex_golden_vectors.json) est rejoue par les DEUX
# implementations de l'algorithme CORTEX — Dart (packages/cortex) et .NET
# (backend/src/Certigo.Domain). Si l'une des deux diverge des vecteurs, son test
# echoue et CE gate echoue : la PR est bloquee tant que Dart et .NET ne sont pas
# d'accord bit-a-bit sur les sorties (version d'algo, scheduler/dueAt, weakness,
# readiness). Source unique de verite = le JSON ; aucun vecteur duplique par langage.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "packages/cortex/**"
      - "backend/src/Certigo.Domain/**"
      - "backend/tests/Certigo.Domain.Tests/**"
      - ".github/workflows/ci-cortex-parity.yml"
  pull_request:

concurrency:
  group: ci-cortex-parity-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # CI-08 : detecte si des chemins pertinents ont change pour cette PR. Une PR qui ne
  # touche pas le perimetre CORTEX skippe le gate AU NIVEAU JOB (le check requis passe
  # alors en success 'skipped'), au lieu d'un skip par filtre de chemin workflow-level
  # qui laisserait le check requis Pending et bloquerait la PR indefiniment.
  changes:
    name: Detect changed paths
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.BACKEND_CI_FALLBACK == 'true' && 'ubuntu-latest' || (github.ref == 'refs/heads/main' && (vars.MAIN_CRITICAL_RUNNER_LABELS && fromJSON(vars.MAIN_CRITICAL_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]')) || (vars.PR_RUNNER_LABELS && fromJSON(vars.PR_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]'))) }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            relevant:
              - 'packages/cortex/**'
              - 'backend/src/Certigo.Domain/**'
              - 'backend/tests/Certigo.Domain.Tests/**'
              - '.github/workflows/ci-cortex-parity.yml'

  parity:
    name: Dart <-> .NET golden vectors parity
    needs: [changes]
    # CI-01 (fork-guard) : une PR de FORK execute du code non fiable → elle NE doit PAS
    # toucher le runner self-hosted persistant. Sur un evenement pull_request, on
    # n'autorise le job QUE si la PR vient du meme repo (branche interne). Les evenements
    # push/dispatch passent inchanges → zero regression.
    # CI-08 : `always()` neutralise le skip herite de `needs.changes` ; le fork-guard reste
    # (clause 2) ; on ne skippe QUE si paths-filter dit explicitement `false` (clause 3, PR
    # seulement). Un output vide/erreur de filtre (!= 'false') => le vrai gate tourne (sur).
    if: >-
      always()
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'pull_request' || needs.changes.outputs.relevant != 'false')
    # CI-01 : approbation humaine requise pour les PR (Environment pr-ci) avant execution
    # sur le runner self-hosted persistant. Sans effet pour push/dispatch.
    environment: ${{ github.event_name == 'pull_request' && 'pr-ci' || '' }}
    # SPOF mitigation : repli GitHub-hosted pre-cable (var repo BACKEND_CI_FALLBACK=true).
    # Defaut = runner self-hosted (comportement inchange).
    runs-on: ${{ vars.BACKEND_CI_FALLBACK == 'true' && 'ubuntu-latest' || (github.ref == 'refs/heads/main' && (vars.MAIN_CRITICAL_RUNNER_LABELS && fromJSON(vars.MAIN_CRITICAL_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]')) || (vars.PR_RUNNER_LABELS && fromJSON(vars.PR_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]'))) }}
    # Le runner-2 a /usr/share/dotnet NON inscriptible : on force actions/setup-dotnet a
    # installer dans un dossier temporaire inscriptible pour que le job passe sur les 2 runners.
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@v4
      - name: Ensure CI prerequisites (unzip, jq, zip, xz)
        run: |
          set -e
          missing=""
          for t in unzip zip jq xz; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "Installing missing tools:$missing"
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y unzip zip jq xz-utils
          else
            echo "All prerequisites already present."
          fi
      - uses: dart-lang/setup-dart@v1
        with:
          # Epingle pour une CI reproductible (Dart livre avec Flutter 3.27.4).
          # A bumper deliberement avec FLUTTER_VERSION de ci-mobile.
          sdk: "3.6.0"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # --- Cote Dart : rejoue les golden vectors partages via package:cortex ---
      - name: Dart cortex get dependencies
        working-directory: packages/cortex
        run: dart pub get
      - name: Dart parity golden test
        working-directory: packages/cortex
        run: dart test test/cortex_golden_test.dart
      # --- Cote .NET : rejoue LES MEMES golden vectors via Certigo.Domain ---
      - name: .NET parity golden test
        working-directory: backend
        run: dotnet test tests/Certigo.Domain.Tests/Certigo.Domain.Tests.csproj --filter "FullyQualifiedName~CortexParityTests" --verbosity normal
