name: CI preflight

# Loaded from main through pull_request_target. Trusted controls select and
# validate an internal PR checkout before any targeted Bicep compilation.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ci-preflight-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && (github.event.action == 'opened' || github.event.action == 'synchronize') && github.run_attempt == 1 && github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}-{2}', github.event_name, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.action == 'synchronize' && github.run_attempt == 1 && github.event.pull_request.number > 0 && github.event.after != '' }}

jobs:
  freshness:
    uses: ./.github/workflows/pr-head-freshness.yml
    with:
      pull-request-number: ${{ github.event.pull_request.number }}
      event-head-sha: ${{ github.event.pull_request.head.sha }}
    permissions:
      pull-requests: read

  preflight:
    name: Fast fail
    needs: freshness
    if: ${{ always() && needs.freshness.outputs.current != 'false' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64, certigo-pr]
    permissions:
      contents: read
      pull-requests: read
    env:
      UNTRUSTED_SOURCE_DIR: ${{ github.workspace }}/.untrusted-source
      TRUSTED_CONTROL_DIR: ${{ github.workspace }}/.trusted-control
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BICEP_VERSION: "0.44.1"
      BICEP_SHA256: "e17dc9a9888184886bb0c0051a3230b83b19f342749999f707bc571c3dfd2f45"
    steps:
      - name: Enforce initial PR freshness validation
        shell: bash
        env:
          FRESHNESS_RESULT: ${{ needs.freshness.result }}
        run: |
          if [ "$FRESHNESS_RESULT" != "success" ]; then
            echo "::error::Initial PR head freshness validation did not succeed."
            exit 1
          fi
      - name: Recheck current PR head after assignment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const eventHead = context.payload.pull_request.head.sha;
            if (!eventHead || pull.head.sha !== eventHead) {
              core.setFailed(`Superseded PR event ${eventHead || '<missing>'}; current head is ${pull.head.sha}.`);
            }
      - name: Bootstrap trusted Python
        id: python-bootstrap
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
          architecture: "x64"
          check-latest: false

      - name: Verify trusted Python bootstrap
        shell: bash
        env:
          EXPECTED_PYTHON_VERSION: "3.12.10"
          PYTHON_PATH: ${{ steps.python-bootstrap.outputs.python-path }}
        run: |
          set -euo pipefail
          test -n "$PYTHON_PATH"
          toolcache_root="$(cd -P -- "$RUNNER_TOOL_CACHE" && pwd)"
          canonical_python="$(readlink -f -- "$PYTHON_PATH")"
          case "$canonical_python" in
            "$toolcache_root"/Python/"$EXPECTED_PYTHON_VERSION"/x64/bin/python*)
              ;;
            *)
              echo "::error::setup-python returned an interpreter outside the trusted tool cache."
              exit 126
              ;;
          esac
          "$canonical_python" -P -c '
          import os
          import sys

          expected = tuple(map(int, os.environ["EXPECTED_PYTHON_VERSION"].split(".")))
          raise SystemExit(
              0 if sys.version_info[:3] == expected and sys.flags.safe_path else 1
          )
          '

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: .untrusted-source
          persist-credentials: false

      - name: Checkout immutable trusted controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: .trusted-control
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20.20.2"

      - name: Validate impact contract and select gates
        id: impact
        shell: bash
        run: |
          set -euo pipefail
          node "$TRUSTED_CONTROL_DIR/.github/scripts/ci-impact.mjs" \
            --workspace "$UNTRUSTED_SOURCE_DIR" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --matrix "$TRUSTED_CONTROL_DIR/.github/ci/impact-matrix.json" \
            --candidate-matrix "$UNTRUSTED_SOURCE_DIR/.github/ci/impact-matrix.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Install actionlint
        if: ${{ steps.impact.outputs.workflow_yaml == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          actionlint_dir="$RUNNER_TEMP/actionlint"
          archive="$actionlint_dir/actionlint.tar.gz"
          mkdir -p "$actionlint_dir"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" \
            | sha256sum --check --strict
          tar xzf "$archive" -C "$actionlint_dir"
          chmod +x "$actionlint_dir/actionlint"
          echo "$actionlint_dir" >> "$GITHUB_PATH"

      - name: Validate workflow YAML
        if: ${{ steps.impact.outputs.workflow_yaml == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          workflows=(
            "$UNTRUSTED_SOURCE_DIR"/.github/workflows/*.yml
            "$UNTRUSTED_SOURCE_DIR"/.github/workflows/*.yaml
          )
          if [ "${#workflows[@]}" -eq 0 ]; then
            echo "::error::No workflow files found under .github/workflows."
            exit 1
          fi
          actionlint "${workflows[@]}"

      - name: Install trusted validator dependencies
        if: ${{ steps.impact.outputs.security_policy == 'true' }}
        working-directory: .trusted-control
        shell: bash
        run: npm ci --ignore-scripts

      - name: Run adversarial selector and security-policy tests
        if: ${{ steps.impact.outputs.security_policy == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            "$TRUSTED_CONTROL_DIR/.github/scripts/ci-impact.test.mjs" \
            "$TRUSTED_CONTROL_DIR/.github/scripts/codeql-gate-policy.test.mjs" \
            "$TRUSTED_CONTROL_DIR/.github/scripts/workflow-concurrency-policy.test.mjs" \
            "$TRUSTED_CONTROL_DIR/.github/scripts/workflow-security-cache-policy.test.mjs"
          node "$TRUSTED_CONTROL_DIR/.github/scripts/validate-workflow-security.mjs" \
            --workspace "$UNTRUSTED_SOURCE_DIR"

      - name: Validate project-state source
        if: ${{ steps.impact.outputs.project_state == 'true' }}
        shell: bash
        env:
          PYTHONSAFEPATH: "1"
        run: |
          set -euo pipefail
          bash "$TRUSTED_CONTROL_DIR/.github/scripts/run-python.sh" \
            "$TRUSTED_CONTROL_DIR/tools/project_state.py" \
            --root "$UNTRUSTED_SOURCE_DIR" \
            --check

      - name: Install Bicep CLI
        if: ${{ steps.impact.outputs.bicep_compile == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bicep_dir="$RUNNER_TEMP/bicep"
          mkdir -p "$bicep_dir"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$bicep_dir/bicep" \
            "https://github.com/Azure/bicep/releases/download/v${BICEP_VERSION}/bicep-linux-x64"
          echo "$BICEP_SHA256  $bicep_dir/bicep" | sha256sum --check --strict
          chmod +x "$bicep_dir/bicep"
          echo "BICEP_BIN=$bicep_dir/bicep" >> "$GITHUB_ENV"

      - name: Compile impacted Bicep entry points
        if: ${{ steps.impact.outputs.bicep_compile == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node "$TRUSTED_CONTROL_DIR/.github/scripts/ci-impact.mjs" \
            --workspace "$UNTRUSTED_SOURCE_DIR" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --matrix "$TRUSTED_CONTROL_DIR/.github/ci/impact-matrix.json" \
            --compile-bicep "$BICEP_BIN"
