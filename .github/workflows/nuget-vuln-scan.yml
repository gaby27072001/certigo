name: nuget-vuln-scan

# Reusable NuGet scanner called by security-gate.yml only for trusted source refs.
on:
  workflow_call:

permissions: {}

jobs:
  dotnet-vuln:
    name: Vulnerable .NET packages (NuGet/GitHub Advisory)
    runs-on: [self-hosted, Linux, X64, certigo-ci]
    permissions:
      contents: read
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore backend/Certigo.sln

      - name: Check vulnerable packages
        run: |
          set -uo pipefail
          set +e
          dotnet list backend/Certigo.sln package --vulnerable --include-transitive \
            2>&1 | tee dotnet-vulnerable.log
          scan_status="${PIPESTATUS[0]}"
          set -e

          if ! grep -Eqi "has no vulnerable packages|has the following vulnerable" dotnet-vulnerable.log; then
            {
              echo "## NuGet dependency scan"
              echo
              echo "- Result: **invalid output**"
              echo "- Scanner exit code: \`$scan_status\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::NuGet vulnerability scan output is missing or malformed."
            exit 1
          fi
          vulnerable_projects="$(grep -Eic "has the following vulnerable" dotnet-vulnerable.log || true)"
          {
            echo "## NuGet dependency scan"
            echo
            echo "- Projects reporting vulnerable packages: **$vulnerable_projects**"
            echo "- Scanner exit code: \`$scan_status\`"
            echo "- Complete scanner output is available in this job's immutable logs."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$scan_status" -ne 0 ]; then
            echo "::error::NuGet vulnerability scan could not complete."
            exit 1
          fi
          if [ "$vulnerable_projects" -ne 0 ]; then
            echo "::error::Vulnerable NuGet packages detected."
            exit 1
          fi
