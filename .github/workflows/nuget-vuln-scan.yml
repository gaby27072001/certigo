name: nuget-vuln-scan

# Reusable NuGet scanner called by security-gate.yml only for trusted source refs.
on:
  workflow_call:

permissions: {}

jobs:
  dotnet-vuln:
    name: Vulnerable .NET packages (NuGet/GitHub Advisory)
    runs-on: [self-hosted, Linux, X64, certigo-ci]
    permissions:
      contents: read
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore backend/Certigo.sln

      - name: Check vulnerable packages
        run: |
          set -euo pipefail
          dotnet list backend/Certigo.sln package --vulnerable --include-transitive | tee dotnet-vulnerable.log
          if grep -qi "has the following vulnerable" dotnet-vulnerable.log; then
            echo "::error::Vulnerable NuGet packages detected."
            exit 1
          fi

      - name: Ensure NuGet findings log exists
        if: ${{ always() }}
        run: |
          if [ ! -e dotnet-vulnerable.log ]; then
            echo "NuGet scan did not produce a findings log; inspect prior failed steps." > dotnet-vulnerable.log
          fi

      - name: Preserve NuGet findings
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-findings
          path: dotnet-vulnerable.log
          if-no-files-found: error
          retention-days: 30
