name: Validate generated project state

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"

concurrency:
  group: ci-project-state-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.action == 'synchronize' && github.event.pull_request.number > 0 && github.event.pull_request.head.sha != '' }}

permissions:
  contents: read

jobs:
  freshness:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
    uses: ./.github/workflows/pr-head-freshness.yml
    with:
      pull-request-number: ${{ github.event.pull_request.number }}
      event-head-sha: ${{ github.event.pull_request.head.sha }}
    permissions:
      pull-requests: read

  validate-source:
    name: Validate project-state source
    needs: freshness
    if: ${{ always() && (github.event_name != 'pull_request_target' || (needs.freshness.outputs.current == 'true' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: [self-hosted, Linux, X64, certigo-pr]
    permissions:
      contents: read
    env:
      PROJECT_WORKSPACE: ${{ github.workspace }}/.untrusted-source
      TRUSTED_CONTROL_DIR: ${{ github.workspace }}/.trusted-control
      CERTIGO_WORKSPACE: ${{ github.workspace }}/.untrusted-source
      PYTHONSAFEPATH: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: .untrusted-source
          persist-credentials: false
      - name: Checkout immutable trusted controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: .trusted-control
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test project-state generator
        working-directory: .trusted-control
        run: python -P -m unittest discover -s tools/tests -p "test_*.py" -v
      - name: Validate committed active-content reference and generated state
        working-directory: .trusted-control
        run: python -P tools/project_state.py --root "$PROJECT_WORKSPACE" --check

  validate:
    name: Generated state equals committed state
    needs: [freshness, validate-source]
    if: ${{ always() && (github.event_name != 'pull_request_target' || (needs.freshness.outputs.current == 'true' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: [self-hosted, Linux, X64, certigo-trusted]
    permissions:
      contents: read
    steps:
      - name: Enforce trusted source validation
        shell: bash
        env:
          SOURCE_VALIDATION_RESULT: ${{ needs.validate-source.result }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_VALIDATION_RESULT" != "success" ]; then
            echo "::error::Trusted project-state source validation did not succeed."
            exit 1
          fi
