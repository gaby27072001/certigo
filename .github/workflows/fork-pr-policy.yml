name: Pull request trust policy

# This workflow is loaded from the base branch. It never checks out or executes
# pull request code, so an unsupported fork cannot reach a persistent runner.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: fork-pr-policy-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && (github.event.action == 'opened' || github.event.action == 'synchronize') && github.run_attempt == 1 && github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}-{2}', github.event_name, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.action == 'synchronize' && github.run_attempt == 1 && github.event.pull_request.number > 0 && github.event.after != '' }}

jobs:
  trust-gate:
    name: Fork PR policy / Required gate
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Enforce same-repository pull requests
        shell: bash
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]; then
            echo "::error::Fork pull requests are not supported by the repository trust policy."
            exit 1
          fi
          echo "Same-repository pull request accepted for CI validation."
