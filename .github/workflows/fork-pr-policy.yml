name: Pull request trust policy

# This workflow is loaded from the base branch. It never checks out or executes
# pull request code, so an unsupported fork cannot reach a persistent runner.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: fork-pr-policy-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && (github.event.action == 'opened' || github.event.action == 'synchronize') && github.run_attempt == 1 && github.event.pull_request.number > 0 && github.event.pull_request.head.sha != '' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}-{2}', github.event_name, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.action == 'synchronize' && github.run_attempt == 1 && github.event.pull_request.number > 0 && github.event.pull_request.head.sha != '' }}

jobs:
  freshness:
    uses: ./.github/workflows/pr-head-freshness.yml
    with:
      pull-request-number: ${{ github.event.pull_request.number }}
      event-head-sha: ${{ github.event.pull_request.head.sha }}
    permissions:
      pull-requests: read

  trust-gate:
    name: Fork PR policy / Required gate
    needs: freshness
    if: ${{ always() && needs.freshness.outputs.current != 'false' }}
    runs-on: [self-hosted, Linux, X64, certigo-pr]
    permissions:
      pull-requests: read
    steps:
      - name: Enforce initial PR freshness validation
        shell: bash
        env:
          FRESHNESS_RESULT: ${{ needs.freshness.result }}
        run: |
          if [ "$FRESHNESS_RESULT" != "success" ]; then
            echo "::error::Initial PR head freshness validation did not succeed."
            exit 1
          fi
      - name: Recheck current PR head after assignment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const eventHead = context.payload.pull_request.head.sha;
            if (!eventHead || pull.head.sha !== eventHead) {
              core.setFailed(`Superseded PR event ${eventHead || '<missing>'}; current head is ${pull.head.sha}.`);
            }
      - name: Enforce same-repository pull requests
        shell: bash
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]; then
            echo "::error::Fork pull requests are not supported because GitHub-hosted runners are permanently unavailable and fork code must never execute on persistent Azure runners."
            exit 1
          fi
          echo "Same-repository pull request accepted for Azure runner validation."
