name: ci-backend

# .NET 8 Azure Functions API: restore, build (warnings as errors) and test.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "backend/**", ".github/workflows/ci-backend.yml" ]
  pull_request:
    paths: [ "backend/**", ".github/workflows/ci-backend.yml" ]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    name: Build & test
    # SPOF mitigation (audit #1) : repli GitHub-hosted pré-câblé.
    # Défaut = runner self-hosted (comportement inchangé).
    # Pour basculer en urgence si le pool self-hosted est indisponible :
    #   1) définir la variable repo  BACKEND_CI_FALLBACK = true  (Settings > Actions > Variables)
    #   2) s'assurer que les GitHub-hosted runners sont ACTIVÉS pour le repo/org
    #      (ils sont désactivés par défaut ici — cf. lint-workflows.yml).
    # Repasser BACKEND_CI_FALLBACK à false (ou supprimer la variable) pour revenir au self-hosted.
    runs-on: ${{ fromJSON(vars.BACKEND_CI_FALLBACK == 'true' && '["ubuntu-latest"]' || github.ref == 'refs/heads/main' && (vars.MAIN_CRITICAL_RUNNER_LABELS || '["self-hosted","Linux","X64","law-microlingo"]') || (vars.PR_RUNNER_LABELS || '["self-hosted","Linux","X64","microlingo-ci"]')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        working-directory: backend
        run: dotnet restore Certigo.sln
      - name: Build
        working-directory: backend
        run: dotnet build Certigo.sln --configuration Release --no-restore -warnaserror
      - name: Test
        working-directory: backend
        run: dotnet test Certigo.sln --configuration Release --no-build --verbosity normal

      - name: Generate SBOM (CycloneDX)
        working-directory: backend
        continue-on-error: true
        run: |
          dotnet tool install --global CycloneDX
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet CycloneDX Certigo.sln --output ./sbom --json
      - name: Upload SBOM
        continue-on-error: true # advisory artifact: never fail the gate (e.g. on storage quota)
        uses: actions/upload-artifact@v7
        with:
          name: backend-sbom
          path: backend/sbom/**
          if-no-files-found: warn
          retention-days: 90

  integration-cosmos:
    name: Integration tests (Cosmos emulator)
    runs-on: [self-hosted, Linux, X64, law-microlingo]
    # Run on push to main only; requires Docker on the runner.
    # Check Docker availability first — the step is skipped if Docker is absent.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker availability
        id: docker-check
        run: |
          if docker --version > /dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker is not available on this runner — skipping Cosmos emulator tests."
          fi

      - name: Start Cosmos DB emulator
        if: steps.docker-check.outputs.available == 'true'
        run: |
          docker pull mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
          docker run -d -p 8081:8081 -p 10251-10255:10251-10255 \
            --name cosmos-emulator \
            mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
          sleep 30

      - uses: actions/setup-dotnet@v4
        if: steps.docker-check.outputs.available == 'true'
        with:
          dotnet-version: "8.0.x"

      - name: Run Cosmos integration tests
        if: steps.docker-check.outputs.available == 'true'
        working-directory: backend
        env:
          CERTIGO_COSMOS_TESTS: "1"
          COSMOS_EMULATOR_ENDPOINT: "https://localhost:8081"
          COSMOS_EMULATOR_KEY: "C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw=="
        run: dotnet test tests/Certigo.Infrastructure.Tests/Certigo.Infrastructure.Tests.csproj --configuration Release --verbosity normal
