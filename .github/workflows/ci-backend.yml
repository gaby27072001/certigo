name: ci-backend

# .NET 8 Azure Functions API: restore, build (warnings as errors) and test.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "backend/**", ".github/workflows/ci-backend.yml" ]
  pull_request:
    paths: [ "backend/**", ".github/workflows/ci-backend.yml" ]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: [self-hosted, Linux, X64, microlingo-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        working-directory: backend
        run: dotnet restore Microlingo.sln
      - name: Build
        working-directory: backend
        run: dotnet build Microlingo.sln --configuration Release --no-restore -warnaserror
      - name: Test
        working-directory: backend
        run: dotnet test Microlingo.sln --configuration Release --no-build --verbosity normal

      - name: Generate SBOM (CycloneDX)
        working-directory: backend
        run: |
          dotnet tool install --global CycloneDX
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet CycloneDX Microlingo.sln --output ./sbom --json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend/sbom/**
          if-no-files-found: warn
          retention-days: 90
