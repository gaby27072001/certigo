name: ci-backend

# .NET 8 Azure Functions API: restore, build (warnings as errors) and test.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "backend/**", ".github/workflows/ci-backend.yml" ]
  pull_request:
    paths: [ "backend/**", ".github/workflows/ci-backend.yml" ]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    name: Build & test
    # SPOF mitigation (audit #1) : repli GitHub-hosted pré-câblé.
    # Défaut = runner self-hosted (comportement inchangé).
    # Pour basculer en urgence si le pool self-hosted est indisponible :
    #   1) définir la variable repo  BACKEND_CI_FALLBACK = true  (Settings > Actions > Variables)
    #   2) s'assurer que les GitHub-hosted runners sont ACTIVÉS pour le repo/org
    #      (ils sont désactivés par défaut ici — cf. lint-workflows.yml).
    # Repasser BACKEND_CI_FALLBACK à false (ou supprimer la variable) pour revenir au self-hosted.
    runs-on: ${{ vars.BACKEND_CI_FALLBACK == 'true' && 'ubuntu-latest' || (github.ref == 'refs/heads/main' && (vars.MAIN_CRITICAL_RUNNER_LABELS && fromJSON(vars.MAIN_CRITICAL_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","law-microlingo"]')) || (vars.PR_RUNNER_LABELS && fromJSON(vars.PR_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","microlingo-ci"]'))) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        working-directory: backend
        run: dotnet restore Certigo.sln
      - name: Build
        working-directory: backend
        run: dotnet build Certigo.sln --configuration Release --no-restore -warnaserror
      - name: Test
        working-directory: backend
        run: dotnet test Certigo.sln --configuration Release --no-build --verbosity normal

      - name: Generate SBOM (CycloneDX)
        working-directory: backend
        continue-on-error: true
        run: |
          dotnet tool install --global CycloneDX
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet CycloneDX Certigo.sln --output ./sbom --json
      - name: Upload SBOM
        continue-on-error: true # advisory artifact: never fail the gate (e.g. on storage quota)
        uses: actions/upload-artifact@v7
        with:
          name: backend-sbom
          path: backend/sbom/**
          if-no-files-found: warn
          retention-days: 90
