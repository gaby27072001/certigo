name: ci-backend

# .NET 8 Azure Functions API: restore, build (warnings as errors) and test.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "backend/**", ".github/workflows/ci-backend.yml" ]
  pull_request:
    paths: [ "backend/**", ".github/workflows/ci-backend.yml" ]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    # Runner cible configurable via la variable repo CI_RUNNER_LABELS (tableau JSON de labels).
    # Défaut (variable absente) = label RÉEL des runners enregistrés : "microlingo-ci".
    # Override ex. :  CI_RUNNER_LABELS = ["self-hosted","Linux","X64","law-microlingo"]
    # Rappel EMU : ubuntu-latest est désactivé par la politique d'entreprise sur ce repo ;
    #   l'override sert à suivre une dérive de label runner, pas à basculer en hosted.
    # (Remplace l'ancien levier BACKEND_CI_FALLBACK — retiré au profit d'une variable unique
    #  partagée avec cd-backend.)
    runs-on: ${{ vars.CI_RUNNER_LABELS != '' && fromJSON(vars.CI_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","microlingo-ci"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        working-directory: backend
        run: dotnet restore Certigo.sln
      - name: Build
        working-directory: backend
        run: dotnet build Certigo.sln --configuration Release --no-restore -warnaserror
      - name: Test
        working-directory: backend
        run: dotnet test Certigo.sln --configuration Release --no-build --verbosity normal

      - name: Generate SBOM (CycloneDX)
        working-directory: backend
        continue-on-error: true
        run: |
          dotnet tool install --global CycloneDX
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet CycloneDX Certigo.sln --output ./sbom --json
      - name: Upload SBOM
        continue-on-error: true # advisory artifact: never fail the gate (e.g. on storage quota)
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend/sbom/**
          if-no-files-found: warn
          retention-days: 90
