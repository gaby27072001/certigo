name: Governance bootstrap Phase A what-if

on:
  repository_dispatch:
    types: [governance-bootstrap-phase-a-what-if]

permissions: {}

concurrency:
  group: governance-bootstrap-phase-a-what-if
  cancel-in-progress: false

jobs:
  what-if:
    name: Admin/PIM Phase A what-if only
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: azure-governance-bootstrap-phase-a
    runs-on: [self-hosted, Linux, X64, certigo-trusted]
    env:
      # Isolates this job Azure CLI profile. DO NOT REMOVE - not redundant, and not about
      # whether this workflow passes. THE HAZARD IS THE azure/login STEP, NOT THE OUTCOME:
      # a green run rewrites the shared profile exactly as a red one does, before there is
      # any status to read. Certigo and certigo-content runners are separate registrations
      # on the SAME machines as the same OS user, so they share one ~/.azure; without this,
      # this job wipes the credentials out from under an in-flight certigo-content publish,
      # which then dies with "Could not retrieve credential from local cache". The aggressor
      # never sees it - only the victim, in another repository. Measured 2026-09-05.
      AZURE_CONFIG_DIR: /tmp/azure-govphasea-what-if-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Reject unexpected payload fields
        shell: bash
        env:
          CLIENT_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          jq -e 'type == "object" and length == 0' <<< "$CLIENT_PAYLOAD_JSON" >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed until admin planning variables exist
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          : "${AZURE_CLIENT_ID:?No GitHub variable is configured by this repository.}"
          : "${AZURE_TENANT_ID:?No GitHub variable is configured by this repository.}"
          : "${AZURE_SUBSCRIPTION_ID:?No GitHub variable is configured by this repository.}"
      - name: Azure login with approved admin planning identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run Phase A what-if without deployment
        shell: bash
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          PHASE_A_EVIDENCE_DIR: ${{ runner.temp }}/governance-phase-a-evidence
        run: bash infra/governance/what-if-phase-a.sh
      - name: Upload immutable Phase A evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: governance-phase-a-evidence
          path: ${{ runner.temp }}/governance-phase-a-evidence/**
          if-no-files-found: error
          retention-days: 90
