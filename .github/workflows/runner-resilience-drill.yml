name: Runner resilience drill

# Repository-dispatched, non-destructive proof that trusted operations survive PR-runner loss.
on:
  repository_dispatch:
    types: [runner-resilience-drill]

permissions: {}

concurrency:
  group: runner-resilience-drill
  cancel-in-progress: false

jobs:
  probe:
    name: Probe selected resilience path
    # repository_dispatch always loads this workflow from the default branch.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, certigo-trusted]
    steps:
      - name: Validate runner selection
        shell: bash
        env:
          CLIENT_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          EXPECTED_OFFLINE_RUNNER: ${{ github.event.client_payload.expected_offline_runner }}
          CURRENT_RUNNER_NAME: ${{ runner.name }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail

          if ! jq -e '
            type == "object"
            and keys == ["expected_offline_runner"]
            and (.expected_offline_runner | type == "string")
          ' <<< "$CLIENT_PAYLOAD_JSON" >/dev/null; then
            echo "::error::client_payload must contain only expected_offline_runner as a string."
            exit 1
          fi
          if [[ ! "$EXPECTED_OFFLINE_RUNNER" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "::error::expected_offline_runner has an invalid format."
            exit 1
          fi

          if [ "$RUNNER_KIND" != "self-hosted" ]; then
            echo "::error::Expected an Azure self-hosted runner, got $RUNNER_KIND."
            exit 1
          fi
          if [ "$CURRENT_RUNNER_NAME" = "$EXPECTED_OFFLINE_RUNNER" ]; then
            echo "::error::Runner $EXPECTED_OFFLINE_RUNNER was expected to be offline."
            exit 1
          fi

          {
            echo "### Runner resilience drill"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Mode | \`azure-trust-boundary-isolation\` |"
            echo "| Runner | \`$CURRENT_RUNNER_NAME\` |"
            echo "| Environment | \`$RUNNER_KIND\` |"
            echo "| Expected offline runner | \`${EXPECTED_OFFLINE_RUNNER:-n/a}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
