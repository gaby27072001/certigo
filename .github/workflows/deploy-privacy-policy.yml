name: deploy-privacy-policy

# Publie les pages légales publiques (confidentialité + suppression de compte).
#
# ATTENTION - cible historique, plus canonique. Ce workflow vise GitHub Pages,
# dont docs/PUBLIC_DOMAIN_MIGRATION.md a mesure le 2026-09-07 qu'il est ferme
# sur ce depot : le proprietaire est un compte Enterprise Managed Users, donc un
# site Pages ne peut etre publie que prive, et des pages legales doivent rester
# lisibles anonymement par la revue Apple/Google et par un utilisateur ayant
# desinstalle l'application.
#
# Les URLs canoniques sont desormais servies par Azure Static Web Apps :
#   https://www.certigo-app.com/privacy-policy/
#   https://www.certigo-app.com/account-deletion/
# Le sous-domaine www est obligatoire : le registrar ne supporte ni ALIAS ni
# ANAME, donc la racine ne peut pas pointer vers Azure Static Web Apps.
#
# Ce fichier est conserve tel quel parce que validate-workflow-security.mjs et
# tools/tests/test_project_state.py le nomment ; le retirer casserait un fichier
# de trust-root et un test. Il reste dormant : seul un repository_dispatch
# explicite le declenche, et il n'en a recu aucun depuis le 2026-06-30.
on:
  repository_dispatch:
    types: [deploy-privacy-policy]

permissions: {}

concurrency:
  group: pages-privacy-policy
  cancel-in-progress: false

jobs:
  build:
    name: Build privacy policy page
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, certigo-trusted]
    permissions:
      contents: read
      pages: write
    steps:
      - name: Reject unexpected payload fields
        shell: bash
        env:
          CLIENT_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          if ! jq -e 'type == "object" and length == 0' <<< "$CLIENT_PAYLOAD_JSON" >/dev/null; then
            echo "::error::deploy-privacy-policy does not accept client_payload fields."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build static legal pages
        run: node tools/build_public_pages.mjs --output _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, certigo-trusted]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
