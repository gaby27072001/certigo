name: deploy-privacy-policy

# Publie les pages légales publiques (confidentialité + suppression de compte).
# URL de secours immediate pour Google Play :
# https://gchambaud_microsoft.github.io/Certigo/privacy-policy/
# Ces URLs restent canoniques sur GitHub Pages : aucun domaine personnalise
# non controle ne doit etre configure comme alias ou destination de redirection.
on:
  repository_dispatch:
    types: [deploy-privacy-policy]

permissions: {}

concurrency:
  group: pages-privacy-policy
  cancel-in-progress: false

jobs:
  build:
    name: Build privacy policy page
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Reject unexpected payload fields
        shell: bash
        env:
          CLIENT_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          if ! jq -e 'type == "object" and length == 0' <<< "$CLIENT_PAYLOAD_JSON" >/dev/null; then
            echo "::error::deploy-privacy-policy does not accept client_payload fields."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.20.2"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Build static legal pages
        run: node tools/build_public_pages.mjs --output _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, certigo-trusted]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
