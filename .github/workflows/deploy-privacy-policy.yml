name: deploy-privacy-policy

# Publie une page publique (GitHub Pages) a partir de docs/legal/privacy-policy.md.
# URL de secours immediate pour Google Play :
# https://gchambaud_microsoft.github.io/Certigo/privacy-policy/
# Si le domaine certigo.app est configure ensuite, mapper le domaine sur GitHub Pages
# et conserver le chemin /privacy-policy/ pour une bascule transparente.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-privacy-policy
  cancel-in-progress: true

jobs:
  build:
    name: Build privacy policy page
    # CI-01 (fork-guard) : une PR de FORK execute du code non fiable -> elle NE doit
    # PAS toucher le runner self-hosted persistant.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    # CI-01 : approbation humaine requise pour les PR avant execution sur le runner self-hosted.
    environment: ${{ github.event_name == 'pull_request' && 'pr-ci' || '' }}
    runs-on: ${{ vars.CI_GITHUB_HOSTED_FALLBACK == 'true' && 'ubuntu-latest' || (vars.MAIN_CRITICAL_RUNNER_LABELS && fromJSON(vars.MAIN_CRITICAL_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]')) }}
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build static privacy policy page
        run: |
          mkdir -p _site/privacy-policy
          python3 - <<'PY'
          from html import escape
          from pathlib import Path

          source = Path("docs/legal/privacy-policy.md").read_text(encoding="utf-8")
          output = Path("_site/privacy-policy/index.html")
          output.write_text(
              """<!doctype html>
          <html lang="fr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Politique de confidentialite - Certigo</title>
            <style>
              body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem auto; max-width: 960px; line-height: 1.5; padding: 0 1rem; }
              pre { white-space: pre-wrap; word-break: break-word; background: #f6f8fa; padding: 1rem; border-radius: 8px; }
            </style>
          </head>
          <body>
            <h1>Politique de confidentialite - Certigo</h1>
            <pre>"""
              + escape(source)
              + """</pre>
          </body>
          </html>
          """,
              encoding="utf-8",
          )
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ vars.CI_GITHUB_HOSTED_FALLBACK == 'true' && 'ubuntu-latest' || (vars.MAIN_CRITICAL_RUNNER_LABELS && fromJSON(vars.MAIN_CRITICAL_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]')) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
