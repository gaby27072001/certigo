name: deploy-legal-pages-azure

# Publie les pages legales publiques sur Azure Static Web Apps (SKU Free).
#
# Pourquoi Azure et pas GitHub Pages : docs/PUBLIC_DOMAIN_MIGRATION.md a mesure
# le 2026-09-07 que Pages est ferme sur ce depot (proprietaire Enterprise
# Managed Users => site publiable en prive uniquement), alors que des pages
# legales doivent rester lisibles anonymement.
#
# Pourquoi le CLI Node et pas l'action officielle Azure/static-web-apps-deploy :
# cette action est une action Docker, et le runner certigo-trusted n'a pas de
# Docker. Mesure du 2026-09-07 sur vmss-certigo-runner-zonal_be505fa1 :
#   DOCKER=ABSENT  DAEMON=KO  NODE=/usr/bin/node v20.20.2  NPX=/usr/bin/npx
# L'action aurait echoue des sa premiere execution.
#
# L'etape de verification finale n'est pas decorative. Le 2026-09-07, une
# execution locale du meme CLI a rendu le code de sortie 0 sans rien publier :
# les deux URLs repondaient 404 juste apres. Un deploiement qui ne prouve pas
# ce qu'il sert ne prouve rien.

on:
  push:
    branches: [main]
    paths:
      - docs/legal/**
      - tools/build_public_pages.mjs
      - .github/scripts/public-domain-contract.mjs
      - .github/workflows/deploy-legal-pages-azure.yml
  repository_dispatch:
    types: [deploy-legal-pages-azure]

permissions: {}

concurrency:
  group: deploy-legal-pages-azure
  cancel-in-progress: false

jobs:
  publish:
    name: Publish legal pages to Azure Static Web Apps
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, certigo-trusted]
    environment:
      name: azure-legal-pages
      url: ${{ vars.PUBLIC_WEB_ORIGIN }}
    permissions:
      contents: read
    steps:
      - name: Reject unexpected payload fields
        shell: bash
        env:
          CLIENT_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "repository_dispatch" ]]; then
            exit 0
          fi
          if ! jq -e 'type == "object" and length == 0' <<< "$CLIENT_PAYLOAD_JSON" >/dev/null; then
            echo "::error::deploy-legal-pages-azure does not accept client_payload fields."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Require a verified public origin
        shell: bash
        env:
          TARGET_ENV: prod
          PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
          PUBLIC_DOMAIN_VERIFIED: ${{ vars.PUBLIC_DOMAIN_VERIFIED }}
          APPLE_CIAM_DOMAIN_RECONFIGURED: ${{ vars.APPLE_CIAM_DOMAIN_RECONFIGURED }}
        run: |
          set -euo pipefail
          node .github/scripts/public-domain-contract.mjs legal-pages

      - name: Build static legal pages
        shell: bash
        env:
          PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
          PUBLIC_DOMAIN_VERIFIED: ${{ vars.PUBLIC_DOMAIN_VERIFIED }}
          APPLE_CIAM_DOMAIN_RECONFIGURED: ${{ vars.APPLE_CIAM_DOMAIN_RECONFIGURED }}
        run: |
          set -euo pipefail
          rm -rf _site
          node tools/build_public_pages.mjs --output _site
          test -f _site/privacy-policy/index.html
          test -f _site/account-deletion/index.html
          # Azure refuse de publier un dossier sans fichier par defaut a la
          # racine, et son client rend 0 en le refusant.
          test -f _site/index.html
          test -f _site/staticwebapp.config.json

      - name: Publish to Azure Static Web Apps
        shell: bash
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_SWA_LEGAL_DEPLOYMENT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SWA_CLI_DEPLOYMENT_TOKEN}" ]]; then
            echo "::error::AZURE_SWA_LEGAL_DEPLOYMENT_TOKEN is missing from the azure-legal-pages environment."
            exit 1
          fi
          npx --yes @azure/static-web-apps-cli@2.0.7 deploy ./_site \
            --env production \
            --no-use-keychain

      - name: Prove the published pages are actually served
        shell: bash
        env:
          # Hote par defaut du Static Web App swa-certigo-legal. Il reste
          # joignable meme apres l'ajout du domaine personnalise, donc ce
          # controle ne depend d'aucun DNS et vaut avant comme apres.
          SWA_DEFAULT_HOST: https://jolly-field-0df85a303.6.azurestaticapps.net
          EXPECTED_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
        run: |
          set -euo pipefail

          # La propagation d'un deploiement SWA n'est pas instantanee.
          fetch_with_retry() {
            local url="$1" attempt body
            for attempt in 1 2 3 4 5 6; do
              if body="$(curl --fail --silent --show-error --location \
                --max-time 30 "$url")"; then
                printf '%s' "$body"
                return 0
              fi
              sleep 10
            done
            echo "::error::${url} never returned a successful response." >&2
            return 1
          }

          for slug in privacy-policy account-deletion; do
            url="${SWA_DEFAULT_HOST}/${slug}/"
            body="$(fetch_with_retry "$url")"

            expected_canonical="${EXPECTED_ORIGIN}/${slug}/"
            if ! grep -qF "<link rel=\"canonical\" href=\"${expected_canonical}\">" \
              <<< "$body"; then
              echo "::error::${url} does not carry the canonical ${expected_canonical}."
              exit 1
            fi

            # Controle negatif etalonne : le motif ci-dessus vient de trouver un
            # cas present dans ce meme corps, donc son silence ici est une vraie
            # absence et non une requete aveugle.
            if grep -qF 'github.io' <<< "$body"; then
              echo "::error::${url} still publishes a dead github.io address."
              exit 1
            fi

            echo "OK - ${url} served, canonical ${expected_canonical}, no dead address."
          done

          # Sans ce controle, un site qui repondrait 200 a tout ferait passer
          # les deux verifications precedentes pour une preuve.
          absent_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --location --max-time 30 \
            "${SWA_DEFAULT_HOST}/chemin-absent-controle-negatif/")"
          if [[ "$absent_status" == "200" ]]; then
            echo "::error::The site answers 200 for an absent path; the checks above prove nothing."
            exit 1
          fi
          echo "OK - an absent path returns ${absent_status}, so the checks above discriminate."

          # /.well-known/ doit rester servi tel quel, sans redirection : Apple
          # n'en suit aucune, et un lien profond qui echoue n'affiche pas
          # d'erreur, il ouvre le navigateur. Une regle attrape-tout ajoutee un
          # jour dans staticwebapp.config.json casserait cette propriete en
          # silence ; cette etape la ferait echouer bruyamment.
          well_known_redirects="$(curl --silent --output /dev/null \
            --write-out '%{num_redirects}' --location --max-time 30 \
            "${SWA_DEFAULT_HOST}/.well-known/apple-app-site-association")"
          if [[ "$well_known_redirects" != "0" ]]; then
            echo "::error::/.well-known/ is redirected (${well_known_redirects} hop(s)); Apple follows none."
            exit 1
          fi
          echo "OK - /.well-known/ is served without redirection."
