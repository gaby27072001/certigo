name: ci-backend

# .NET 8 Azure Functions API: restore, build (warnings as errors) and test.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "backend/**", ".github/workflows/ci-backend.yml" ]
  pull_request_target:

concurrency:
  group: ci-backend-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && (github.event.action == 'opened' || github.event.action == 'synchronize') && github.run_attempt == 1 && github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}-{2}', github.event_name, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.action == 'synchronize' && github.run_attempt == 1 && github.event.pull_request.number > 0 && github.event.after != '' }}

permissions:
  contents: read

jobs:
  freshness:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
    uses: ./.github/workflows/pr-head-freshness.yml
    with:
      pull-request-number: ${{ github.event.pull_request.number }}
      event-head-sha: ${{ github.event.pull_request.head.sha }}
    permissions:
      pull-requests: read

  # CI-08 : détecte si des chemins pertinents ont changé pour cette PR. Une PR qui ne
  # touche pas ces chemins skippe build-test AU NIVEAU JOB (le check requis passe alors
  # en success 'skipped'), au lieu d'un skip par filtre de chemin workflow-level qui
  # laisserait le check requis Pending et bloquerait la PR indéfiniment.
  changes:
    name: Detect changed paths
    needs: freshness
    if: ${{ always() && github.event_name == 'pull_request_target' && needs.freshness.outputs.current != 'false' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            relevant:
              - 'backend/**'
              - '.github/workflows/ci-backend.yml'
              # Tout docs/contracts/ est lu par les tests .NET : documents OpenAPI et
              # routes differees (ApiSurfaceContractTests), schemas, et golden vectors
              # cross-langage, aussi lus cote Dart. Sans ce filtre, une PR ne modifiant
              # qu'un contrat n'executerait pas la garde et fusionnerait en vert (#472).
              # Meme filtre dans ci-mobile.yml.
              - 'docs/contracts/**'

  build-test:
    name: Build & test
    needs: [freshness, changes]
    # pull_request_target loads this definition from main. Only internal head SHAs
    # execute here; forks are rejected by fork-pr-policy.yml.
    if: >-
      always()
      && (github.event_name != 'pull_request_target' || needs.freshness.outputs.current != 'false')
      && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'pull_request_target' || needs.changes.outputs.relevant != 'false')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    # Le runner-2 a /usr/share/dotnet NON inscriptible : on force actions/setup-dotnet à
    # installer dans un dossier temporaire inscriptible pour que le job passe sur les 2 runners.
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - name: Enforce initial PR freshness validation
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        shell: bash
        env:
          FRESHNESS_RESULT: ${{ needs.freshness.result }}
        run: |
          if [ "$FRESHNESS_RESULT" != "success" ]; then
            echo "::error::Initial PR head freshness validation did not succeed."
            exit 1
          fi
      - name: Recheck current PR head after assignment
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const eventHead = context.payload.pull_request.head.sha;
            if (!eventHead || pull.head.sha !== eventHead) {
              core.setFailed(`Superseded PR event ${eventHead || '<missing>'}; current head is ${pull.head.sha}.`);
            }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        working-directory: backend
        run: dotnet restore Certigo.sln --locked-mode
      - name: Build
        working-directory: backend
        run: dotnet build Certigo.sln --configuration Release --no-restore -warnaserror
      - name: Test
        working-directory: backend
        run: dotnet test Certigo.sln --configuration Release --no-build --verbosity normal

      - name: Generate SBOM (CycloneDX)
        working-directory: backend
        continue-on-error: true
        run: |
          dotnet tool install --global CycloneDX
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet CycloneDX Certigo.sln --output ./sbom --json
      - name: Upload SBOM
        continue-on-error: true # advisory artifact: never fail the gate (e.g. on storage quota)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-sbom
          path: backend/sbom/**
          if-no-files-found: warn
          retention-days: 90
