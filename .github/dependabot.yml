# Dependabot version updates only. Blocking security decisions are made by the
# repository-local OSV, NuGet, Checkov and CodeQL gates on Azure runners.
#
# Volumétrie volontairement basse : le parc de runners self-hosted est petit
# (2 VM). Des limites élevées saturent la file d'attente et bloquent la CI.
version: 2
updates:
  # .NET 8 backend (Azure Functions API + domain/application/infrastructure).
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      backend-dependencies:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  # Flutter app + shared Dart packages.
  - package-ecosystem: "pub"
    directories:
      - "/apps/mobile"
      - "/packages/*"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      dart-dependencies:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  # The CI workflows themselves (pin/refresh action versions).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Etc/UTC"
    target-branch: "main"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: [ "*" ]

  # Outillage npm racine (scripts de validation de contenu / lint workflow).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      npm-tooling:
        patterns: [ "*" ]
