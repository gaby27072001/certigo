plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Charge la configuration de signature release depuis android/key.properties.
// Ce fichier n'est JAMAIS committé : en local il est créé à la main, en CI il
// est généré à partir des secrets GitHub (voir docs/RELEASE_MOBILE.md).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.microlingo.microlingo"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // applicationId publié sur le Google Play Store.
        // ⚠️ NON modifiable après le 1er upload Play — placeholder à confirmer
        // avant publication réelle (voir docs/RELEASE_MOBILE.md).
        applicationId = "com.microlingo.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Schéma de redirection OAuth/OIDC natif pour flutter_appauth.
        // L'activité RedirectUriReceiverActivity du plugin capture microlingo://auth.
        manifestPlaceholders += [appAuthRedirectScheme: "microlingo"]
    }

    signingConfigs {
        release {
            // Valeurs fournies via android/key.properties (jamais committé).
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Signe en release quand key.properties existe (CI / build store),
            // sinon retombe sur la clé debug pour que `flutter run --release`
            // fonctionne en local sans keystore.
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
