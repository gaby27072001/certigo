name: certigo
description: "Certigo — premium mobile learning for Microsoft certifications. Concepts, applied examples, adaptive review."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.4"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local packages (monorepo, wired via Melos / path deps)
  prism_ui:
    path: ../../packages/prism_ui
  core:
    path: ../../packages/core
  data:
    path: ../../packages/data
  cortex:
    path: ../../packages/cortex

  # State & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Platform
  intl: ">=0.19.0 <0.21.0"

  # Auth — Entra External ID broker (Microsoft / Google / Apple), OIDC + PKCE
  flutter_appauth: ^8.0.0
  flutter_secure_storage: ^9.2.2

  # Offline-first persistence & connectivity (iOS + Android)
  shared_preferences: ^2.3.0
  connectivity_plus: ^6.0.0

  # UX engagement additions
  confetti: ^0.7.0
  share_plus: ^10.0.0
  flutter_local_notifications: ^17.2.0
  flutter_timezone: ^5.1.0
  timezone: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Utilisé par les tests d'auth pour piloter le temps (filet de sécurité
  # `.timeout()` de la connexion sociale) sans attendre réellement.
  fake_async: ^1.3.1

flutter:
  uses-material-design: true

  # Mascot artwork — uncomment once you drop your characters into
  # assets/mascots/<id>/<mood>.png (see assets/mascots/README.md), then run
  # `flutter pub get`. Also uncomment the line in lib/app/mascots.dart.
  # assets:
  #   - assets/mascots/
