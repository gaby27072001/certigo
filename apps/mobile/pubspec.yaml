name: microlingo
description: "Microlingo — premium mobile learning for Microsoft certifications. Concepts, applied examples, adaptive review."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local packages (monorepo, wired via Melos / path deps)
  prism_ui:
    path: ../../packages/prism_ui
  core:
    path: ../../packages/core
  data:
    path: ../../packages/data
  cortex:
    path: ../../packages/cortex

  # State & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Platform
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Offline-first persistence & connectivity (iOS + Android)
  shared_preferences: ^2.3.0
  connectivity_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
