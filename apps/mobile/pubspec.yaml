name: certigo
description: "Certigo — premium multi-cloud certification learning with adaptive review."
publish_to: none
version: 1.1.3+12

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.4"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local packages (monorepo, wired via Melos / path deps)
  prism_ui:
    path: ../../packages/prism_ui
  core:
    path: ../../packages/core
  data:
    path: ../../packages/data
  cortex:
    path: ../../packages/cortex

  # State & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Platform
  intl: ">=0.19.0 <0.21.0"

  # Auth — Entra External ID broker (Microsoft / Google / Apple), OIDC + PKCE
  flutter_appauth: ^8.0.0
  flutter_secure_storage: ^10.3.4

  # Offline-first persistence & connectivity (iOS + Android)
  shared_preferences: ^2.3.0
  connectivity_plus: ^6.0.0
  path_provider: ^2.1.5

  # Error-only crash reporting; native iOS capture is provided by Sentry Cocoa.
  sentry_flutter: ^9.29.0

  # UX engagement additions
  confetti: ^0.7.0
  share_plus: ^10.0.0
  flutter_local_notifications: ^17.2.0
  flutter_timezone: ^5.1.0
  timezone: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sentry_dart_plugin: ^3.4.0
  # Utilisé par les tests d'auth pour piloter le temps (filet de sécurité
  # `.timeout()` de la connexion sociale) sans attendre réellement.
  fake_async: ^1.3.1

flutter:
  uses-material-design: true

  # Mascot artwork — uncomment once you drop your characters into
  # assets/mascots/<id>/<mood>.png (see assets/mascots/README.md), then run
  # `flutter pub get`. Also uncomment the line in lib/app/mascots.dart.
  # assets:
  #   - assets/mascots/

sentry:
  upload_debug_symbols: true
  upload_source_maps: false
  upload_sources: false
  wait_for_processing: true
  commits: false
  log_level: warn
