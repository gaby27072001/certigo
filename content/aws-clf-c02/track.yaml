# AWS Certified Cloud Practitioner — aws certification track.
# Domain weights mirror the official CLF-C02 skills outline and sum to 1.0.
id: aws-clf-c02
code: "CLF-C02"
provider: aws
title: "AWS Certified Cloud Practitioner"
level: fundamentals
examCode: "CLF-C02"
sourceUrl: "https://aws.amazon.com/certification/certified-cloud-practitioner/"
summary: |
  Certification d'entrée AWS validant une compréhension globale du cloud AWS : valeur du cloud, sécurité et conformité, services principaux et modèles de tarification. Idéale pour les profils non techniques comme premier jalon.
domains:
