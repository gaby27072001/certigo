    weight: 0.24
  - id: security-compliance
    name: "Sécurité et conformité"
    weight: 0.3
  - id: cloud-tech
    name: "Technologies et services cloud"
    weight: 0.34
  - id: billing-pricing
    name: "Facturation, tarification et support"
    weight: 0.12
units:
  - id: awsclfc02-u-cloud-concepts
    domainId: cloud-concepts
    title: "Concepts du cloud"
    lessons:
      - awsclfc02-l-avantages-et-valeur-du-cloud-aws
  - id: awsclfc02-u-security-compliance
    domainId: security-compliance
    title: "Sécurité et conformité"
    lessons:
      - awsclfc02-l-le-modele-de-responsabilite-partagee
  - id: awsclfc02-u-cloud-tech
    domainId: cloud-tech
    title: "Technologies et services cloud"
    lessons:
      - awsclfc02-l-services-principaux-calcul-stockage-et-reseau
  - id: awsclfc02-u-billing-pricing
    domainId: billing-pricing
    title: "Facturation, tarification et support"
    lessons:
      - awsclfc02-l-modeles-de-tarification-et-outils-de-couts
