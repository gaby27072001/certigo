id: az104-l-vnet-fundamentals
trackId: az-104
unitId: az104-u-networking
domainId: networking
title: Réseaux virtuels — sous-réseaux et appairage
estMinutes: 8

blocks:
  - type: hook
    conceptId: c-vnet
    body: >
      Le **réseau virtuel** (VNet) est le réseau privé de vos ressources dans
      Azure : il définit qui peut parler à qui. Mal découpé, il bloque ou expose ;
      bien conçu, il devient l'ossature sûre de toute votre infrastructure.

  - type: concept
    conceptId: c-vnet
    title: Espaces d'adressage, sous-réseaux, appairage
    body: >
      Un VNet possède un **espace d'adressage** privé en notation **CIDR** (p. ex.
      `10.0.0.0/16`), découpé en **sous-réseaux** (`10.0.1.0/24`…). Azure
      **réserve 5 adresses** par sous-réseau (la première, la dernière et trois
      internes), à déduire du nombre d'IP utilisables.


      Une ressource reçoit une **IP privée** (statique ou dynamique) et,
      éventuellement, une **IP publique**. La résolution de noms passe par
      **Azure DNS** et les **zones DNS privées**.


      Pour relier deux VNets, on utilise l'**appairage** (peering) : trafic privé
      via le réseau Microsoft, faible latence. Attention, le peering n'est **pas
      transitif** — si A est appairé à B et B à C, A ne parle pas à C
      automatiquement ; il faut un appairage direct ou un routage dédié.

  - type: example
    conceptId: c-vnet
    body: >
      Vous séparez une application en deux sous-réseaux : `web` (exposé) et `data`
      (privé). Plus tard, une autre équipe a son propre VNet et doit accéder à un
      service partagé : vous créez un **appairage** entre les deux VNets. Le
      trafic reste privé, sans passer par Internet.

  - type: check
    conceptId: c-vnet
    check:
      id: az104-l-vnet-fundamentals-check-1
      conceptId: c-vnet
      type: mcq
      difficulty: 3
      stem: >
        VNet A est appairé à VNet B, et VNet B est appairé à VNet C. Sans
        configuration supplémentaire, quelle communication est possible ?
      options:
        - { id: a, label: "A ↔ B et B ↔ C, mais pas A ↔ C" }
        - { id: b, label: "A, B et C communiquent tous entre eux" }
        - { id: c, label: "Aucune communication, le peering ne transporte pas le trafic privé" }
        - { id: d, label: "Seul C peut joindre A, mais pas l'inverse" }
      correct: [a]
      explanation: >
        L'appairage de VNets n'est **pas transitif** : A parle à B et B parle à C,
        mais A ne joint pas C tant qu'un appairage direct A–C (ou un routage via
        une appliance/Virtual WAN) n'est pas ajouté. Le peering transporte bien le
        trafic privé, donc « aucune communication » est faux.

  - type: recap
    conceptId: c-vnet
    body: >
      VNet = espace d'adressage CIDR découpé en sous-réseaux (5 IP réservées
      chacun). IP privée/publique, statique/dynamique ; DNS Azure et zones
      privées. Appairage = trafic privé inter-VNet, **non transitif**.
