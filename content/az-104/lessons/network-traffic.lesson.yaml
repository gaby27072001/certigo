id: az104-l-network-traffic
trackId: az-104
unitId: az104-u-networking
domainId: networking
title: Filtrage, routage et répartition de charge
estMinutes: 9

blocks:
  - type: hook
    conceptId: c-net-traffic
    body: >
      Une fois le réseau virtuel posé, trois questions d'administrateur
      reviennent : **quel trafic est autorisé** (filtrage), **par où passe-t-il**
      (routage) et **comment le distribuer** entre plusieurs serveurs
      (répartition de charge).

  - type: concept
    conceptId: c-net-traffic
    title: NSG, routes et répartiteurs
    body: >
      Un **groupe de sécurité réseau** (NSG) filtre le trafic via des règles
      (source, destination, port, protocole, priorité) ; il est **avec état**
      (stateful : la réponse à un flux autorisé l'est aussi) et comporte des
      règles par défaut. Les **groupes de sécurité d'application** (ASG)
      regroupent des VM par rôle pour écrire des règles lisibles. Pour un filtrage
      centralisé et avancé, **Azure Firewall**.


      Le **routage** : Azure fournit des **routes système** ; on les surcharge
      avec des **routes définies par l'utilisateur** (UDR) dans une **table de
      routage**, par exemple pour forcer le trafic à travers un pare-feu.


      La **répartition de charge** : l'**Azure Load Balancer** opère en **couche 4**
      (TCP/UDP) ; l'**Application Gateway** opère en **couche 7** (HTTP/HTTPS),
      avec routage par URL et **WAF**. **Azure Bastion** donne un accès RDP/SSH
      sécurisé sans IP publique sur les VM.

  - type: example
    conceptId: c-net-traffic
    body: >
      Votre application web doit router `/images/*` vers un pool de serveurs et
      `/api/*` vers un autre, le tout protégé contre les attaques web. C'est un
      besoin de **couche 7** : vous déployez une **Application Gateway** avec
      routage par chemin d'URL et le **WAF** activé. Un simple Load Balancer L4 ne
      saurait pas lire l'URL.

  - type: check
    conceptId: c-net-traffic
    check:
      id: az104-l-network-traffic-check-1
      conceptId: c-net-traffic
      type: mcq
      difficulty: 3
      stem: >
        Vous devez distribuer le trafic HTTP selon le chemin de l'URL (/api vs
        /web) et appliquer un pare-feu applicatif (WAF). Quel service ?
      options:
        - { id: a, label: "Azure Load Balancer (couche 4)" }
        - { id: b, label: "Application Gateway (couche 7) avec WAF" }
        - { id: c, label: "Un groupe de sécurité réseau (NSG)" }
        - { id: d, label: "Une table de routage avec UDR" }
      correct: [b]
      explanation: >
        Le routage par **URL** et le **WAF** sont des fonctions de **couche 7**,
        propres à l'**Application Gateway**. Le Load Balancer ne voit que TCP/UDP
        (couche 4) ; un NSG filtre mais ne répartit pas la charge ; une UDR
        contrôle le chemin, pas la distribution applicative.

  - type: recap
    conceptId: c-net-traffic
    body: >
      Filtrage : NSG (stateful, par règles priorisées) + ASG ; Azure Firewall pour
      le central. Routage : routes système surchargées par UDR. Charge : Load
      Balancer (L4) vs Application Gateway (L7 + WAF) ; Bastion pour l'accès admin
      sans IP publique.
