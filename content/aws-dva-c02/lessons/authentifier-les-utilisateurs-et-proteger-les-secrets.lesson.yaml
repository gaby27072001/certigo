id: awsdvac02-l-authentifier-les-utilisateurs-et-proteger-les-secrets
trackId: aws-dva-c02
unitId: awsdvac02-u-security
domainId: security
title: "Authentifier les utilisateurs et protéger les secrets"
estMinutes: 6
blocks:
  - type: hook
    conceptId: c-authentifier-les-utilisateurs-et-proteger-les-secrets
    body: |
      Dans l'examen DVA-C02, « Authentifier les utilisateurs et protéger les secrets » revient régulièrement. Sauriez-vous l'expliquer simplement ?
  - type: concept
    conceptId: c-authentifier-les-utilisateurs-et-proteger-les-secrets
    title: "Authentifier les utilisateurs et protéger les secrets"
    body: |
      Côté application, Amazon Cognito gère l'authentification et la fédération des utilisateurs, AWS Secrets Manager stocke et fait tourner les secrets (mots de passe, clés d'API), et IAM contrôle les permissions des services. Les données sensibles doivent être chiffrées.
  - type: check
    conceptId: c-authentifier-les-utilisateurs-et-proteger-les-secrets
    check:
      id: awsdvac02-l-authentifier-les-utilisateurs-et-proteger-les-secrets-check-1
      conceptId: c-authentifier-les-utilisateurs-et-proteger-les-secrets
      type: mcq
      difficulty: 2
      stem: |
        Quel service AWS gère l'inscription, la connexion et la fédération des utilisateurs d'une application web ou mobile ?
      options:
        - { id: a, label: "Amazon Cognito" }
        - { id: b, label: "AWS CodeBuild" }
        - { id: c, label: "Amazon CloudFront" }
        - { id: d, label: "Amazon SQS" }
      correct: [a]
      explanation: |
        Amazon Cognito fournit des pools d'utilisateurs et d'identités pour gérer l'authentification, l'inscription et la fédération (Google, Facebook, SAML) des applications.
  - type: recap
    conceptId: c-authentifier-les-utilisateurs-et-proteger-les-secrets
    body: |
      Retenez l'essentiel de « Authentifier les utilisateurs et protéger les secrets » pour la certification DVA-C02.
