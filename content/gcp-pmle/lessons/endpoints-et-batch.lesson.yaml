      type: mcq
      difficulty: 1
      stem: |
        Comment servir des prédictions à faible latence ?
      options:
        - { id: a, label: "Endpoints en ligne Vertex AI" }
        - { id: b, label: "Email" }
        - { id: c, label: "DNS" }
        - { id: d, label: "CDN" }
      correct: [a]
      explanation: |
        Les endpoints répondent en temps réel.
  - type: recap
    conceptId: c-endpoints-et-batch
    body: |
      Retenez l'essentiel de « Endpoints et batch » pour la certification PMLE.
