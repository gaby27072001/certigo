blocks:
  - type: hook
    conceptId: c-endpoints-et-batch
    body: |
      Dans l'examen PMLE, « Endpoints et batch » revient régulièrement. Sauriez-vous l'expliquer simplement ?
  - type: concept
    conceptId: c-endpoints-et-batch
    title: "Endpoints et batch"
    body: |
      Vertex AI sert des prédictions en ligne (endpoints) ou par lots. La répartition du trafic permet des tests A/B de modèles.
