# Google Cloud Associate Data Practitioner — google certification track.
# Domain weights mirror the official ADP skills outline and sum to 1.0.
id: gcp-associate-data-practitioner
code: "ADP"
provider: google
title: "Google Cloud Associate Data Practitioner"
level: associate
examCode: "Associate Data Practitioner"
sourceUrl: "https://cloud.google.com/learn/certification/data-practitioner"
summary: |
  Certification data généraliste : préparation et ingestion des données, analyse et présentation, pipelines, gouvernance. Pour des profils data débutants sur Google Cloud.
domains:
