domainId: security
title: "IAM et responsabilité partagée"
estMinutes: 6
blocks:
  - type: hook
    conceptId: c-iam-et-responsabilite-partagee
    body: |
      Dans l'examen 1Z0-1085-24, « IAM et responsabilité partagée » revient régulièrement. Sauriez-vous l'expliquer simplement ?
  - type: concept
    conceptId: c-iam-et-responsabilite-partagee
    title: "IAM et responsabilité partagée"
    body: |
      IAM gère utilisateurs, groupes et politiques. La sécurité est partagée entre Oracle (du cloud) et le client (dans le cloud).
  - type: check
    conceptId: c-iam-et-responsabilite-partagee
    check:
      id: oracleocifoundations-l-iam-et-responsabilite-partagee-check-1
      conceptId: c-iam-et-responsabilite-partagee
      type: mcq
      difficulty: 1
      stem: |
        Quel service contrôle les permissions sur OCI ?
      options:
        - { id: a, label: "IAM" }
        - { id: b, label: "VCN" }
        - { id: c, label: "DNS" }
        - { id: d, label: "WAF" }
      correct: [a]
      explanation: |
        IAM définit qui peut accéder à quelles ressources via des politiques.
  - type: recap
    conceptId: c-iam-et-responsabilite-partagee
    body: |
      Retenez l'essentiel de « IAM et responsabilité partagée » pour la certification 1Z0-1085-24.
