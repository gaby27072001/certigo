domainId: core-services
title: "Compute, Storage, Networking"
estMinutes: 6
blocks:
  - type: hook
    conceptId: c-compute-storage-networking
    body: |
      Dans l'examen 1Z0-1085-24, « Compute, Storage, Networking » revient régulièrement. Sauriez-vous l'expliquer simplement ?
  - type: concept
    conceptId: c-compute-storage-networking
    title: "Compute, Storage, Networking"
    body: |
      OCI organise les ressources en régions, domaines de disponibilité et domaines de pannes. Compute, Block/Object Storage et VCN sont les briques de base.
  - type: check
    conceptId: c-compute-storage-networking
    check:
      id: oracleocifoundations-l-compute-storage-networking-check-1
      conceptId: c-compute-storage-networking
      type: mcq
      difficulty: 1
      stem: |
        Quel composant isole un réseau virtuel privé dans OCI ?
      options:
        - { id: a, label: "VCN" }
        - { id: b, label: "IAM" }
        - { id: c, label: "OKE" }
        - { id: d, label: "ATP" }
      correct: [a]
      explanation: |
        Le Virtual Cloud Network (VCN) isole un réseau privé dans une région.
  - type: recap
    conceptId: c-compute-storage-networking
    body: |
      Retenez l'essentiel de « Compute, Storage, Networking » pour la certification 1Z0-1085-24.
