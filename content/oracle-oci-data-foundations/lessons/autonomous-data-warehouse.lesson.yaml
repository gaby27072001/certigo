        Quel service est un entrepôt analytique autonome ?
      options:
        - { id: a, label: "ADW" }
        - { id: b, label: "OKE" }
        - { id: c, label: "VCN" }
        - { id: d, label: "WAF" }
      correct: [a]
      explanation: |
        Autonomous Data Warehouse cible l'analytique.
  - type: recap
    conceptId: c-autonomous-data-warehouse
