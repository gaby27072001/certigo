      conceptId: c-partitionnement-et-clustering
      type: mcq
      difficulty: 2
      stem: |
        Quel levier réduit le coût des requêtes BigQuery ?
      options:
        - { id: a, label: "Partitionner et clusterer les tables" }
        - { id: b, label: "Tout scanner" }
        - { id: c, label: "Désactiver IAM" }
        - { id: d, label: "VPN" }
      correct: [a]
      explanation: |
        Le partitionnement limite les données scannées.
  - type: recap
    conceptId: c-partitionnement-et-clustering
    body: |
      Retenez l'essentiel de « Partitionnement et clustering » pour la certification PDE.
