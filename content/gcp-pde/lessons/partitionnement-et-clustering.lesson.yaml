blocks:
  - type: hook
    conceptId: c-partitionnement-et-clustering
    body: |
      Dans l'examen PDE, « Partitionnement et clustering » revient régulièrement. Sauriez-vous l'expliquer simplement ?
  - type: concept
    conceptId: c-partitionnement-et-clustering
    title: "Partitionnement et clustering"
    body: |
      Dans BigQuery, partitionner par date et clusterer par colonnes réduit coûts et latence. Le schéma influence performances et facturation.
  - type: check
    conceptId: c-partitionnement-et-clustering
    check:
