# Microsoft Azure Fundamentals — certification track.
# Validated in CI against content/schema/track.schema.json.
# Domain weights mirror the public AZ-900 exam skills outline and sum to 1.0.
id: az-900
code: AZ-900
provider: microsoft
title: Microsoft Azure Fundamentals
level: fundamentals
summary: >
  Comprendre les concepts du cloud, les principaux services Azure, et les notions
  de gouvernance, sécurité, confidentialité, coûts et SLA — sans prérequis technique.

domains:
  - id: cloud-concepts
    name: Concepts du cloud
    weight: 0.28
  - id: architecture-services
    name: Architecture & services Azure
    weight: 0.38
  - id: management-governance
    name: Gestion & gouvernance
    weight: 0.34

# NOTE: units are authored across the three weighted domains. Every lesson id
# listed here must have a matching file in lessons/ (enforced by ci-content).
units:
  - id: az900-u-cloud-concepts
    domainId: cloud-concepts
    title: Concepts du cloud
    lessons:
      - az900-l-capex-opex
      - az900-l-shared-responsibility
      - az900-l-cloud-models
      - az900-l-cloud-benefits
  - id: az900-u-core-architecture
    domainId: architecture-services
    title: Architecture Azure
    lessons:
      - az900-l-regions-az
      - az900-l-management-hierarchy
  - id: az900-u-compute-network
    domainId: architecture-services
    title: Compute & réseau
    lessons:
      - az900-l-compute-options
      - az900-l-networking-basics
  - id: az900-u-cost-management
    domainId: management-governance
    title: Coûts Azure
    lessons:
      - az900-l-cost-management
      - az900-l-governance-policy
  - id: az900-u-identity-governance
    domainId: management-governance
    title: Identité & gouvernance
    lessons:
      - az900-l-rbac
      - az900-l-defender-overview
