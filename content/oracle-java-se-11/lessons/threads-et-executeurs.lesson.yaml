    conceptId: c-threads-et-executeurs
    body: |
      Dans l'examen 1Z0-819, « Threads et exécuteurs » revient régulièrement. Sauriez-vous l'expliquer simplement ?
  - type: concept
    conceptId: c-threads-et-executeurs
    title: "Threads et exécuteurs"
    body: |
      ExecutorService gère des pools de threads ; les collections concurrentes évitent les conditions de course.
