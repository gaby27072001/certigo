      type: mcq
      difficulty: 1
      stem: |
        Que représente l'entonnoir (funnel) marketing ?
      options:
        - { id: a, label: "Le parcours du prospect jusqu'à l'achat et la fidélité" }
        - { id: b, label: "Un serveur web" }
        - { id: c, label: "Un format d'image" }
        - { id: d, label: "Une base SQL" }
      correct: [a]
      explanation: |
        Le funnel modélise les étapes sensibilisation → considération → conversion → fidélisation.
