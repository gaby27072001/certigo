    title: "L'entonnoir marketing"
    body: |
      Le funnel guide le client de la sensibilisation à l'achat puis à la fidélité. Chaque étape appelle des canaux et messages adaptés. Comprendre le parcours optimise les budgets publicitaires.
  - type: check
    conceptId: c-l-entonnoir-marketing
