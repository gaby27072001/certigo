    body: |
      Dans l'examen PCDOE, « Monitoring, Trace et Profiler » revient régulièrement. Sauriez-vous l'expliquer simplement ?
  - type: concept
    conceptId: c-monitoring-trace-et-profiler
    title: "Monitoring, Trace et Profiler"
    body: |
      Cloud Monitoring, Logging, Trace et Profiler diagnostiquent latence et coûts. L'autoscaling et le tuning améliorent la performance.
  - type: check
    conceptId: c-monitoring-trace-et-profiler
