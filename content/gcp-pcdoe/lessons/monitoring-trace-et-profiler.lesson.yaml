      conceptId: c-monitoring-trace-et-profiler
      type: mcq
      difficulty: 1
      stem: |
        Quel outil mesure la latence distribuée des requêtes ?
      options:
        - { id: a, label: "Cloud Trace" }
        - { id: b, label: "Cloud DNS" }
        - { id: c, label: "Cloud CDN" }
        - { id: d, label: "Cloud VPN" }
      correct: [a]
      explanation: |
        Cloud Trace suit les requêtes inter-services.
  - type: recap
    conceptId: c-monitoring-trace-et-profiler
