    body: |
      Dans l'examen GENAI-LEADER, « LLM et modèles de fondation » revient régulièrement. Sauriez-vous l'expliquer simplement ?
  - type: concept
    conceptId: c-llm-et-modeles-de-fondation
    title: "LLM et modèles de fondation"
    body: |
      Les grands modèles de langage (LLM) comme Gemini sont entraînés sur d'immenses corpus pour générer texte, code et images. Vertex AI fournit l'accès managé à ces modèles.
  - type: check
    conceptId: c-llm-et-modeles-de-fondation
