      type: mcq
      difficulty: 1
      stem: |
        Quel service Google Cloud donne accès aux modèles de fondation managés ?
      options:
        - { id: a, label: "Vertex AI" }
        - { id: b, label: "Cloud VPN" }
        - { id: c, label: "Cloud DNS" }
        - { id: d, label: "Cloud Storage" }
      correct: [a]
      explanation: |
        Vertex AI est la plateforme ML/IA générative de Google Cloud.
