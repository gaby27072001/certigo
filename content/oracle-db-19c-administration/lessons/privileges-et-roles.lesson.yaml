    conceptId: c-privileges-et-roles
    body: |
      Dans l'examen 1Z0-082, « Privilèges et rôles » revient régulièrement. Sauriez-vous l'expliquer simplement ?
  - type: concept
    conceptId: c-privileges-et-roles
    title: "Privilèges et rôles"
    body: |
      Rôles et privilèges contrôlent les permissions ; le moindre privilège protège.
