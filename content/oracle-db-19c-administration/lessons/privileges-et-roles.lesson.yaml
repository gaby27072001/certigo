      conceptId: c-privileges-et-roles
      type: mcq
      difficulty: 1
      stem: |
        Quel objet regroupe des privilèges réutilisables ?
      options:
        - { id: a, label: "Rôle" }
        - { id: b, label: "Synonyme" }
        - { id: c, label: "Séquence" }
        - { id: d, label: "Vue" }
      correct: [a]
      explanation: |
        Un rôle agrège des privilèges accordables.
  - type: recap
    conceptId: c-privileges-et-roles
