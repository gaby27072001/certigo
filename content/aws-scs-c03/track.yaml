    name: "Gestion des incidents de sécurité"
    weight: 0.14
  - id: infra-security
    name: "Sécurité de l'infrastructure"
    weight: 0.18
  - id: iam
    name: "Gestion des identités et des accès"
    weight: 0.2
  - id: data-protection
    name: "Protection des données"
    weight: 0.18
  - id: governance
    name: "Fondations de sécurité et gouvernance"
    weight: 0.14
units:
  - id: awsscsc03-u-threat-detection
    domainId: threat-detection
    title: "Détection des menaces"
    lessons:
      - awsscsc03-l-detecter-les-menaces-avec-guardduty
  - id: awsscsc03-u-incident-response
    domainId: incident-response
    title: "Gestion des incidents de sécurité"
    lessons:
      - awsscsc03-l-repondre-aux-incidents-de-securite
