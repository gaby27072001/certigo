# AWS Certified Security – Specialty — aws certification track.
# Domain weights mirror the official SCS-C03 skills outline and sum to 1.0.
id: aws-scs-c03
code: "SCS-C03"
provider: aws
title: "AWS Certified Security – Specialty"
level: specialty
examCode: "SCS-C03"
sourceUrl: "https://aws.amazon.com/certification/certified-security-specialty/"
summary: |
  Certification spécialisée en sécurité AWS : détection des menaces, réponse aux incidents, sécurité de l'infrastructure, gestion des identités, protection des données et gouvernance. Version SCS-C03 en vigueur depuis décembre 2025.
domains:
