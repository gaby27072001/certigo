      type: mcq
      difficulty: 2
      stem: |
        Quel rôle protège contre la perte du site primaire ?
      options:
        - { id: a, label: "Standby" }
        - { id: b, label: "Bucket" }
        - { id: c, label: "Vue" }
        - { id: d, label: "NAT" }
      correct: [a]
      explanation: |
        Le standby Data Guard assure la continuité.
