blocks:
  - type: hook
    conceptId: c-classes-et-heritage
    body: |
      Dans l'examen 1Z0-808, « Classes et héritage » revient régulièrement. Sauriez-vous l'expliquer simplement ?
  - type: concept
    conceptId: c-classes-et-heritage
    title: "Classes et héritage"
    body: |
      Encapsulation, héritage et polymorphisme structurent le code. extends crée une sous-classe.
