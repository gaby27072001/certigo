    conceptId: c-classes-et-heritage
    check:
      id: oraclejavase8-l-classes-et-heritage-check-1
      conceptId: c-classes-et-heritage
      type: mcq
      difficulty: 1
      stem: |
        Quel mot-clé établit l'héritage ?
      options:
        - { id: a, label: "extends" }
        - { id: b, label: "import" }
        - { id: c, label: "static" }
        - { id: d, label: "final" }
      correct: [a]
      explanation: |
        extends fait hériter une classe d'une autre.
  - type: recap
    conceptId: c-classes-et-heritage
